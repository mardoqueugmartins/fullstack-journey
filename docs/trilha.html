[], "c": "const tools = [{\n  name: \"consultar_horarios\",\n  description: \"Lista horários livres de um dia (formato AAAA-MM-DD)\",\n  input_schema: { type: \"object\", properties: { data: { type: \"string\" } }, required: [\"data\"] },\n}];\n\nlet msgs = [{ role: \"user\", content: \"Tem horário dia 10 de dezembro?\" }];\nfor (let passo = 0; passo < 5; passo++) {\n  const r = await client.messages.create({ model, max_tokens: 500, tools, messages: msgs });\n  msgs.push({ role: \"assistant\", content: r.content });\n  const uso = r.content.find(b => b.type === \"tool_use\");\n  if (!uso) break;                               // respondeu em texto: fim\n  const resultado = await horariosLivres(uso.input.data); // seu código executa\n  msgs.push({ role: \"user\", content: [{ type: \"tool_result\", tool_use_id: uso.id, content: JSON.stringify(resultado) }] });\n}", "u": "Assistentes que precisam consultar ou mudar dados do seu sistema.", "x": "Deixar o agente executar ações sem limite e sem confirmação, como apagar ou pagar."}, "22-0": {"s": ["Você manda um texto para um modelo de embeddings e recebe um vetor (centenas ou milhares de números).", "Faça isso para todos os seus textos e guarde os vetores.", "Na busca, gere o vetor da pergunta e compare com todos: a similaridade de cosseno vai de -1 a 1 (1 = mesmo sentido).", "Ordene pelos mais parecidos. Esses são os resultados."], "e": ["Embedding transforma um texto numa lista de números que representa o significado dele, como uma coordenada num mapa de ideias. Frases parecidas ficam perto: \"fui demitido\" fica perto de \"perdi o emprego\", mesmo sem nenhuma palavra igual. Medindo a distância entre esses pontos, você faz uma busca pelo sentido, não pela palavra exata."], "l": [], "g": [], "q": [], "c": "function cosseno(a: number[], b: number[]) {\n  let dot = 0, na = 0, nb = 0;\n  for (let i = 0; i < a.length; i++) {\n    dot += a[i] * b[i]; na += a[i] ** 2; nb += b[i] ** 2;\n  }\n  return dot / (Math.sqrt(na) * Math.sqrt(nb));\n}\n\nconst docs = [{ texto: \"Perdi o emprego sem aviso\", vetor: [...] }, ...];\nconst vPergunta = await gerarEmbedding(\"fui demitido\");\nconst ranking = docs\n  .map(d => ({ ...d, score: cosseno(vPergunta, d.vetor) }))\n  .sort((a, b) => b.score - a.score)\n  .slice(0, 3);", "u": "Busca inteligente, recomendações, agrupar textos parecidos e a base do RAG.", "x": "Comparar vetores gerados por modelos diferentes. Eles vivem em mapas diferentes."}, "22-1": {"s": ["Ative a extensão: CREATE EXTENSION vector.", "Crie uma coluna do tipo vector(N), em que N é o tamanho do embedding do seu modelo.", "O operador <=> calcula a distância de cosseno. ORDER BY distância LIMIT 5 traz os 5 mais próximos.", "Um índice HNSW acelera muito a busca em tabelas grandes."], "e": ["Comparar a pergunta com todos os vetores, um por um, fica lento quando você tem milhares de documentos. O pgvector ensina o Postgres a guardar vetores e a buscar os mais próximos com um índice especial, como uma biblioteca organizada por assunto em vez de ordem alfabética. Você continua usando o banco que já conhece, com filtros normais de SQL junto."], "l": [], "g": [], "q": [], "c": "CREATE EXTENSION IF NOT EXISTS vector;\n\nCREATE TABLE trechos (\n  id SERIAL PRIMARY KEY,\n  documento_id INT NOT NULL,\n  conteudo TEXT NOT NULL,\n  embedding vector(1024)\n);\nCREATE INDEX ON trechos USING hnsw (embedding vector_cosine_ops);\n\n-- 5 trechos mais parecidos com a pergunta, só de um documento\nSELECT conteudo, 1 - (embedding <=> $1) AS similaridade\nFROM trechos\nWHERE documento_id = $2\nORDER BY embedding <=> $1\nLIMIT 5;", "u": "Quando você tem mais que algumas centenas de textos para buscar por significado.", "x": "Esquecer o índice e culpar o pgvector pela lentidão."}, "22-2": {"s": ["Ingestão (uma vez): quebre os documentos em pedaços (chunks) de algumas centenas de palavras, gere embeddings e guarde.", "Busca (a cada pergunta): gere o embedding da pergunta e traga os trechos mais próximos.", "Geração: monte o prompt com os trechos numerados e a pergunta. Mande citar as fontes.", "Regra de segurança: se a similaridade for baixa, diga que não encontrou."], "e": ["O LLM não conhece os documentos do seu cliente. RAG é dar a prova com consulta: antes de perguntar ao modelo, você procura nos documentos os trechos que falam do assunto e entrega junto com a pergunta. Ele responde com base nesses trechos e diz de onde tirou. Se não achou nada relevante, a regra é responder \"não encontrei\", em vez de inventar."], "l": [], "g": [], "q": [], "c": "async function responder(pergunta: string) {\n  const v = await gerarEmbedding(pergunta);\n  const trechos = await buscarTrechos(v, 5); // pgvector\n  if (!trechos.length || trechos[0].similaridade < 0.3)\n    return { texto: \"Não encontrei isso nos documentos.\", fontes: [] };\n\n  const contexto = trechos.map((t, i) => `[${i + 1}] ${t.conteudo}`).join(\"\\n\\n\");\n  const r = await llm(`Responda usando SOMENTE os trechos abaixo.\nCite as fontes no formato [n]. Se não estiver nos trechos, diga que não sabe.\n\n${contexto}\n\nPergunta: ${pergunta}`);\n  return { texto: r, fontes: trechos };\n}", "u": "Chat sobre documentos, FAQs, base de conhecimento interna.", "x": "Jogar o documento inteiro no prompt. Fica caro, lento e a resposta piora."}, "22-3": {"s": ["Monte de 15 a 50 casos reais com a resposta esperada (ou critérios do que é uma boa resposta).", "Um script roda todos, compara e mostra a taxa de acerto, o tempo médio e o custo.", "Guarde a nota no README. Toda mudança de prompt roda as evals de novo.", "Cache para perguntas repetidas e limite de uso por usuário seguram a conta."], "e": ["Com IA, o mesmo pedido pode dar respostas diferentes, então \"testei uma vez e funcionou\" não vale. Evals são a prova que você aplica no seu sistema: uma lista de perguntas com a resposta esperada, e um script que roda todas e dá uma nota. Assim, quando você muda o prompt ou o modelo, sabe se melhorou ou piorou. Junto vem o controle de custo e de tempo, porque IA cobra por uso."], "l": [], "g": [], "q": [], "c": "const casos = [\n  { msg: \"Fui demitido grávida\", esperado: \"trabalhista\" },\n  { msg: \"Recebi intimação criminal\", esperado: \"criminal\" },\n  // ...\n];\n\nlet acertos = 0, tempo = 0;\nfor (const c of casos) {\n  const t0 = performance.now();\n  const r = await triar(c.msg);\n  tempo += performance.now() - t0;\n  if (r.area === c.esperado) acertos++;\n  else console.log(\"ERROU:\", c.msg, \"->\", r.area);\n}\nconsole.log(`Acerto: ${(acertos / casos.length * 100).toFixed(0)}%  Tempo médio: ${(tempo / casos.length).toFixed(0)}ms`);", "u": "Em toda funcionalidade com IA, antes de colocar no portfólio e a cada mudança.", "x": "Ajustar o prompt pelo \"achismo\" de 2 ou 3 testes manuais."}, "23-0": {"s": ["Especifique antes: o que fazer, onde, as regras e como saber que está pronto.", "Peça em pedaços pequenos e revise cada diff linha por linha.", "Peça os testes primeiro e rode você mesmo. Não confie em \"está funcionando\".", "Um arquivo de regras do projeto (CLAUDE.md ou AGENTS.md) ensina o assistente os padrões do seu código."], "e": ["Assistentes de código (Claude Code, Copilot, Cursor) são estagiários muito rápidos que nunca cansam, mas não conhecem seu projeto e às vezes inventam. Quem se dá bem com eles é quem sabe pedir com clareza e revisar como um chefe exigente. Seu valor no mercado passa a ser especificar bem, revisar com olhar crítico e testar, não digitar mais rápido."], "l": [], "g": [], "q": [], "c": "# CLAUDE.md (regras do projeto)\n- Stack: Node 22, Express, Prisma, Zod, Vitest\n- Camadas: routes -> controllers -> services -> repositories\n- Toda entrada validada com Zod em src/schemas\n- Erros com AppError; nunca expor stack ao cliente\n- Todo service novo vem com teste unitário\n\n# Pedido bom\n\"Crie o endpoint PATCH /v1/clientes/:id seguindo o CLAUDE.md.\n Só permite alterar nome e telefone. Escreva o teste primeiro.\n Não mexa em outros arquivos.\"", "u": "No dia a dia de trabalho e nos projetos. Nos exercícios de estudo, com moderação.", "x": "Aceitar um diff enorme sem ler. É assim que entram bugs e falhas de segurança."}, "23-1": {"s": ["Entenda o objetivo do PR antes de olhar o código.", "Ordem do que olhar: está correto? é seguro? tem teste? é fácil de ler? segue o padrão do projeto?", "Comente com sugestão concreta e o porquê. Diferencie \"precisa mudar\" de \"sugestão\".", "Ao receber review, agradeça, pergunte se não entendeu e não leve para o lado pessoal."], "e": ["Code review é outra pessoa ler seu código antes de ele entrar na main, como o revisor de um livro. Ele não reescreve a história: aponta onde o leitor vai tropeçar, onde tem erro e o que pode virar problema depois. Com IA gerando muito código, saber revisar virou uma das habilidades mais valorizadas, e é ótimo para mostrar em entrevista."], "l": [], "g": [], "q": [], "c": "Checklist de revisão\n[ ] O PR faz o que a descrição diz?\n[ ] Entradas validadas? Algum dado de outro usuário exposto?\n[ ] Erros tratados com status certo?\n[ ] Tem teste para o caminho feliz e para o erro?\n[ ] Nomes claros? Função fazendo uma coisa só?\n[ ] Algum segredo, console.log ou código morto esquecido?\n\nComentário bom:\n\"Aqui o findMany não tem take: com muitos registros vai pesar.\n Sugestão: paginar com take/skip como em clientes.service.ts.\"", "u": "Em todo PR, até nos seus projetos solo (revise seu próprio PR no dia seguinte).", "x": "Comentários vagos como \"isso está ruim\" ou \"refaz\". Não ajudam ninguém a melhorar."}, "23-2": {"s": ["Balanceador de carga: divide os pedidos entre várias cópias da API.", "Cache (Redis): guarda respostas caras por um tempo. É rápido, mas pode estar desatualizado.", "Fila: tarefas demoradas (e-mail, PDF, IA) são feitas depois, por workers.", "Réplica de leitura e CDN: tiram peso do banco principal e trazem arquivos para perto do usuário."], "e": ["System design é planejar como o sistema aguenta crescer. Imagine um restaurante que atende 10 clientes e de repente recebe 1.000. Você contrata mais cozinheiros (mais servidores) e coloca alguém na porta distribuindo pedidos (balanceador). Deixa os pratos mais pedidos já prontos (cache). Pedidos demorados vão para uma fila em vez de travar o balcão. As fotos do cardápio ficam numa gráfica perto de cada bairro (CDN). Júnior não precisa desenhar o Netflix, mas precisa conhecer essas peças e suas trocas."], "l": [], "g": [], "q": [], "c": "            [ Usuários ]\n                 |\n              [ CDN ]  <- imagens, JS, CSS\n                 |\n        [ Balanceador de carga ]\n           /           \\\n      [ API 1 ]     [ API 2 ]  ---> [ Redis cache ]\n           \\           /\n        [ Postgres principal ] ---> [ réplica de leitura ]\n                 |\n              [ Fila ] ---> [ Worker: e-mails, PDFs, IA ]", "u": "Em entrevistas e ao planejar o projeto final. Comece simples e só adicione peças quando houver motivo.", "x": "Desenhar microsserviços e Kubernetes para um app com 10 usuários."}, "23-3": {"s": ["A API coloca um job na fila (BullMQ, que usa Redis) e responde na hora.", "Um processo separado (worker) consome a fila e executa o trabalho.", "Se falhar, a fila tenta de novo com espera crescente. Depois de N falhas, separa para análise.", "Quando terminar, avise o usuário: notificação, e-mail ou atualização em tempo real."], "e": ["Algumas tarefas demoram: mandar 500 e-mails, gerar um PDF, chamar a IA. Se o usuário tiver que esperar isso na requisição, a tela trava. A fila é a senha do cartório: você entrega o pedido, recebe \"ok, estamos processando\" e vai embora. Um worker nos bastidores pega os pedidos da fila um a um e executa. Tempo real (SSE ou WebSocket) é o painel que avisa sua senha quando fica pronto."], "l": [], "g": [], "q": [], "c": "import { Queue, Worker } from \"bullmq\";\nconst conexao = { host: \"localhost\", port: 6379 };\nconst filaEmails = new Queue(\"emails\", { connection: conexao });\n\n// na API: responde rápido\napp.post(\"/v1/agendamentos\", async (req, res) => {\n  const a = await service.executar(req.body);\n  await filaEmails.add(\"confirmacao\", { agendamentoId: a.id },\n    { attempts: 3, backoff: { type: \"exponential\", delay: 2000 } });\n  res.status(201).json(a);\n});\n\n// worker.ts: roda em outro processo\nnew Worker(\"emails\", async (job) => {\n  await enviarEmailConfirmacao(job.data.agendamentoId);\n}, { connection: conexao });", "u": "E-mails, notificações, relatórios, importações e chamadas lentas de IA.", "x": "Fazer o envio de e-mail dentro da requisição. Se o provedor de e-mail cair, seu cadastro cai junto."}, "24-0": {"s": ["Converse com 1 a 3 pessoas reais. Pergunte como fazem hoje e o que mais atrapalha. Não ofereça a solução ainda.", "Escreva o problema em uma frase: \"Advogados autônomos perdem prazos porque controlam tudo no WhatsApp.\"", "Histórias de usuário: \"Como advogado, quero ver os prazos da semana para não perder nenhum.\"", "Corte sem dó: liste o que fica FORA da versão 1. Defina como medir se funcionou."], "e": ["Projeto forte não começa no código. Começa numa pessoa com um problema. Antes de construir, você conversa com quem sofre o problema e descobre o que realmente dói. O MVP é a menor coisa que já resolve essa dor: o skate antes do carro. Ele já leva a pessoa do ponto A ao B, e você aprende com o uso real antes de investir em mais coisa."], "l": [], "g": [], "q": [], "c": "Problema: advogados autônomos perdem prazos e clientes\n          porque triam mensagens e agenda à mão.\n\nHistórias (MVP)\n1. Como advogado, quero receber a triagem de cada contato novo.\n2. Como advogado, quero ver contatos ordenados por urgência.\n3. Como cliente, quero agendar uma conversa por um link.\n\nFora do escopo v1: app mobile, pagamento, multi-escritório.\nSucesso: 1 escritório usando por 2 semanas; triagem 80%+ correta.", "u": "No começo de todo projeto de portfólio sério. É a história que você conta na entrevista.", "x": "Começar function info(i){const w=Math.floor(i/5),s=i%5,wk=W[w];return{i,w,s,wk,proj:s===4,les:s===4?null:wk.d[s]}}
function monthOf(w){return MONTHS.find(m=>m.w.includes(w))}
function isBoss(w){const m=monthOf(w);return m.w[m.w.length-1]===w}
function unlocked(i){return i===0||!!S.done[i-1]||!!S.done[i]}
function current(){for(let i=0;i<TOTAL;i++)if(!S.done[i])return i;return TOTAL-1}
function doneCount(){return Object.keys(S.done).length}
function weekDone(w){for(let s=0;s<5;s++)if(!S.done[w*5+s])return false;return true}
function monthDone(m){return MONTHS[m].w.every(weekDone)}
function projCount(){let n=0;for(let w=0;w<W.length;w++)if(S.done[w*5+4])n++;return n}
function noteCount(){return Object.keys(S.notes).filter(k=>/^\d+$/.test(k)&&(S.notes[k]||"").trim().length>=60).length}
function need(L){return 150*L*(L-1)}
function lvl(xp){let L=1;while(L<15&&xp>=need(L+1))L++;return L}
function mins(f){return Math.max(5,Math.round(S.minutes*f/5)*5)}
function stepsFor(d){
 if(d.proj)return[{id:"brief",t:"Entender o problema",f:.1},{id:"build",t:"Construir",f:.6},{id:"check",t:"Critério de pronto",f:.15},{id:"ship",t:"Publicar e mostrar",f:.15}];
 return[{id:"warm",t:"Aquecimento",f:.08},{id:"video",t:"Assistir à aula",f:.17},{id:"concept",t:"Entender o conceito",f:.2},{id:"ex",t:"Exercícios",f:.39},{id:"chal",t:"Desafio e resumo",f:.16}];
}
const isStep=(i,id)=>!!S.steps[i+":"+id];
function listFor(d,kind){if(!d.proj)return d.les[4];return kind==="build"?d.wk.p.req:d.wk.p.ok}
function exKey(i,kind,k){return i+":"+kind+k}
function allChecked(d,kind){const L=listFor(d,kind);return L.every((_,k)=>S.ex[exKey(d.i,kind,k)])}
function stepXP(id){return id==="chal"?45:15}

/* sequência: só dias úteis contam como falta */
function mid(t){const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()}
function missedWeekdays(from,to){let n=0;for(let t=from+86400000;t<to;t+=86400000){const g=new Date(t).getDay();if(g!==0&&g!==6)n++}return n}
function liveStreak(){if(!S.last)return 0;const miss=missedWeekdays(mid(S.last),mid(Date.now()));return miss>S.freezes?0:S.streak}

let toastT;
function toast(msg){const el=$("#toast");el.textContent=msg;el.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("on"),2200)}
function addXP(n,msg){const before=lvl(S.xp);S.xp=Math.max(0,S.xp+n);const after=lvl(S.xp);
 if(after>before){setTimeout(()=>{toast("Subiu para o nível "+after+": "+TITLES[after-1]+"!");confetti()},400)}
 else if(n>0)toast("+"+n+" XP · "+(msg||pick(CHEERS)))}
function checkBadges(){BADGES.forEach(b=>{if(!S.badges[b.id]&&b.c()){S.badges[b.id]=Date.now();setTimeout(()=>toast("Conquista: "+b.t),900)}})}

function toggleItem(i,kind,k){
 if(S.done[i]){toast("Dia já concluído.");render();return}
 const d=info(i),key=exKey(i,kind,k);S.ex[key]=!S.ex[key];addXP(S.ex[key]?10:-10);
 const stepId=d.proj?kind:"ex";const all=allChecked(d,kind);
 if(all&&!isStep(i,stepId)){S.steps[i+":"+stepId]=true;addXP(15,"Bloco concluído");openStep[i]=nextOpen(d)}
 else if(!all&&isStep(i,stepId)){S.steps[i+":"+stepId]=false;S.xp=Math.max(0,S.xp-15)}
 save();checkBadges();render();
}
function nextOpen(d){const s=stepsFor(d).find(s=>!isStep(d.i,s.id));return s?s.id:null}
function tryStep(i,id){
 const d=info(i),key=i+":"+id;
 if(S.steps[key]){if(S.done[i]){toast("Dia já concluído.");return}S.steps[key]=false;S.xp=Math.max(0,S.xp-stepXP(id));save();render();return}
 if(id==="ex"&&!allChecked(d,"ex")){toast("Marque todos os exercícios primeiro.");return}
 if(id==="build"&&!allChecked(d,"build")){toast("Faltam requisitos do projeto.");return}
 if(id==="check"&&!allChecked(d,"check")){toast("Confira todos os critérios de pronto.");return}
 if(id==="chal"&&(S.notes[i]||"").trim().length<60){toast("Escreva seu resumo (mínimo 60 caracteres).");return}
 if(id==="ship"&&!/^https?:\/\/\S+\.\S+/.test((S.links[i]||"").trim())){toast("Cole o link do repositório ou do deploy.");return}
 if(id==="warm"&&i===0&&(S.notes.motive||"").trim().length<10){toast("Escreva o seu motivo primeiro.");return}
 S.steps[key]=true;addXP(stepXP(id));openStep[i]=nextOpen(d);save();checkBadges();render();
}
function canFinish(i){return stepsFor(info(i)).every(s=>isStep(i,s.id))}
function completeDay(i){
 if(S.done[i]||!canFinish(i))return;const d=info(i),now=Date.now();
 S.done[i]=now;
 if(!S.last)S.streak=1;else{const gap=Math.round((mid(now)-mid(S.last))/86400000);
  if(gap>=1){const miss=missedWeekdays(mid(S.last),mid(now));
   if(miss===0)S.streak++;else if(miss<=S.freezes){S.freezes-=miss;S.streak++;setTimeout(()=>toast("Proteção de sequência usada. Sequência salva!"),2600)}else S.streak=1;
   if(S.streak>0&&S.streak%7===0&&S.freezes<3){S.freezes++;setTimeout(()=>toast("Ganhou 1 proteção de sequência"),3400)}}}
 S.last=now;S.best=Math.max(S.best,S.streak);
 const h=new Date(now).getHours();if(h>=22&&!S.badges.night)S.badges.night=now;if(h<7&&!S.badges.early)S.badges.early=now;
 addXP(d.proj?200:50,d.proj?"Projeto entregue!":"Dia concluído!");
 save();checkBadges();confetti();render();
}

/* ---------- timer de foco ---------- */
let T=null,AC=null;
function startTimer(min,label){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
 T={end:Date.now()+min*60000,total:min*60000,label,left:null};tick();toast("Foco ligado: "+min+" min. Celular longe!")}
function beep(){if(!AC)return;try{[0,.25,.5].forEach(o=>{const os=AC.createOscillator(),g=AC.createGain();os.frequency.value=880;g.gain.value=.12;os.connect(g);g.connect(AC.destination);os.start(AC.currentTime+o);os.stop(AC.currentTime+o+.15)})}catch(e){}}
function stopTimer(){if(!T)return;const used=T.total-(T.left!=null?T.left:T.end-Date.now());if(used>=60000){S.focus+=Math.round(used/60000);save();checkBadges()}T=null;tick()}
function tick(){const el=$("#timer");if(!T){el.hidden=true;el.innerHTML="";return}
 const left=T.left!=null?T.left:T.end-Date.now();
 if(left<=0){S.focus+=Math.round(T.total/60000);save();beep();T=null;checkBadges();toast("Bloco de foco concluído! Marque o passo e pause 5 min.");tick();return}
 const m=Math.floor(left/60000),s=Math.floor(left%60000/1000);const pct=100-left/T.total*100;
 const html='<span class="t">'+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")+'</span><span class="l">'+esc(T.label)+'</span><button data-act="tpause">'+(T.left!=null?"Continuar":"Pausar")+'</button><button data-act="tstop">Parar</button><div class="bar"><i style="width:'+pct.toFixed(1)+'%"></i></div>';
 el.hidden=false;el.innerHTML=html}
setInterval(()=>{if(T&&T.left==null)tick()},1000);

/* ---------- confete ---------- */
function confetti(){if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;const c=$("#fx"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
 const cs=getComputedStyle(document.documentElement),cols=["--xp","--ok","--primary","--boss"].map(v=>cs.getPropertyValue(v).trim());
 const P=Array.from({length:110},()=>({x:innerWidth/2,y:innerHeight*.4,vx:(Math.random()-.5)*12,vy:Math.random()*-12-4,r:Math.random()*6+3,c:pick(cols),a:Math.random()*6}));
 let f=0;(function loop(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=.2;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillRect(-p.r/2,-p.r/2,p.r,p.r*.6);x.restore()});if(++f<90)requestAnimationFrame(loop);else x.clearRect(0,0,c.width,c.height)})()}

/* ---------- views ---------- */
const openStep={};
function renderTop(){const L=lvl(S.xp),lo=need(L),hi=need(Math.min(L+1,15)),pct=L>=15?100:(S.xp-lo)/(hi-lo)*100,st=liveStreak();
 $("#top").innerHTML='<div class="lv"><div class="lvbadge" aria-label="Nível">'+L+'</div><div class="lvinfo"><div class="lvname">'+TITLES[L-1]+'</div><div class="xpbar"><i style="width:'+pct.toFixed(1)+'%"></i></div><div class="xpnum">'+S.xp.toLocaleString("pt-BR")+' XP'+(L<15?' · faltam '+(hi-S.xp).toLocaleString("pt-BR")+' para o nível '+(L+1):'')+'</div></div></div>'+
 '<div class="streak'+(st?'':' off')+'" title="Sequência de dias de estudo (fins de semana não quebram)">'+ICON.flame+st+(S.freezes?' <small>+'+S.freezes+' prot.</small>':'')+'</div>'}
function renderNav(route){const items=[["hoje","Hoje",ICON.today],["trilha","Trilha",ICON.map],["roadmap","Roadmap",ICON.road],["conquistas","Conquistas",ICON.trophy],["ajustes","Ajustes",ICON.gear]];
 $("#nav").innerHTML='<div class="in">'+items.map(([h,t,ic])=>'<a href="#'+h+'" class="'+(route===h?"on":"")+'"'+(route===h?' aria-current="page"':'')+'>'+ic+t+'</a>').join("")+'</div>'}

function checklist(d,kind){const L=listFor(d,kind);return '<ul class="checks">'+L.map((t,k)=>{const id="c"+d.i+kind+k;return '<li><label for="'+id+'"><input type="checkbox" id="'+id+'" data-act="item" data-i="'+d.i+'" data-kind="'+kind+'" data-k="'+k+'"'+(S.ex[exKey(d.i,kind,k)]?" checked":"")+'><span class="n">'+(k+1)+'</span><span>'+esc(t)+'</span></label></li>'}).join("")+'</ul>'}
function focusBtn(min,label){return '<button class="btn small" data-act="timer" data-min="'+min+'" data-label="'+esc(label)+'">'+ICON.clock+'Foco · '+min+' min</button>'}
function doneBtn(i,id,label){const on=isStep(i,id);return '<button class="btn small '+(on?"ghost":"ok")+'" data-act="step" data-i="'+i+'" data-s="'+id+'">'+(on?"Desmarcar":(label||"Concluí este passo"))+'</button>'}

function stepBody(d,s){const i=d.i,m=mins(s.f);
 if(!d.proj){const L=d.les;
  if(s.id==="warm"){
   if(i===0)return '<p>Antes de tudo: por que você quer ser dev full stack? Escreva em uma frase. Ela vai aparecer aqui todo dia para os momentos difíceis.</p><textarea id="motive" data-act="motive" placeholder="Eu quero ser dev full stack porque...">'+esc(S.notes.motive||"")+'</textarea><div class="sactions">'+doneBtn(i,"warm")+'</div>';
   const prev=info(i-1);const prevT=prev.proj?prev.wk.p.n:prev.les[0];
   return (S.notes.motive?'<div class="analogy"><b>Seu motivo</b>'+esc(S.notes.motive)+'</div>':'')+'<p>Sem olhar nada, explique em voz alta em 1 minuto: <strong>'+esc(prevT)+'</strong>. Depois confira o que você escreveu ontem.</p><details><summary>Ver minhas anotações de ontem</summary><p class="muted pre" style="margin-top:8px"><strong>Resumo:</strong> '+esc(S.notes[i-1]||"(sem resumo nesse dia)")+'</p>'+((S.notes["v"+(i-1)]||"").trim()?'<p class="muted pre" style="margin-top:8px"><strong>Anotações da aula:</strong>\n'+esc(S.notes["v"+(i-1)])+'</p>':'')+'</details><div class="sactions">'+focusBtn(m,"Aquecimento")+doneBtn(i,"warm")+'</div>';}
  if(s.id==="video")return '<p>A busca já vem filtrada para o tema de hoje. Escolha um vídeo de até 20 minutos e de preferência recente. Assista em 1,25x e anote enquanto assiste.</p><div class="sactions"><a class="btn xp" href="'+yt(L[3])+'" target="_blank" rel="noopener">'+ICON.play+'Abrir aula no YouTube</a>'+focusBtn(m,"Aula: "+L[0])+'</div><div class="vnotes"><label for="vn'+i+'"><strong>Minhas anotações da aula</strong></label><textarea id="vn'+i+'" class="vnote" data-act="vnote" data-i="'+i+'" placeholder="Palavras-chave, trechos de código, dúvidas, minuto do vídeo que vale rever...">'+esc(S.notes["v"+i]||"")+'</textarea><span class="count" id="vs'+i+'">'+((S.notes["v"+i]||"").trim()?"Salvo automaticamente":"Salva sozinho enquanto você digita")+'</span></div><div class="sactions">'+doneBtn(i,"video","Assisti")+'</div>';
  if(s.id==="concept"){const X=EX[d.w+"-"+d.s]||{s:[],e:[],l:[],g:[],q:[]};const sec=(cls,t,body)=>'<section class="'+cls+'"><h3>'+t+'</h3>'+body+'</section>';
   return '<div class="lede"><b>Em uma frase</b>'+esc(L[1])+'</div>'
   +(X.p?'<div class="problem"><b>Que problema isso resolve?</b><p>'+esc(X.p)+'</p></div>':'')
   +(X.e.length?sec("eli5","Explicando bem simples",X.e.map(t=>'<p>'+esc(t)+'</p>').join("")):'')
   +'<div class="analogy"><b>Analogia para guardar</b>'+esc(L[2])+'</div>'
   +(X.d?sec("diagram","Desenhando a ideia",'<pre>'+esc(X.d)+'</pre>'):'')
   +(X.s.length?sec("how","Como funciona, passo a passo",'<ol>'+X.s.map(t=>'<li>'+esc(t)+'</li>').join("")+'</ol>'):'')
   +(X.c?sec("code","Na prática",'<pre><code>'+esc(X.c)+'</code></pre>'):'')
   +(X.l.length?sec("lines","Linha por linha",'<dl>'+X.l.map(([a,b])=>'<dt><code>'+esc(a)+'</code></dt><dd>'+esc(b)+'</dd>').join("")+'</dl>'):'')
   +(X.g.length?sec("gloss","Mini-dicionário",'<dl>'+X.g.map(([a,b])=>'<div><dt>'+esc(a)+'</dt><dd>'+esc(b)+'</dd></div>').join("")+'</dl>'):'')
   +(X.u?'<div class="tips"><div class="tip use"><b>Quando usar</b>'+esc(X.u)+'</div><div class="tip warn"><b>Erro comum</b>'+esc(X.x)+'</div></div>':'')
   +(X.q.length?sec("quiz","Teste rápido",'<p class="muted">Responda de cabeça antes de abrir a resposta.</p>'+X.q.map(([a,b])=>'<details><summary>'+esc(a)+'</summary><p>'+esc(b)+'</p></details>').join("")):'')
   +'<p class="airule"><strong>Regra de IA de hoje:</strong> '+esc(AIRULES[i%AIRULES.length])+'</p><div class="sactions">'+focusBtn(m,"Conceito: "+L[0])+doneBtn(i,"concept","Entendi")+'</div>';}
  if(s.id==="ex"){const n=L[4].filter((_,k)=>S.ex[exKey(i,"ex",k)]).length;return '<p>Do mais fácil ao mais difícil. Faça no VS Code e commite no seu Dev Journal. <span class="count">'+n+'/'+L[4].length+'</span></p>'+checklist(d,"ex")+'<div class="sactions">'+focusBtn(Math.min(25,m),"Exercícios: "+L[0])+'</div>';}
  if(s.id==="chal"){const len=(S.notes[i]||"").trim().length;return '<div class="challenge"><b>Desafio do dia · +30 XP</b>'+esc(L[5])+'</div><label for="note'+i+'"><strong>Explique o conceito de hoje como se fosse para um amigo que não é dev.</strong> Isso fixa mais que reler.</label><textarea id="note'+i+'" data-act="note" data-i="'+i+'" placeholder="Hoje eu aprendi que...">'+esc(S.notes[i]||"")+'</textarea><span class="count" id="cnt'+i+'">'+len+' / 60 caracteres</span><div class="sactions">'+focusBtn(m,"Desafio: "+L[0])+doneBtn(i,"chal")+'</div>';}
 }else{const p=d.wk.p;
  if(s.id==="brief")return '<p>'+esc(p.prob)+'</p><p class="muted">Este projeto existe para provar que você resolve um problema, não para acumular tecnologias. Antes de codar, escreva no README: o problema, quem tem esse problema e como você vai saber que resolveu.</p><div class="sactions">'+focusBtn(m,"Planejar: "+p.n)+doneBtn(i,"brief","Entendi o problema")+'</div>';
  if(s.id==="build")return '<p>Se o tempo do dia acabar, tudo bem: continue amanhã antes de abrir o próximo dia. Projeto não se faz com pressa.</p>'+checklist(d,"build")+'<div class="sactions">'+focusBtn(25,"Construindo: "+p.n)+'</div>';
  if(s.id==="check")return checklist(d,"check")+'<div class="sactions">'+focusBtn(m,"Revisão: "+p.n)+'</div>';
  if(s.id==="ship")return '<label for="link'+i+'"><strong>Link do repositório ou do deploy</strong></label><input type="url" id="link'+i+'" data-act="link" data-i="'+i+'" placeholder="https://github.com/..." value="'+esc(S.links[i]||"")+'"><p class="muted">Poste no LinkedIn: o problema, um print, o que foi difícil e o link. Recrutador ama ver evolução semanal.</p><div class="sactions">'+doneBtn(i,"ship","Publiquei")+'</div>';
 }return""}

function renderDay(i){
 const d=info(i),m=monthOf(d.w),st=stepsFor(d),boss=d.proj&&isBoss(d.w);
 const title=d.proj?d.wk.p.n:d.les[0];
 if(!unlocked(i))return '<section class="card locked"><span class="eyebrow">Dia '+(i+1)+' bloqueado</span><h2>'+esc(title)+'</h2><p>Conclua o dia anterior para liberar este. Um passo de cada vez é o que mantém o foco.</p><a class="btn primary" href="#dia-'+(current()+1)+'">Ir para o dia atual</a></section>';
 if(!(i in openStep))openStep[i]=nextOpen(d);
 const doneN=st.filter(s=>isStep(i,s.id)).length,total=st.reduce((a,s)=>a+mins(s.f),0);
 let h='<section class="dayhead"><div class="pills"><span class="pill">Mês '+m.n+'</span><span class="pill">Semana '+(d.w+1)+'</span><span class="pill">Dia '+(i+1)+' de '+TOTAL+'</span>'+(d.proj?'<span class="pill '+(boss?"boss":"proj")+'">'+(boss?"Chefe do mês":"Projeto da semana")+'</span>':'')+'<span class="pill">'+total+' min</span></div>'+
  '<h1>'+esc(title)+'</h1><div class="segs" aria-label="'+doneN+' de '+st.length+' passos">'+st.map(s=>'<i class="'+(isStep(i,s.id)?"on":openStep[i]===s.id?"cur":"")+'"></i>').join("")+'</div></section>';
 h+='<div class="why"><b>Por quê</b><span>'+esc(d.wk.why)+'</span></div>';
 if(doneN===0&&!S.done[i])h+='<div class="start2"><p><strong>Sem vontade hoje?</strong> Comprometa-se só com 2 minutos. Começar é a parte mais difícil.</p><button class="btn xp" data-act="timer" data-min="2" data-label="Só 2 minutos: abra o material e comece">Só 2 minutos</button></div>';
 h+='<div class="steps">'+st.map((s,k)=>{const on=isStep(i,s.id),op=openStep[i]===s.id;return '<article class="step'+(on?" done":"")+(op?" open":"")+'"><button class="shead" data-act="open" data-i="'+i+'" data-s="'+s.id+'" aria-expanded="'+op+'"><span class="snum">'+(on?"✓":k+1)+'</span><span class="stitle">'+s.t+'</span><span class="smin">'+(s.id==="build"?"~":"")+mins(s.f)+' min</span></button>'+(op?'<div class="sbody">'+stepBody(d,s)+'</div>':'')+'</article>'}).join("")+'</div>';
 if(S.done[i])h+='<section class="finish done"><h2>Dia concluído</h2><p>'+(i+1<TOTAL?'O próximo dia já está liberado.':'Você completou a trilha inteira. Orgulho!')+'</p>'+(i+1<TOTAL?'<a class="btn primary" href="#dia-'+(i+2)+'">Ir para o dia '+(i+2)+'</a>':'')+'</section>';
 else{const ok=canFinish(i);h+='<section class="finish"><h2>'+(ok?"Tudo pronto!":"Conclua os passos para fechar o dia")+'</h2><p>'+(ok?"Feche o dia para ganhar "+(d.proj?200:50)+" XP, manter a sequência e liberar o próximo.":(st.length-doneN)+" passo(s) restante(s). Faça um de cada vez.")+'</p><button class="btn xp" data-act="complete" data-i="'+i+'"'+(ok?"":" disabled")+'>Concluir dia '+(i+1)+'</button></section>';}
 h+='<div class="daynav">'+(i>0?'<a class="btn ghost small" href="#dia-'+i+'">← Dia '+i+'</a>':'<span></span>')+(i+1<TOTAL&&unlocked(i+1)?'<a class="btn ghost small" href="#dia-'+(i+2)+'">Dia '+(i+2)+' →</a>':'')+'</div>';
 return h}

 h+='<section class="card"><h2>Como cada dia funciona</h2><p class="muted">Com '+S.minutes+' minutos por dia, segunda a sexta. Ajuste o tempo em Ajustes.</p><table class="split"><tbody><tr><td colspan="2"><strong>Dia de aula (4 por semana)</strong></td></tr>'+ls.map(s=>'<tr><td>'+s.t+'</td><td>'+mins(s.f)+' min</td></tr>').join("")+'<tr><td colspan="2" style="padding-top:16px"><strong>Dia de projeto (sexta)</strong></td></tr>'+ps.map(s=>'<tr><td>'+s.t+'</td><td>'+mins(s.f)+' min</td></tr>').join("")+'</tbody></table><p class="muted">Projetos costumam passar do tempo. Use o fim de semana se quiser, sem culpa: fins de semana não quebram a sequência.</p></section>';
 h+='<section class="card"><h2>Regras para estudar com IA</h2><ul>'+AIRULES.map(r=>'<li>'+esc(r)+'</li>').join("")+'</ul></section>';
 h+='<section class="card"><h2>Para quem tem dificuldade de foco</h2><ul><li>Um passo por vez: só o passo atual fica aberto.</li><li>Botão "Só 2 minutos" para vencer a inércia.</li><li>Timer de foco em blocos de até 25 minutos, com aviso sonoro.</li><li>XP a cada exercício, níveis, conquistas e sequência que não quebra no fim de semana.</li><li>Proteções de sequência: a cada 7 dias seguidos você ganha uma (máximo 3) que cobre um dia útil perdido.</li><li>Resumo escrito no fim do dia: explicar com suas palavras fixa muito mais que reler.</li></ul></section>';
 return h}

function renderAch(){const L=lvl(S.xp);
 let h='<section class="dayhead"><span class="eyebrow">Conquistas</span><h1>Sua evolução</h1></section><div class="stats">'+
 [[doneCount(),"dias concluídos"],[S.xp.toLocaleString("pt-BR"),"XP total"],[liveStreak(),"sequência atual"],[S.best,"melhor sequência"],[projCount(),"projetos entregues"],[(S.focus/60).toFixed(1).replace(".",","),"horas de foco"]].map(([b,s])=>'<div class="stat"><b>'+b+'</b><span>'+s+'</span></div>').join("")+'</div>';
 h+='<section class="card"><h2>Medalhas</h2><div class="badges">'+BADGES.map(b=>{const on=!!S.badges[b.id];return '<div class="badge'+(on?"":" off")+'"><span class="medal">'+(on?"★":"?")+'</span><b>'+b.t+'</b><span>'+b.d+'</span></div>'}).join("")+'</div></section>';
 h+='<section class="card"><h2>Níveis</h2><div class="levels">'+TITLES.map((t,k)=>'<div class="'+(k+1===L?"me":"")+'"><span>'+(k+1)+'. '+t+'</span><span>'+need(k+1).toLocaleString("pt-BR")+' XP</span></div>').join("")+'</div></section>';
 return h}

let resetArm=false;
function renderSettings(){
 return '<section class="dayhead"><span class="eyebrow">Ajustes</span><h1>Seu ritmo</h1></section>'+
 '<section class="card"><label for="minutes"><strong>Tempo de estudo por dia</strong></label><select id="minutes" data-act="minutes">'+[60,90,120,150,180].map(v=>'<option value="'+v+'"'+(S.minutes===v?" selected":"")+'>'+(v/60).toString().replace(".",",")+' h ('+v+' min)</option>').join("")+'</select><p class="muted">Os minutos de cada passo se ajustam automaticamente.</p></section>'+
 '<section class="card"><h2>Backup do progresso</h2><p class="muted">O progresso fica salvo neste navegador. Para levar para outro aparelho, copie o código abaixo e cole lá em "Restaurar".</p><textarea id="bk" readonly>'+esc(JSON.stringify(S))+'</textarea><div class="sactions"><button class="btn small" data-act="copy">Copiar backup</button></div><label for="rs"><strong>Restaurar</strong></label><textarea id="rs" placeholder="Cole aqui o backup"></textarea><div class="sactions"><button class="btn small primary" data-act="restore">Restaurar progresso</button></div></section>'+
 '<section class="card"><h2 class="danger">Recomeçar do zero</h2><p class="muted">Apaga XP, dias, resumos e conquistas deste navegador.</p><div class="sactions"><button class="btn small" data-act="reset">'+(resetArm?"Toque de novo para confirmar":"Apagar progresso")+'</button>'+(resetArm?'<button class="btn small ghost" data-act="unreset">Cancelar</button>':'')+'</div></section>'}

/* ---------- roteamento ---------- */
function route(){const h=location.hash.replace("#","");if(/^dia-\d+$/.test(h)){const n=+h.slice(4);if(n>=1&&n<=TOTAL)return{r:"hoje",i:n-1}}
 if(["trilha","roadmap","conquistas","ajustes"].includes(h))return{r:h};return{r:"hoje",i:current()}}
function render(){const R=route();renderTop();renderNav(R.r);const m=$("#main");
 m.innerHTML=R.r==="hoje"?renderDay(R.i):R.r==="trilha"?renderMap():R.r==="roadmap"?renderRoadmap():R.r==="conquistas"?renderAch():renderSettings()}
addEventListener("hashchange",()=>{resetArm=false;render();scrollTo(0,0)});

/* ---------- eventos ---------- */
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,i=+b.dataset.i;
 if(a==="open"){openStep[i]=openStep[i]===b.dataset.s?null:b.dataset.s;render()}
 else if(a==="step")tryStep(i,b.dataset.s);
 else if(a==="complete")completeDay(i);
 else if(a==="timer")startTimer(+b.dataset.min,b.dataset.label);
 else if(a==="tpause"){if(!T)return;if(T.left!=null){T.end=Date.now()+T.left;T.left=null}else T.left=T.end-Date.now();tick()}
 else if(a==="tstop")stopTimer();
 else if(a==="copy"){const t=$("#bk");const done=()=>toast("Backup copiado");try{navigator.clipboard.writeText(t.value).then(done,()=>{t.select();toast("Selecionado. Copie manualmente.")})}catch(err){t.select();toast("Selecionado. Copie manualmente.")}}
 else if(a==="restore"){try{const v=JSON.parse($("#rs").value);if(typeof v!=="object"||v===null||!("xp" in v))throw 0;S=Object.assign(blank(),v);save();toast("Progresso restaurado");location.hash="#hoje";render()}catch(err){toast("Backup inválido. Copie o texto inteiro.")}}
 else if(a==="reset"){if(!resetArm){resetArm=true;render()}else{S=blank();save();resetArm=false;toast("Progresso apagado. Bora de novo!");location.hash="#hoje";render()}}
 else if(a==="unreset"){resetArm=false;render()}
});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset.act==="item")toggleItem(+t.dataset.i,t.dataset.kind,+t.dataset.k);
 else if(t.dataset.act==="minutes"){S.minutes=+t.value;save();toast("Ritmo atualizado")}});
document.addEventListener("input",e=>{const t=e.target,a=t.dataset.act;
 if(a==="note"){const i=+t.dataset.i;S.notes[i]=t.value;save();const c=$("#cnt"+i);if(c)c.textContent=t.value.trim().length+" / 60 caracteres"}
 else if(a==="vnote"){S.notes["v"+t.dataset.i]=t.value;save();const c=$("#vs"+t.dataset.i);if(c)c.textContent="Salvo automaticamente"}
 else if(a==="link"){S.links[+t.dataset.i]=t.value;save()}
 else if(a==="motive"){S.notes.motive=t.value;save()}});

render();
</script>
</body>
</html>
