<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}img{max-width:100%}body{margin:0}</style>
<title>Trilha Full Stack</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: coluna única estilo app; topo fixo com nível/XP/sequência, navegação inferior; a trilha é um tabuleiro de 26 semanas x 5 casas */
:root{
  --bg:#EAF0F4; --surface:#FFFFFF; --surface-2:#DFE7EE; --ink:#14212E; --muted:#566676; --line:#CFD9E2;
  --primary:#0A6B78; --primary-ink:#FFFFFF; --primary-soft:#D3ECEF;
  --xp:#D99100; --xp-soft:#FFF0C7; --ok:#24804F; --ok-soft:#D9F0E3; --boss:#B14421; --boss-soft:#FBE2D7;
  --shadow:0 1px 2px rgba(20,33,46,.06),0 4px 14px rgba(20,33,46,.06);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E161E; --surface:#16212C; --surface-2:#1F2C39; --ink:#E6EDF3; --muted:#93A4B5; --line:#2A3A49;
  --primary:#46B9C6; --primary-ink:#04252B; --primary-soft:#123A41;
  --xp:#FFC23D; --xp-soft:#3A2E0E; --ok:#5CCB8C; --ok-soft:#14321F; --boss:#FF8C5E; --boss-soft:#3B1E13;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E161E; --surface:#16212C; --surface-2:#1F2C39; --ink:#E6EDF3; --muted:#93A4B5; --line:#2A3A49;
  --primary:#46B9C6; --primary-ink:#04252B; --primary-soft:#123A41;
  --xp:#FFC23D; --xp-soft:#3A2E0E; --ok:#5CCB8C; --ok-soft:#14321F; --boss:#FF8C5E; --boss-soft:#3B1E13;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(150px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:var(--primary)}
.wrap{max-width:720px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.15;margin:0}
h1{font-size:clamp(1.7rem,5vw,2.3rem);font-weight:800;letter-spacing:-.01em}
h2{font-size:1.3rem;font-weight:800}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
.mono{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase}
.eyebrow{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:6px}

/* topo */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);padding-block:12px 10px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line)}
.lv{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.lvbadge{flex:none;width:42px;height:42px;border-radius:12px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.15rem}
.lvinfo{min-width:0;flex:1}
.lvname{font-weight:700;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xpbar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:4px}
.xpbar i{display:block;height:100%;background:var(--xp);border-radius:99px;transition:width .5s}
.xpnum{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.streak{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:12px;background:var(--xp-soft);font-weight:700;font-variant-numeric:tabular-nums;flex:none}
.streak svg{width:18px;height:18px;fill:var(--xp)}
.streak.off{background:var(--surface-2);color:var(--muted)}
.streak.off svg{fill:var(--muted)}
.streak small{font-weight:500;font-size:.72rem;color:var(--muted)}

main{display:flex;flex-direction:column;gap:18px;padding-block:20px}

/* dia */
.dayhead{display:flex;flex-direction:column;gap:8px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;padding:4px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.pill.boss{background:var(--boss-soft);color:var(--boss);font-weight:700}
.pill.proj{background:var(--primary-soft);color:var(--primary);font-weight:700}
.why{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:.93rem;display:flex;gap:10px}
.why b{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--primary);flex:none;padding-top:3px}
.segs{display:flex;gap:4px}
.segs i{flex:1;height:6px;border-radius:99px;background:var(--surface-2)}
.segs i.on{background:var(--ok)}
.segs i.cur{background:var(--xp)}
.start2{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--xp-soft);border-radius:14px;padding:14px}
.start2 p{font-size:.93rem;flex:1;min-width:200px}

.steps{display:flex;flex-direction:column;gap:10px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.step.open{border-color:var(--primary);box-shadow:var(--shadow)}
.shead{width:100%;display:flex;align-items:center;gap:12px;padding:14px;background:none;border:0;text-align:left;cursor:pointer}
.snum{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:.8rem;background:var(--surface-2);color:var(--muted)}
.step.done .snum{background:var(--ok);color:var(--surface)}
.step.open:not(.done) .snum{background:var(--primary);color:var(--primary-ink)}
.stitle{flex:1;font-weight:700;min-width:0}
.step.done .stitle{color:var(--muted)}
.smin{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.sbody{padding:0 14px 16px 56px;display:flex;flex-direction:column;gap:12px}
@media (max-width:480px){.sbody{padding-left:14px}}
.sbody p{max-width:62ch}
.analogy{border-radius:12px;background:var(--primary-soft);padding:12px 14px}
.analogy b{display:block;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--primary);margin-bottom:4px}
.airule{font-size:.88rem;color:var(--muted);border-left:3px solid var(--xp);padding-left:10px}
.sactions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--primary)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.btn.xp{background:var(--xp);border-color:var(--xp);color:#241A00}
.btn.ghost{background:none}
.btn.small{min-height:36px;padding:6px 12px;font-size:.88rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:18px;height:18px;fill:currentColor}

.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.checks label{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--bg);cursor:pointer}
.checks input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--ok);flex:none}
.checks .n{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);padding-top:3px;flex:none;width:18px}
.checks input:checked ~ span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.count{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
textarea,input[type=text],input[type=url],select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
textarea{min-height:110px;resize:vertical}
.lede{font-size:1.02rem;font-weight:600;padding:12px 14px;border-radius:12px;background:var(--surface-2)}
.lede b,.tip b{display:block;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;font-weight:700}
.eli5,.how,.code{display:flex;flex-direction:column;gap:8px}
.eli5 p{font-size:1.02rem;line-height:1.7}
.how ol{margin:0;padding-left:0;list-style:none;counter-reset:st;display:flex;flex-direction:column;gap:8px}
.how li{counter-increment:st;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start}
.how li::before{content:counter(st);width:26px;height:26px;border-radius:8px;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;font-family:var(--f-mono);font-size:.78rem;font-weight:700}
.code pre{margin:0;padding:14px;border-radius:12px;background:var(--ink);color:var(--bg);overflow-x:auto;font-family:var(--f-mono);font-size:.8rem;line-height:1.6;max-width:100%}
.code{min-width:0}
.tips{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.tip{border-radius:12px;padding:12px 14px;font-size:.93rem}
.tip.use{background:var(--ok-soft)}
.tip.use b{color:var(--ok)}
.tip.warn{background:var(--boss-soft)}
.tip.warn b{color:var(--boss)}
.sbody{min-width:0}
.sbody section{display:flex;flex-direction:column;gap:8px;min-width:0}
.problem{border-radius:12px;padding:12px 14px;background:var(--xp-soft)}
.problem b{display:block;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.diagram pre{margin:0;padding:14px;border-radius:12px;background:var(--surface-2);border:1px dashed var(--line);overflow-x:auto;font-family:var(--f-mono);font-size:.78rem;line-height:1.55;max-width:100%}
.lines dl{margin:0;display:flex;flex-direction:column;gap:2px}
.lines dt{margin-top:8px}
.lines dt code{display:inline-block;max-width:100%;overflow-x:auto;white-space:pre;font-family:var(--f-mono);font-size:.8rem;background:var(--ink);color:var(--bg);padding:3px 8px;border-radius:6px}
.lines dd{margin:2px 0 0 0;padding-left:12px;border-left:2px solid var(--line);font-size:.94rem}
.gloss dl{margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.gloss dl>div{background:var(--bg);border-radius:10px;padding:10px 12px}
.gloss dt{font-weight:700}
.gloss dd{margin:2px 0 0;font-size:.9rem;color:var(--muted)}
.quiz details{background:var(--bg);border-radius:10px;padding:10px 12px}
.quiz summary{cursor:pointer;font-weight:600}
.quiz details p{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.vnotes{display:flex;flex-direction:column;gap:6px}
textarea.vnote{min-height:180px;font-family:var(--f-mono);font-size:.86rem;line-height:1.6}
.pre{white-space:pre-wrap}
.challenge{border:1px dashed var(--xp);border-radius:12px;padding:12px 14px;background:var(--xp-soft)}
.challenge b{display:block;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);margin-bottom:4px}

.finish{background:var(--ink);color:var(--bg);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.finish p{opacity:.85}
.finish .btn{align-self:flex-start}
.finish.done{background:var(--ok-soft);color:var(--ink)}
.daynav{display:flex;justify-content:space-between;gap:10px}

/* trilha */
.overall{display:flex;align-items:center;gap:12px}
.overall .xpbar{flex:1;height:10px;margin:0}
.overall .xpbar i{background:var(--ok)}
.month{display:flex;flex-direction:column;gap:10px}
.mhead{display:flex;flex-direction:column;gap:2px;padding-top:6px}
.mhead .mono{color:var(--primary)}
.wrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.wrow.boss{border-color:var(--boss)}
.wlabel{color:var(--ink);text-decoration:none;font-weight:600;font-size:.92rem;min-width:0}
.wlabel .mono{color:var(--muted);margin-right:4px}
.wrow.boss .wlabel::after{content:"Chefe";font-family:var(--f-mono);font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;color:var(--boss);background:var(--boss-soft);padding:2px 6px;border-radius:5px;margin-left:6px;white-space:nowrap}
.nodes{display:flex;gap:5px}
.node{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:.75rem;text-decoration:none;background:var(--surface-2);color:var(--muted);border:2px solid transparent}
.node.proj{border-radius:9px}
.node.done{background:var(--ok);color:var(--surface)}
.node.cur{background:var(--xp);color:#241A00;box-shadow:0 0 0 3px var(--xp-soft)}
.node.open{background:var(--surface);border-color:var(--primary);color:var(--primary)}
.node.lock{opacity:.5}
@media (max-width:420px){.wrow{grid-template-columns:1fr}.node{width:36px;height:36px}}

/* roadmap */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.mcard{border-left:4px solid var(--primary)}
.split{width:100%;border-collapse:collapse;font-size:.92rem}
.split td{padding:8px 4px;border-bottom:1px solid var(--line)}
.split td:last-child{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-family:var(--f-display);font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{font-size:.82rem;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{border-radius:14px;padding:12px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.badge .medal{width:36px;height:36px;border-radius:50%;background:var(--xp);display:grid;place-items:center;color:#241A00;font-family:var(--f-display);font-weight:800}
.badge.off{opacity:.5}
.badge.off .medal{background:var(--surface-2);color:var(--muted)}
.badge b{font-size:.92rem}
.badge span{font-size:.8rem;color:var(--muted)}
.levels{display:flex;flex-direction:column;gap:4px;font-size:.9rem}
.levels div{display:flex;justify-content:space-between;gap:10px;padding:6px 10px;border-radius:8px}
.levels div.me{background:var(--xp-soft);font-weight:700}
.levels span:last-child{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}

/* barras fixas */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
nav.bottom .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
nav.bottom a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:10px;color:var(--muted);text-decoration:none;font-size:.7rem;font-weight:600}
nav.bottom a svg{width:22px;height:22px;fill:currentColor}
nav.bottom a.on{color:var(--primary);background:var(--primary-soft)}
.timer{position:fixed;z-index:9;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(72px + env(safe-area-inset-bottom,0px));max-width:688px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.timer .t{font-family:var(--f-mono);font-size:1.3rem;font-weight:700;font-variant-numeric:tabular-nums}
.timer .l{flex:1;min-width:0;font-size:.82rem;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer button{background:none;border:1px solid currentColor;border-radius:8px;padding:4px 10px;cursor:pointer;color:inherit;font-size:.8rem;font-weight:700}
.timer .bar{position:absolute;left:12px;right:12px;bottom:4px;height:3px;border-radius:9px;background:rgba(127,127,127,.35);overflow:hidden}
.timer .bar i{display:block;height:100%;background:var(--xp)}
.toast{position:fixed;z-index:20;left:50%;top:calc(env(safe-area-inset-top,0px) + 74px);transform:translate(-50%,-12px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:.9rem;transition:.25s;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:30;width:100%;height:100%}
.locked{text-align:left}
.danger{color:var(--boss)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top" id="top"></header>
  <main id="main"></main>
</div>
<div id="timer" class="timer" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<nav class="bottom" id="nav" aria-label="Navegação principal"></nav>
<script>
const W=[];
W.push({t:"Terminal, Git e IA do jeito certo",why:"Git aparece em praticamente todas as vagas júnior. É a primeira coisa que um recrutador olha no seu GitHub.",d:[
["Terminal e ambiente","O terminal é uma forma de conversar com o computador por comandos de texto. Com ele você navega por pastas, cria arquivos e roda programas muito mais rápido do que clicando.","É como pedir no balcão em vez de procurar sozinho pela loja: você diz exatamente o que quer e recebe.","terminal linux comandos básicos para programadores",
["Use pwd, ls e cd para navegar até a sua pasta de usuário.","Crie a pasta estudos-fullstack com mkdir e entre nela.","Crie 3 arquivos com touch (notas.md, index.html, app.js) e liste com ls -la.","Renomeie notas.md para diario.md com mv e apague app.js com rm.","Instale Node LTS e VS Code. Confirme com node -v e npm -v.","Abra a pasta no VS Code direto do terminal com code ."],
"Escreva no diario.md 10 comandos que você usou hoje e o que cada um faz, sem consultar."],
["Git: o 'salvar jogo' do código","Git guarda o histórico do projeto em fotos chamadas commits. Você pode voltar no tempo, comparar versões e saber o que mudou.","É o checkpoint do videogame: cada commit é um ponto seguro para onde você pode voltar se der errado.","git e github para iniciantes curso em vídeo",
["Rode git init na pasta estudos-fullstack.","Configure git config --global user.name e user.email.","Faça 3 commits com mensagens claras, usando git status antes de cada um.","Use git diff para ver o que mudou antes de commitar.","Veja o histórico com git log --oneline.","Estrague um arquivo de propósito e recupere com git restore."],
"Reescreva 5 mensagens de commit no padrão Conventional Commits (feat:, fix:, docs:, refactor:, chore:)."],
["GitHub, branches e Pull Request","Branch é uma linha paralela de trabalho. Pull Request é o pedido para juntar essa linha na principal, com revisão de outra pessoa.","É escrever um rascunho numa folha separada e pedir ao editor que aprove antes de entrar no livro.","git branch merge pull request tutorial português",

W.push({t:"IA no produto: LLMs, prompts e ferramentas",why:"Em levantamento de 2026 com quase 7 mil vagas full stack, cerca de 1 em cada 3 pedia alguma competência em IA. Começa o mês da IA.",d:[
["Como LLMs funcionam","Um LLM prevê o próximo pedaço de texto (token) com base no contexto. Tem limite de contexto, custo por token e pode inventar coisas (alucinar).","É um autocompletar gigantesco que leu muito: ótimo em padrões, mas não sabe se algo é verdade.","como funcionam LLMs explicado simples",
["Conte os tokens de um texto num tokenizer.","Compare temperatura 0 e 1 na mesma pergunta.","Provoque uma alucinação e documente.","Compare 2 modelos na mesma tarefa.","Calcule o custo de 1.000 chamadas.","Leia a documentação da API de um LLM (Anthropic ou OpenAI)."],
"Explique janela de contexto para alguém que não é dev."],
["Chamando a API de um LLM","A integração é feita pelo SDK: mensagem de sistema, mensagens do usuário e parâmetros. A chave fica sempre no servidor.","A chave da API é o cartão de crédito da empresa: nunca deixe no front.","api claude openai node tutorial",
["Faça uma chamada simples pelo SDK em Node.","Use um system prompt.","Mantenha o histórico da conversa.","Receba a resposta em streaming.","Trate rate limit e timeout.","Guarde a chave em variável de ambiente."],
"Crie uma rota no Next.js que faz streaming da resposta para a tela."],
["Prompts e saída estruturada","Prompts bons têm contexto, tarefa, exemplos e formato. Saída estruturada (JSON validado com Zod) torna a resposta utilizável no código.","É o briefing para um freelancer: quanto mais claro o pedido e o formato de entrega, menos retrabalho.","prompt engineering para desenvolvedores",
["Compare um prompt sem exemplos e com exemplos.","Peça JSON e valide com Zod.","Tente de novo quando o JSON vier inválido.","Classifique textos em categorias.","Extraia dados de um e-mail.","Monte 10 casos de teste para o seu prompt."],
"Meça a taxa de acerto do prompt em 20 exemplos."],
["Tool calling e agentes","Tool calling deixa o modelo pedir que seu código execute funções (consultar o banco, agendar). Agente é um ciclo: o modelo decide, a ferramenta executa, o modelo continua.","O modelo é o gerente que decide. As ferramentas são os funcionários que executam e trazem o resultado.","tool calling function calling llm tutorial",
["Defina uma ferramenta com schema.","Execute a ferramenta e devolva o resultado ao modelo.","Adicione uma segunda ferramenta.","Limite o ciclo a N passos.","Peça confirmação do usuário antes de ações perigosas.","Registre cada passo em log."],

const EX={"0-0": {"s": ["O terminal abre numa pasta, normalmente a sua pasta de usuário. Esse é o seu \"local atual\". O comando pwd (print working directory, \"mostre a pasta de trabalho\") responde com o endereço completo, por exemplo /home/mardoqueu.", "Para ver o que tem no local atual, use ls (list). Com ls -la ele mostra também os arquivos ocultos (os que começam com ponto, como .gitignore) e detalhes como tamanho e data.", "Para andar, use cd (change directory). cd nome entra numa pasta que está aqui. cd .. sobe um nível. cd ~ volta para casa. Dica de ouro: digite as primeiras letras do nome e aperte Tab, o terminal completa sozinho.", "Para criar, use mkdir nome (cria pasta) e touch arquivo.ext (cria arquivo vazio). Para mexer, mv origem destino move ou renomeia, cp copia e rm apaga. No Windows, use o Git Bash ou o WSL para que esses mesmos comandos funcionem.", "Quando você digita o nome de um programa (node, git, code), o terminal procura esse programa nas pastas de programas instalados e o executa no seu local atual. Por isso code . abre o VS Code justamente na pasta onde você está: o ponto quer dizer \"aqui\"."], "e": ["Pense no seu computador como uma casa grande. As pastas são os cômodos e os arquivos são os objetos dentro deles. No dia a dia você anda pela casa com o mouse: abre a porta da pasta Documentos, entra na pasta Faculdade, clica no arquivo. Isso funciona, mas é devagar e você só pode fazer o que os botões deixam.", "O terminal é um interfone ligado à casa inteira. Você não precisa andar: você fala para onde quer ir e o que quer fazer, e a casa obedece. \"Entre na cozinha.\" \"Crie uma gaveta nova chamada talheres.\" \"Me diga o que tem aqui.\" Cada uma dessas frases é um comando, e cada comando é uma palavra curta em inglês.", "Existe uma regra importante: o terminal sempre está \"dentro\" de algum cômodo. Tudo que você mandar fazer acontece ali, a não ser que você diga outro endereço. Por isso o primeiro hábito de quem usa terminal é perguntar \"onde eu estou?\" antes de criar ou apagar algo."], "l": [["pwd", "Pergunta \"onde estou?\". Responde algo como /home/mardoqueu."], ["mkdir estudos-fullstack", "Cria uma pasta nova com esse nome no local atual. Evite espaços e acentos em nomes de pasta de código."], ["cd estudos-fullstack", "Entra na pasta que você acabou de criar. Agora tudo acontece lá dentro."], ["touch index.html app.js notas.md", "Cria três arquivos vazios de uma vez. Pode passar quantos nomes quiser separados por espaço."], ["ls -la", "Lista tudo o que existe aqui, com detalhes. Você deve ver os três arquivos."], ["mv notas.md diario.md", "\"Move\" notas.md para o nome diario.md. Mover para outro nome na mesma pasta é renomear."], ["rm app.js", "Apaga app.js para sempre. Não vai para a lixeira."], ["node -v", "Pede ao Node a versão dele. Se aparecer algo como v22.x, está instalado."], ["code .", "Abre o VS Code nesta pasta. O ponto significa \"a pasta atual\"."]], "g": [["Diretório", "Outro nome para pasta."], ["Caminho (path)", "O endereço de uma pasta ou arquivo, como /home/mardoqueu/estudos-fullstack."], ["Caminho relativo", "Endereço a partir de onde você está (cd estudos-fullstack). Caminho absoluto começa da raiz (cd /home/mardoqueu/estudos-fullstack)."], ["Flag", "Opção que muda o comportamento do comando, começando com traço: o -la em ls -la."], ["Shell", "O programa que entende seus comandos. Bash e Zsh são os mais comuns."]], "q": [["Você digitou touch teste.js e não sabe em que pasta o arquivo foi parar. O que faz?", "Roda pwd para ver o local atual: o arquivo foi criado ali. Depois ls para confirmar."], ["Qual a diferença entre cd .. e cd ~?", "cd .. sobe um nível a partir de onde você está. cd ~ vai direto para a sua pasta de usuário, de qualquer lugar."], ["Como renomear app.js para main.js sem abrir nenhum editor?", "mv app.js main.js"]], "p": "Sem o terminal, você depende de botões que alguém desenhou. Só que a maioria das ferramentas de programação não tem botão nenhum: Git, Node, npm, Docker e Prisma foram feitas para receber ordens escritas. Quem não se sente à vontade no terminal trava logo no primeiro tutorial, porque todo tutorial começa com \"abra o terminal e digite...\". Dominar o básico aqui tira esse medo de uma vez e deixa você mais rápido do que qualquer clique.", "d": "Sua casa (computador)\n/home/mardoqueu            <- você começa aqui (pasta do usuário)\n├── Documentos\n├── Downloads\n└── estudos-fullstack      <- cd estudos-fullstack entra aqui\n    ├── index.html\n    └── diario.md\n\ncd ..   = volta um cômodo (sobe para a pasta de cima)\ncd ~    = volta direto para a sua pasta de usuário", "c": "pwd\nmkdir estudos-fullstack\ncd estudos-fullstack\ntouch index.html app.js notas.md\nls -la\nmv notas.md diario.md\nrm app.js\nnode -v\ncode .", "u": "Sempre que for criar projeto, instalar pacote, rodar servidor ou usar Git. Ou seja: todo dia.", "x": "Usar rm achando que vai para a lixeira. Não vai. Confira com ls antes de apagar e nunca rode rm -rf sem ter certeza absoluta da pasta."}, "0-1": {"s": ["git init cria o álbum vazio (a pasta .git) no projeto. Você faz isso uma vez por projeto. Antes do primeiro commit, configure seu nome e e-mail com git config --global, que vão aparecer em todas as fotos.", "Você edita os arquivos normalmente. git status mostra o que mudou desde a última foto: arquivos novos (untracked), modificados (modified) e os que já estão na mesa (staged).", "git add arquivo coloca aquele arquivo na mesa de preparação. git add . coloca tudo que mudou. Antes de adicionar, git diff mostra exatamente quais linhas mudaram.", "git commit -m \"mensagem\" tira a foto de tudo que está na mesa e guarda no histórico com a legenda. A mesa fica vazia de novo.", "git log --oneline mostra o álbum, uma foto por linha, com um código (hash) e a legenda. git restore arquivo desfaz mudanças que você ainda não fotografou, voltando o arquivo para como estava na última foto."], "e": ["Imagine que você está montando um álbum de fotos do seu projeto. Toda vez que chega numa parte boa, tira uma foto e escreve uma legenda embaixo: \"página inicial pronta\", \"menu funcionando\". Se amanhã você estragar tudo, abre o álbum, acha a foto de ontem e volta para ela. Cada foto é um commit, e o álbum é o histórico.", "Só que o Git não fotografa tudo automaticamente. Ele tem uma etapa no meio: antes de tirar a foto, você escolhe o que vai aparecer nela. É como arrumar os objetos em cima de uma mesa antes de fotografar. Essa mesa de preparação se chama staging (área de preparação), e você coloca coisas nela com git add. Assim você consegue fazer fotos organizadas, cada uma com um assunto só.", "Tudo isso fica guardado numa pasta escondida chamada .git, dentro do seu projeto. Ela é o álbum. Se você apagar essa pasta, apaga o histórico. Os seus arquivos normais continuam ali, mas sem memória."], "l": [["git config --global user.name \"Mardoqueu Martins\"", "Diz ao Git seu nome. --global vale para todos os projetos do computador. Só precisa fazer uma vez."], ["git config --global user.email \"seu@email.com\"", "Mesmo e-mail da sua conta do GitHub, para os commits aparecerem no seu perfil."], ["git init", "Cria a pasta .git: o projeto passa a ter histórico."], ["git status", "Mostra o que mudou e o que já está na área de preparação. Use antes de qualquer add ou commit."], ["git add index.html", "Coloca só o index.html na mesa de preparação."], ["git commit -m \"feat: cria página inicial\"", "Tira a foto. O -m é a legenda. \"feat:\" indica uma funcionalidade nova (padrão Conventional Commits)."], ["git diff", "Mostra linha por linha o que mudou e ainda não foi para a mesa. Linhas com + entraram, com - saíram."], ["git add .", "Coloca todas as mudanças da pasta na mesa."], ["git log --oneline", "Lista os commits, do mais novo para o mais velho, um por linha."], ["git restore index.html", "Joga fora as mudanças não commitadas desse arquivo e volta para a última foto."]], "g": [["Repositório", "A pasta do projeto com histórico do Git (a pasta .git dentro dela)."], ["Commit", "Uma foto do projeto num momento, com legenda, autor, data e um código único (hash)."], ["Staging", "A mesa onde você prepara o que vai entrar no próximo commit."], ["Hash", "O código único de cada commit, como a3f9c12."], ["Conventional Commits", "Padrão de mensagem: feat (novidade), fix (correção), docs (documentação), style (visual), refactor (reorganização), chore (tarefas gerais)."]], "q": [["Você mudou 3 arquivos, mas quer fazer um commit só com 1 deles. Como?", "git add só daquele arquivo e depois git commit. Os outros dois continuam modificados, fora da foto."], ["Para que serve o git status antes do commit?", "Para conferir o que vai entrar e o que ficou de fora. Evita commitar arquivo errado ou esquecer um."], ["Qual mensagem é melhor: \"ajustes\" ou \"fix: corrige cálculo de juros no parcelamento\"? Por quê?", "A segunda. Ela diz o tipo da mudança e exatamente o que mudou. Daqui a meses, você e qualquer recrutador entendem o histórico."]], "p": "Sem controle de versão, programar é como escrever um trabalho importante sem botão de desfazer e sem salvar cópias. Você mexe em algo, quebra o que funcionava e não lembra como estava antes. Aí surgem pastas como projeto-final, projeto-final-2, projeto-final-AGORA-VAI. Em equipe é pior: duas pessoas mexem no mesmo arquivo e uma apaga o trabalho da outra. O Git resolve tudo isso e é exigido em praticamente toda vaga.", "d": "  Sua pasta          Área de preparação        Histórico (.git)\n (working dir)            (staging)               (commits)\n\n  edita arquivos  --git add-->  escolhe o que  --git commit-->  foto salva\n       ^                        vai na foto                    com legenda\n       |                                                           |\n       +------------------ git restore (volta) --------------------+", "c": "git config --global user.name \"Mardoqueu Martins\"\ngit config --global user.email \"seu@email.com\"\ngit init\ngit status\ngit add index.html\ngit commit -m \"feat: cria página inicial\"\ngit diff\ngit add .\ngit commit -m \"style: ajusta cores do cabeçalho\"\ngit log --oneline\ngit restore index.html", "u": "Em todo projeto, desde o primeiro arquivo. Commits pequenos, um assunto por commit, várias vezes por dia.", "x": "Fazer um commit gigante no fim do dia com a mensagem \"atualizações\". Ninguém entende o que mudou, e voltar só uma parte fica impossível."}, "0-2": {"s": ["Crie um repositório vazio no GitHub e ligue ao projeto local com git remote add origin url. \"origin\" é o apelido do endereço do GitHub. Configure uma chave SSH para não digitar senha toda hora.", "git push -u origin main envia a branch main pela primeira vez. O -u faz o Git lembrar desse caminho; nas próximas vezes basta git push.", "Para algo novo, git switch -c feature/readme cria a branch e já entra nela. Os commits que você fizer agora vão só para esse galho. git branch mostra em qual você está.", "git push -u origin feature/readme envia o galho. No GitHub aparece o botão \"Compare & pull request\". Escreva o que mudou, por que e como testar.", "Depois da revisão, clique em Merge. No seu computador, volte para a main com git switch main e traga a versão nova com git pull. Se duas pessoas mudaram a mesma linha, aparece um conflito: o Git marca as duas versões no arquivo, você escolhe a certa, salva e faz commit."], "e": ["Lembra do álbum de fotos do Git? O GitHub é uma cópia desse álbum guardada na internet. Você manda suas fotos para lá com git push e traz as fotos novas de lá com git pull. Outras pessoas podem ver, baixar uma cópia (clone) e sugerir mudanças.", "Branch (galho) é como abrir um caderno de rascunho. A versão oficial do projeto fica no caderno principal, chamado main. Quando você vai fazer algo novo, abre um caderno de rascunho a partir dele e trabalha ali. Se der errado, joga o rascunho fora e o principal continua intacto. Se der certo, você passa o rascunho a limpo para o principal.", "Pull Request é o pedido para passar o rascunho a limpo. Você abre no GitHub e diz: \"fiz isto, por isto, testei assim, alguém confere?\". Outra pessoa lê as mudanças, comenta e aprova. Só então acontece o merge: o conteúdo da branch entra na main. Mesmo trabalhando sozinho, fazer PRs mostra ao recrutador que você sabe o fluxo de um time."], "l": [["git remote add origin git@github.com:...", "Liga seu projeto local ao repositório no GitHub e dá o apelido \"origin\" para esse endereço."], ["git push -u origin main", "Envia a branch main para o GitHub e grava esse caminho como padrão."], ["git switch -c feature/readme", "Cria a branch feature/readme a partir de onde você está e entra nela. O prefixo feature/ é uma convenção para funcionalidades."], ["echo \"# Estudos Full Stack\" > README.md", "Escreve esse texto num arquivo README.md (cria se não existir). Atalho para não abrir editor."], ["git add README.md + git commit", "Fotografa o README dentro da branch. A main ainda não tem esse arquivo."], ["git push -u origin feature/readme", "Envia a branch para o GitHub. Agora dá para abrir o Pull Request no site."], ["git switch main", "Depois do merge feito no site, volta para a main local."], ["git pull", "Traz da internet a main atualizada, já com o README."], ["git branch -d feature/readme", "Apaga o galho local, que já foi juntado. Mantém a lista de branches limpa."]], "g": [["Remote", "Uma cópia do repositório em outro lugar, normalmente o GitHub."], ["origin", "Apelido padrão do remote principal."], ["Clone", "Baixar um repositório inteiro, com histórico, para o seu computador."], ["Merge", "Juntar os commits de uma branch em outra."], ["Conflito de merge", "Quando a mesma linha mudou nos dois lados e o Git precisa que você escolha a versão final."]], "q": [["Por que não trabalhar direto na main?", "Porque a main deve estar sempre funcionando. Na branch você pode errar à vontade sem quebrar a versão boa, e o PR permite revisar antes de juntar."], ["O que faz o git pull?", "Traz do GitHub os commits que você ainda não tem e junta na sua branch atual."], ["O que precisa ter na descrição de um bom Pull Request?", "O que mudou, por que mudou e como testar. Se tiver tela, um print."]], "p": "O Git sozinho guarda o histórico só no seu computador. Se o HD queimar, você perde tudo. E ninguém mais consegue ver ou ajudar no seu código. Além disso, trabalhando direto na versão principal, qualquer experimento que dê errado quebra o projeto que estava funcionando. GitHub, branches e Pull Requests resolvem essas três coisas: cópia na nuvem, espaço seguro para testar e revisão antes de juntar. É exatamente assim que times trabalham, e é o seu GitHub que o recrutador abre.", "d": "main     o---o---o-----------------o   (merge: rascunho entra no principal)\n                  \\               /\nfeature/readme     o-----o-----o       (seus commits no rascunho)\n\nSeu PC  --git push-->  GitHub  --Pull Request--> revisão --> Merge\nSeu PC  <--git pull--  GitHub  (traz a main atualizada)", "c": "git remote add origin git@github.com:mardoqueu/estudos-fullstack.git\ngit push -u origin main\ngit switch -c feature/readme\necho \"# Estudos Full Stack\" > README.md\ngit add README.md\ngit commit -m \"docs: adiciona README\"\ngit push -u origin feature/readme\ngit switch main\ngit pull\ngit branch -d feature/readme", "u": "Em toda funcionalidade ou correção, mesmo trabalhando sozinho. É o fluxo que você vai usar no primeiro dia de emprego.", "x": "Trabalhar direto na main e dar push de tudo. Quando algo quebra, não existe versão segura para voltar, e o histórico vira bagunça."}, "0-3": {"s": ["Primeiro tente sozinho por uns 15 minutos. Pode errar, pode travar. Esse esforço é o que faz o conteúdo grudar.", "Travou? Peça uma dica, não a resposta. Diga o que você já tentou e peça para ela não mostrar código.", "Quando resolver, peça revisão: \"o que pode melhorar e por quê?\". Aceite só as sugestões que você consegue explicar com suas palavras.", "Use a IA como professor: peça para explicar de outro jeito, com outra analogia, ou para te fazer perguntas de prova sobre o tema.", "Desconfie e confira. A IA pode inventar funções, opções de comando ou regras que não existem, sempre com muita confiança. Tudo importante, confira na documentação oficial."], "e": ["Imagine que você quer ficar forte e contrata um personal trainer muito bom. Se ele levantar os pesos por você, o treino fica rápido e fácil, mas o seu músculo não cresce nada. O personal serve para mostrar o movimento certo, corrigir sua postura e dizer quando aumentar o peso. Quem levanta é você. A IA nos estudos é exatamente isso.", "Aprender programação funciona por esforço. Quando você tenta, erra e descobre o porquê, o cérebro grava. Quando você só lê a resposta pronta, parece que entendeu, mas no dia seguinte não consegue fazer sozinho. Essa sensação de \"entendi\" lendo a solução é uma ilusão muito comum.", "Por outro lado, usar a IA do jeito certo acelera muito: ela explica o mesmo conceito de cinco jeitos diferentes até um fazer sentido, gera exercícios novos, encontra o erro que você não estava vendo e revisa seu código como um sênior paciente. A regra é simples: a IA pode ensinar, perguntar, dar dica e revisar, mas quem escreve a solução é você."], "l": [["Contexto: estou aprendendo Git há 1 semana.", "Dizer seu nível faz a IA ajustar a explicação. Sem isso ela pode responder como para um sênior."], ["Objetivo: entender por que meu git push deu erro.", "Objetivo claro é entender, não só \"fazer funcionar\"."], ["O que já tentei: ...", "Mostra seu raciocínio e evita respostas óbvias que você já testou."], ["Erro: \"rejected - fetch first\"", "Cole sempre a mensagem de erro exata. Ela é a pista principal."], ["Pedido: NÃO me dê o comando pronto.", "A regra mais importante: você pede ajuda para pensar, não a resposta."], ["Explique com uma analogia e me faça uma pergunta", "Formato de resposta que obriga você a raciocinar e chegar lá por conta própria."]], "g": [["Prompt", "O texto que você envia para a IA. Quanto mais contexto e mais claro o pedido, melhor a resposta."], ["Alucinação", "Quando a IA inventa algo falso com aparência de verdade, como uma função que não existe."], ["Assistente de código", "Ferramenta de IA dentro do editor (Copilot, Claude Code, Cursor) que sugere ou escreve código."], ["Documentação oficial", "O manual do próprio criador da ferramenta, como git-scm.com ou developer.mozilla.org. É a fonte da verdade."]], "q": [["Você está fazendo um exercício de laço e a IA do editor sugere a solução inteira enquanto você digita. O que fazer?", "Desligar o autocompletar durante os exercícios. Ele está levantando o peso por você."], ["A IA disse para usar o comando git undo. Como saber se é verdade?", "Conferindo na documentação oficial do Git. Esse comando não existe: é um exemplo típico de alucinação."], ["Qual é melhor: \"faz um formulário de login\" ou um pedido com seu nível, o que já tentou e o que quer entender?", "O segundo. Contexto, objetivo e formato da resposta geram uma explicação que te ensina, não só um código para colar."]], "p": "Hoje qualquer pessoa pede um código para a IA e recebe algo que parece funcionar. Por isso, empresas já não contratam júnior para digitar código. Elas contratam quem entende o que o código faz, consegue revisar o que a IA gerou e resolve quando dá errado. Recrutadores relatam que eliminam candidatos que geram código com IA mas não conseguem explicar, depurar ou adaptar. O risco real não é a IA tomar sua vaga: é você usar a IA de um jeito que impede seu cérebro de aprender.", "d": "USO QUE ATRAPALHA                    USO QUE ACELERA\n\"faz o exercício pra mim\"      ->    \"me dá uma dica sem mostrar código\"\ncopiar e colar sem ler         ->    \"explica esta linha com outras palavras\"\n\"conserta esse erro\"           ->    \"o que esse erro significa?\"\naceitar tudo que ela diz       ->    conferir na documentação oficial\npular a parte difícil          ->    \"me faz 5 perguntas sobre isso\"", "c": "Contexto: estou aprendendo Git há 1 semana.\nObjetivo: entender por que meu git push deu erro.\nO que já tentei: rodei git status e está tudo commitado.\nErro: \"rejected - fetch first\"\nPedido: NÃO me dê o comando pronto.\nExplique o que o erro significa com uma analogia\ne me faça uma pergunta que me ajude a descobrir\no próximo passo sozinho.", "u": "Para entender, destravar, revisar e praticar. Todos os dias, com as suas regras.", "x": "Colar código da IA que você não consegue explicar linha por linha. Na entrevista não tem IA, e o recrutador percebe na primeira pergunta."}, "1-0": {"s": ["header: topo da página ou de uma seção (logo, título).", "nav: o menu de navegação. main: o conteúdo principal, só um por página.", "section agrupa um tema. article é um conteúdo que faria sentido sozinho (um post, um card de produto).", "footer: rodapé. Títulos h1 a h6 seguem uma escada: um h1, depois h2, depois h3, sem pular degrau."], "e": ["Pense numa casa: ela tem portão (header), corredor com placas (nav), sala principal (main), quadros na parede (article) e quintal (footer). Se você construir tudo com paredes iguais sem nome (div), quem é cego, o Google e até outros devs não sabem onde é cada cômodo. HTML semântico é dar o nome certo para cada parte, para todo mundo se achar."], "l": [], "g": [], "q": [], "c": "<header>\n  <h1>Escritório Silva<\/h1>\n  <nav><a href=\"#areas\">Áreas<\/a><\/nav>\n<\/header>\n<main>\n  <section id=\"areas\">\n    <h2>Áreas de atuação<\/h2>\n    <article><h3>Trabalhista<\/h3><p>...<\/p><\/article>\n  <\/section>\n<\/main>\n<footer>© 2026<\/footer>", "u": "Sempre. É grátis e melhora SEO, acessibilidade e manutenção.", "x": "Escolher h3 porque \"a fonte é menor\". Tamanho se resolve no CSS; a tag diz a importância."}, "1-1": {"s": ["Box model: conteúdo, depois padding, depois border, depois margin. Com box-sizing: border-box, o tamanho que você define já inclui padding e borda.", "display: flex no pai transforma ele em prateleira. Os filhos viram itens.", "justify-content arruma no eixo principal (na horizontal, por padrão). align-items arruma no outro eixo (vertical).", "gap coloca espaço entre os itens. flex-wrap: wrap deixa os itens descerem para a linha de baixo quando não cabem."], "e": ["Toda coisa na página é uma caixa de presente. Dentro está o presente (conteúdo). Em volta vem o plástico bolha (padding), depois o papel de embrulho (border) e por fim o espaço entre uma caixa e outra na mesa (margin). Flexbox é uma prateleira mágica: você coloca as caixas nela e diz \"fiquem lado a lado, centralizadas, com espaço igual\", e elas se arrumam sozinhas."], "l": [], "g": [], "q": [], "c": "* { box-sizing: border-box; }\n\n.navbar {\n  display: flex;\n  justify-content: space-between; /* logo à esquerda, menu à direita */\n  align-items: center;            /* tudo alinhado no meio */\n  gap: 16px;\n  padding: 12px 24px;\n}", "u": "Para alinhar coisas numa linha ou numa coluna: menus, cards lado a lado, centralizar algo.", "x": "Colocar display: flex no filho em vez do pai. Quem organiza é a prateleira, não a caixa."}, "1-2": {"s": ["display: grid no pai cria o tabuleiro. grid-template-columns diz quantas colunas e de que tamanho (1fr = uma fatia do espaço que sobra).", "repeat(auto-fit, minmax(200px, 1fr)) diz: \"cabem quantas colunas de pelo menos 200px? Coloque essas e divida o resto\". Responsivo sem media query.", "grid-template-areas dá nomes às regiões, como um mapa desenhado com texto.", "Mobile-first: escreva o CSS para o celular e use @media (min-width: 768px) para ajustar telas maiores."], "e": ["Flexbox arruma numa fila só. Grid é um tabuleiro de xadrez: linhas e colunas ao mesmo tempo. Você desenha o tabuleiro e diz \"o cabeçalho ocupa a linha de cima inteira, o menu fica na coluna da esquerda\". Responsividade é o tabuleiro mudar de forma conforme o tamanho da tela: no celular vira uma coluna só, no computador vira várias."], "l": [], "g": [], "q": [], "c": ".galeria {\n  display: grid;\n  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));\n  gap: 1rem;\n}\n.pagina { display: grid; grid-template-areas: \"topo\" \"conteudo\"; }\n@media (min-width: 768px) {\n  .pagina { grid-template-columns: 240px 1fr;\n            grid-template-areas: \"topo topo\" \"menu conteudo\"; }\n}", "u": "Layouts de página inteira e galerias. Flex para dentro dos componentes, Grid para a estrutura.", "x": "Usar larguras fixas em px para tudo. No celular a página vaza para o lado."}, "1-3": {"s": ["Contraste: texto e fundo precisam de diferença suficiente (no mínimo 4.5:1 para texto normal).", "Teclado: tudo que clica precisa ser alcançado com Tab e mostrar onde o foco está (:focus-visible).", "Leitor de tela: imagens com alt, botões só com ícone com aria-label, inputs com label.", "Performance: imagens leves (webp), loading=\"lazy\" nas que estão longe do topo e menos JavaScript desnecessário."], "e": ["Imagine uma loja com uma escada na entrada. Quem usa cadeira de rodas não entra. Acessibilidade é colocar a rampa: contraste para quem enxerga pouco, teclado para quem não usa mouse, textos para o leitor de tela de quem é cego. Performance é a loja abrir a porta rápido; se demora, o cliente vai embora. O Lighthouse é o fiscal que passa e dá nota para tudo isso."], "l": [], "g": [], "q": [], "c": "<img src=\"equipe.webp\" alt=\"Equipe do escritório reunida\"\n     width=\"800\" height=\"500\" loading=\"lazy\">\n\n<button aria-label=\"Abrir menu\"><svg>...<\/svg><\/button>\n\nbutton:focus-visible { outline: 3px solid #0A6B78; }\n\n@media (prefers-reduced-motion: reduce) {\n  * { animation: none; transition: none; }\n}", "u": "Em todo site entregue. Empresas grandes cobram isso, e lei de acessibilidade existe.", "x": "Tirar o outline do foco porque \"fica feio\". Quem navega por teclado fica perdido."}, "2-0": {"s": ["const nome = \"Ana\" cria a caixa, cola a etiqueta \"nome\" e guarda o texto \"Ana\".", "string é texto (entre aspas), number é número, boolean é true ou false.", "undefined é uma caixa criada mas vazia. null é uma caixa que você esvaziou de propósito.", "Template string (crases) mistura texto e variáveis: `Olá, ${nome}`."], "e": ["Variável é uma caixinha com etiqueta. Você escreve o nome na etiqueta e guarda algo dentro. Quando precisar, chama pelo nome e o JavaScript pega o que está lá. Algumas caixas são lacradas (const): depois de fechar, não dá para trocar o conteúdo. Outras têm tampa solta (let): você pode trocar quando quiser. O tipo diz que tipo de coisa está dentro: texto, número, verdadeiro/falso..."], "l": [], "g": [], "q": [], "c": "const nome = \"Mardoqueu\";   // texto, não muda\nlet pontos = 10;            // número, pode mudar\npontos = pontos + 5;        // agora 15\nconst ativo = true;         // boolean\n\nconsole.log(`${nome} tem ${pontos} pontos`);\nconsole.log(typeof pontos); // \"number\"\nconsole.log(Number(\"42\") + 8); // 50", "u": "Use const por padrão. Só use let quando o valor realmente vai mudar. Esqueça o var.", "x": "Somar \"42\" + 8 e receber \"428\". Texto com número junta em vez de somar. Converta antes."}, "2-1": {"s": ["Operadores de comparação perguntam: > maior, < menor, === igual (valor e tipo), !== diferente.", "Operadores lógicos juntam perguntas: && (E, as duas precisam ser verdade), || (OU, basta uma), ! (NÃO, inverte).", "if (condição) { ... } roda o bloco só se a condição for true. else if testa outra. else é o \"senão\" final.", "switch é um if organizado para quando você compara a mesma variável com vários valores fixos."], "e": ["Condicionais são as decisões do programa, como quando você sai de casa: SE estiver chovendo, leva guarda-chuva; SENÃO, vai de boné. Os operadores são as perguntas que você faz: é maior? é igual? é verdade E aquilo também? O resultado de cada pergunta é sempre true ou false, e o if escolhe o caminho."], "l": [], "g": [], "q": [], "c": "const nota = 7.5;\n\nif (nota >= 9) {\n  console.log(\"A\");\n} else if (nota >= 7) {\n  console.log(\"B\");      // cai aqui\n} else {\n  console.log(\"Recuperação\");\n}\n\nconst ehFimDeSemana = dia === \"sab\" || dia === \"dom\";", "u": "Toda vez que o programa precisa decidir algo: validar, calcular desconto, escolher mensagem.", "x": "Usar == em vez de ===. O == converte tipos e acha que 0 == \"\" é verdade."}, "2-2": {"s": ["for (let i = 0; i < 10; i++): começa em 0, testa se é menor que 10, executa o bloco, soma 1 e testa de novo.", "while (condição): testa antes de cada volta. Se a condição nunca ficar falsa, o laço nunca para (loop infinito).", "for (const item of lista): pega cada item, um de cada vez, do começo ao fim.", "break sai do laço na hora. continue pula para a próxima volta."], "e": ["Laço é mandar o computador repetir uma tarefa sem você copiar o código várias vezes. É como a professora dizendo: \"escreva seu nome 100 vezes\". Você escreve a regra uma vez e diz quando parar. O for é \"repita N vezes\", o while é \"repita enquanto algo for verdade\" e o for...of é \"faça isso para cada item da lista\"."], "l": [], "g": [], "q": [], "c": "for (let i = 1; i <= 15; i++) {\n  if (i % 15 === 0) console.log(\"FizzBuzz\");\n  else if (i % 3 === 0) console.log(\"Fizz\");\n  else if (i % 5 === 0) console.log(\"Buzz\");\n  else console.log(i);\n}\n\nfor (const letra of \"banana\") {\n  if (letra === \"a\") continue; // pula os \"a\"\n  console.log(letra);\n}", "u": "Percorrer listas, somar valores, procurar algo, repetir até uma condição.", "x": "Esquecer de mudar a variável do while. O laço gira para sempre e trava a aba."}, "2-3": {"s": ["Entenda o problema: escreva com suas palavras o que entra e o que deve sair.", "Faça exemplos à mão: \"se entrar 'arara', sai true\".", "Escreva pseudocódigo em português antes do código.", "Quando der errado, coloque um breakpoint (ou console.log) e compare o que você ACHAVA que a variável tinha com o que ela TEM de verdade."], "e": ["Programar não é saber todos os comandos. É saber quebrar um problema grande em pedacinhos tão pequenos que cada um fica fácil. É como montar um quebra-cabeça: ninguém monta tudo de uma vez, você separa as bordas primeiro. Depurar é ser detetive: quando o resultado sai errado, você não chuta, você segue as pistas (os valores das variáveis) até achar onde a história mudou."], "l": [], "g": [], "q": [], "c": "// Pseudocódigo: palíndromo\n// 1. deixar a palavra minúscula\n// 2. criar a versão invertida\n// 3. comparar as duas\n\nfunction ehPalindromo(p) {\n  const limpa = p.toLowerCase();\n  let invertida = \"\";\n  for (let i = limpa.length - 1; i >= 0; i--) {\n    invertida += limpa[i];\n  }\n  debugger; // pausa aqui com o DevTools aberto\n  return limpa === invertida;\n}", "u": "Em todo exercício. O pseudocódigo é o que você fala em voz alta na entrevista.", "x": "Mudar código aleatoriamente \"para ver se funciona\". Sempre descubra o porquê."}, "3-0": {"s": ["Declaração: function nome(parametros) { ... return resultado; }.", "Chamada: nome(valores). Os valores entram nos parâmetros na mesma ordem.", "return devolve o resultado e encerra a função. Sem return, ela devolve undefined.", "Variáveis criadas dentro da função só existem lá dentro (escopo). Arrow function é a forma curta: (a, b) => a + b."], "e": ["Função é uma receita de bolo guardada no caderno. Você escreve uma vez: \"pegue ovos e farinha, misture, asse e entregue o bolo\". Depois, toda vez que quiser bolo, só chama a receita e passa os ingredientes. Os ingredientes são os parâmetros, e o bolo que sai é o return. Escopo é a cozinha: o que você mistura dentro da receita fica dentro dela."], "l": [], "g": [], "q": [], "c": "function celsiusParaF(c) {\n  return c * 9 / 5 + 32;\n}\nconsole.log(celsiusParaF(30)); // 86\n\nconst dobro = (n) => n * 2;          // arrow\nconst saudar = (nome = \"dev\") => `Oi, ${nome}`; // valor padrão\n\nfunction executar(fn) { return fn(5); } // recebe função\nexecutar(dobro); // 10", "u": "Sempre que repetir uma lógica ou quando um bloco tem um nome claro (calcularTotal, validarCPF).", "x": "Função que faz tudo: busca, calcula, mostra na tela e salva. Uma função, uma tarefa."}, "3-1": {"s": ["map(item => novoItem): roda a função em cada item e devolve um array do mesmo tamanho.", "filter(item => true ou false): devolve só os itens que deram true.", "reduce((acumulador, item) => novoAcumulador, valorInicial): passa por todos levando um acumulador.", "find devolve o primeiro que bate, some diz se algum bate, every diz se todos batem."], "e": ["Array é uma fila de caixinhas numeradas, começando do 0. map, filter e reduce são três funcionários de uma fábrica. O map pega cada item e transforma (pinta todos de azul). O filter olha cada item e só deixa passar os que obedecem uma regra. O reduce junta todos num resultado só (soma tudo num total). Nenhum deles estraga a fila original: eles entregam uma fila nova."], "l": [], "g": [], "q": [], "c": "const carrinho = [\n  { nome: \"Café\", preco: 20, qtd: 2 },\n  { nome: \"Pão\",  preco: 8,  qtd: 0 },\n];\nconst comItens = carrinho.filter(p => p.qtd > 0);\nconst subtotais = comItens.map(p => p.preco * p.qtd); // [40]\nconst total = subtotais.reduce((soma, v) => soma + v, 0); // 40\nconst cafe = carrinho.find(p => p.nome === \"Café\");", "u": "Quase sempre que tiver uma lista. Substitui a maioria dos for.", "x": "Esquecer o valor inicial do reduce (o 0). Com lista vazia, dá erro."}, "3-2": {"s": ["Acessar: cliente.nome ou cliente[\"nome\"]. Objetos podem ter objetos dentro (cliente.endereco.cidade).", "Desestruturar: const { nome, idade } = cliente cria duas variáveis de uma vez.", "Spread: { ...cliente, idade: 31 } cria uma ficha nova, igual à antiga, mas com a idade trocada.", "JSON.stringify(obj) vira texto. JSON.parse(texto) volta a ser objeto."], "e": ["Objeto é uma ficha de cadastro: cada linha tem um nome do campo e um valor (nome: \"Ana\", idade: 30). JSON é essa mesma ficha transformada em texto, para poder viajar pela internet ou ser guardada. Desestruturação é tirar só os campos que você quer da ficha. Spread é xerocar a ficha e mudar só um campo na cópia."], "l": [], "g": [], "q": [], "c": "const cliente = {\n  nome: \"Ana\",\n  endereco: { cidade: \"Maceió\", uf: \"AL\" },\n};\nconst { nome, endereco: { cidade } } = cliente;\nconst atualizado = { ...cliente, nome: \"Ana Lima\" };\n\nconst texto = JSON.stringify(cliente); // para salvar/enviar\nconst deVolta = JSON.parse(texto);     // de volta a objeto\nObject.entries(cliente).forEach(([k, v]) => console.log(k, v));", "u": "Para representar qualquer coisa do mundo real: usuário, pedido, produto. E sempre que falar com APIs.", "x": "Achar que spread copia tudo. Ele só copia o primeiro nível; objetos internos continuam compartilhados."}, "3-3": {"s": ["Strings não mudam: cada método devolve uma string nova.", "slice(início, fim) corta; split(\" \") quebra em array; join(\"-\") junta de volta.", "Intl.NumberFormat(\"pt-BR\", { style: \"currency\", currency: \"BRL\" }) formata dinheiro.", "Regex fica entre barras: /\\d{3}/ significa \"três dígitos\". .test() responde true ou false; .match() encontra."], "e": ["String é um colar de letras. Os métodos de string são ferramentas: tesoura (slice), lupa (includes), troca (replace), tudo maiúsculo (toUpperCase). Date guarda um momento no tempo, e Intl formata no jeito brasileiro (R$ 1.234,56 e 05/11/2026). Regex é um molde: você descreve o formato (\"3 números, ponto, 3 números...\") e ele encontra tudo que encaixa no molde."], "l": [], "g": [], "q": [], "c": "const titulo = \"Aprendendo Git Hoje\";\nconst slug = titulo.toLowerCase().split(\" \").join(\"-\");\n// \"aprendendo-git-hoje\"\n\nconst brl = new Intl.NumberFormat(\"pt-BR\",\n  { style: \"currency\", currency: \"BRL\" });\nbrl.format(1234.5); // \"R$ 1.234,50\"\n\nconst emailOk = /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(\"a@b.com\"); // true\nconst cpf = \"12345678909\";\nconst mascara = cpf.replace(/^(\\d{3})\\d{6}(\\d{2})$/, \"$1.***.***-$2\");", "u": "Formatar dados para o usuário, validar entradas e limpar textos.", "x": "Fazer conta de dinheiro com centavos quebrados (0.1 + 0.2). Trabalhe em centavos inteiros."}, "4-0": {"s": ["document é a raiz. document.querySelector(\".classe\") encontra o primeiro elemento que bate com o seletor CSS.", "el.textContent muda o texto; el.classList.add/remove/toggle mexe nas classes.", "document.createElement(\"li\") cria um galho solto; pai.append(filho) pendura na árvore.", "el.remove() arranca o galho. Ler e mudar o DOM é rápido, mas mudar mil vezes seguidas é lento: monte e pendure de uma vez."], "e": ["Quando o navegador lê seu HTML, ele monta uma árvore genealógica: o html é o avô, o body é o pai, os títulos e parágrafos são os filhos. Essa árvore se chama DOM. O JavaScript pode subir nessa árvore, encontrar qualquer galho e mudar, arrancar ou pendurar um galho novo. A tela é só o desenho dessa árvore: mudou a árvore, mudou a tela."], "l": [], "g": [], "q": [], "c": "const lista = document.querySelector(\"#produtos\");\nconst produtos = [\"Café\", \"Pão\", \"Leite\"];\n\nfor (const nome of produtos) {\n  const li = document.createElement(\"li\");\n  li.textContent = nome;\n  lista.append(li);\n}\n\ndocument.body.classList.toggle(\"tema-escuro\");", "u": "Sempre que a página precisa mudar sem recarregar: listas, contadores, temas.", "x": "Usar innerHTML com texto digitado pelo usuário. Abre a porta para ataque XSS; use textContent."}, "4-1": {"s": ["elemento.addEventListener(\"click\", funcao): registra quem vai reagir.", "Quando o evento acontece, o navegador chama sua função e entrega um objeto event com detalhes (qual elemento, qual tecla).", "O evento \"sobe\" do filho para o pai (bubbling). Por isso um ouvinte no pai escuta cliques dos filhos.", "event.preventDefault() cancela o comportamento padrão (ex: formulário recarregar a página)."], "e": ["Evento é uma campainha. O usuário clica, digita ou envia um formulário, e a campainha toca. addEventListener é você dizer: \"quando ESSA campainha tocar, faça ISSO\". Seu código fica parado, esperando, e só acorda quando algo acontece. Delegação é colocar um porteiro só na portaria do prédio em vez de um em cada apartamento: ele vê quem tocou e chama a pessoa certa."], "l": [], "g": [], "q": [], "c": "const lista = document.querySelector(\"#tarefas\");\n\n// um ouvinte só, para todos os botões \"excluir\"\nlista.addEventListener(\"click\", (e) => {\n  const botao = e.target.closest(\"[data-excluir]\");\n  if (!botao) return;\n  botao.closest(\"li\").remove();\n});\n\ndocument.addEventListener(\"keydown\", (e) => {\n  if (e.key === \"Escape\") fecharModal();\n});", "u": "Toda interação do usuário. Use delegação em listas que mudam.", "x": "Escrever addEventListener(\"click\", salvar()) com parênteses. Isso chama na hora, não no clique."}, "4-2": {"s": ["HTML já valida sozinho: required, type=\"email\", minlength, pattern.", "No JS, ouça o evento \"submit\" do form e chame preventDefault para não recarregar.", "new FormData(form) junta todos os campos; Object.fromEntries transforma em objeto.", "Mostre o erro perto do campo e ligue com aria-describedby, para o leitor de tela anunciar."], "e": ["Formulário é a ficha que o cliente preenche no balcão. A validação no navegador é a atendente olhando a ficha na hora: \"faltou o telefone\". Isso é rápido e gentil. Mas alguém mal-intencionado pode pular a atendente, então o servidor sempre confere de novo, como o gerente que revisa tudo antes de aprovar."], "l": [], "g": [], "q": [], "c": "<form id=\"contato\" novalidate>\n  <label for=\"email\">E-mail<\/label>\n  <input id=\"email\" name=\"email\" type=\"email\" required\n         aria-describedby=\"email-erro\">\n  <p id=\"email-erro\" class=\"erro\"><\/p>\n  <button>Enviar<\/button>\n<\/form>\n\nform.addEventListener(\"submit\", (e) => {\n  e.preventDefault();\n  const dados = Object.fromEntries(new FormData(form));\n  if (!form.email.checkValidity()) {\n    document.querySelector(\"#email-erro\").textContent = \"Digite um e-mail válido.\";\n    return;\n  }\n  enviar(dados);\n});", "u": "Em todo formulário: cadastro, contato, login.", "x": "Confiar só na validação do front. Ela é para conforto, não para segurança."}, "4-3": {"s": ["localStorage.setItem(\"chave\", \"texto\") guarda. getItem(\"chave\") lê. removeItem apaga.", "Guarde objetos com JSON.stringify e leia com JSON.parse.", "Fluxo saudável: estado muda, você salva no localStorage e redesenha a tela.", "Ao abrir a página, leia a gaveta e monte o estado inicial. Use try/catch porque o texto pode estar corrompido."], "e": ["Quando você fecha a aba, tudo que estava nas variáveis some, como um quadro branco apagado. localStorage é uma gaveta do navegador que não esvazia quando você fecha. Mas a gaveta só guarda papel escrito (texto), então antes de guardar um objeto você escreve ele como texto (JSON.stringify), e ao tirar você lê de volta (JSON.parse). Estado é a \"verdade atual\" do app, e a tela é só um desenho dessa verdade."], "l": [], "g": [], "q": [], "c": "const KEY = \"tarefas-v1\";\nlet estado = carregar();\n\nfunction carregar() {\n  try { return JSON.parse(localStorage.getItem(KEY)) ?? []; }\n  catch { return []; }\n}\nfunction salvar() {\n  localStorage.setItem(KEY, JSON.stringify(estado));\n}\nfunction adicionar(titulo) {\n  estado = [...estado, { id: Date.now(), titulo, feita: false }];\n  salvar();\n  render(estado);\n}", "u": "Preferências do usuário, rascunhos e apps pequenos sem back-end. Não para senhas ou dados sensíveis.", "x": "Guardar o objeto direto (setItem(\"x\", obj)). Vira o texto \"[object Object]\" e você perde tudo."}, "5-0": {"s": ["Requisição: método + URL + cabeçalhos (headers, como \"aceito JSON\") + corpo (os dados, no POST/PUT).", "Resposta: código de status + cabeçalhos + corpo (normalmente JSON).", "Famílias de status: 2xx sucesso, 3xx redirecionamento, 4xx erro de quem pediu, 5xx erro do servidor.", "REST organiza a API em coisas (recursos) com URLs no plural: GET /pedidos lista, GET /pedidos/7 mostra um, POST /pedidos cria."], "e": ["A internet funciona como um restaurante. Seu navegador é o cliente, o servidor é a cozinha e o HTTP é o jeito de fazer pedidos. Todo pedido tem um verbo (GET = quero ver o cardápio, POST = quero fazer um pedido novo, PUT/PATCH = quero mudar meu pedido, DELETE = cancela). A cozinha sempre responde com um número que diz como foi: 200 tudo certo, 404 não existe, 500 a cozinha pegou fogo."], "l": [], "g": [], "q": [], "c": "GET    /pedidos?status=aberto   -> 200 [ {...}, {...} ]\nGET    /pedidos/7               -> 200 { \"id\": 7, ... }\nPOST   /pedidos  {\"item\":\"pizza\"} -> 201 { \"id\": 8, ... }\nPATCH  /pedidos/8 {\"qtd\":2}     -> 200 { \"id\": 8, \"qtd\": 2 }\nDELETE /pedidos/8               -> 204 (sem corpo)\nGET    /pedidos/999             -> 404 { \"message\": \"Pedido não encontrado\" }", "u": "Toda vez que front e back conversam. É a base de tudo que vem depois.", "x": "Responder 200 com { erro: \"...\" } no corpo. Use o status certo (400, 404) para o erro ser erro."}, "5-1": {"s": ["Uma Promise nasce \"pendente\". Depois vira \"resolvida\" (deu certo, com um valor) ou \"rejeitada\" (deu erro).", ".then(valor => ...) roda quando resolve. .catch(erro => ...) roda quando rejeita.", "O event loop: o código normal roda primeiro; as respostas prontas esperam numa fila e são atendidas quando a pilha esvazia.", "Promise.all espera várias ao mesmo tempo; se uma falhar, todas falham."], "e": ["Algumas tarefas demoram: buscar dados na internet, ler um arquivo. Se o JavaScript ficasse parado esperando, a página congelaria. Então ele faz como no fast food: você pede, recebe uma senha (a Promise) e vai sentar. Quando o lanche fica pronto, chamam sua senha (then). Se acabou o ingrediente, avisam do problema (catch). Enquanto isso, você continua fazendo outras coisas."], "l": [], "g": [], "q": [], "c": "const delay = (ms) => new Promise(res => setTimeout(res, ms));\n\nconsole.log(\"1\");\ndelay(1000).then(() => console.log(\"3 (depois de 1s)\"));\nconsole.log(\"2\");\n\nPromise.all([delay(500), delay(800)])\n  .then(() => console.log(\"as duas terminaram\"))\n  .catch((erro) => console.error(\"alguma falhou\", erro));", "u": "Base de qualquer coisa que espera: rede, arquivos, timers.", "x": "Esquecer o catch. O erro some em silêncio e você não sabe por que nada aparece."}, "5-2": {"s": ["Marque a função com async. Dentro dela, use await antes de algo que demora.", "fetch(url) devolve a resposta. Você confere response.ok (status 200 a 299).", "await response.json() transforma o corpo em objeto.", "try/catch pega erros de rede e os que você mesmo lança; mostre carregando, erro e sucesso na tela."], "e": ["async/await é a mesma senha do fast food, mas escrita como se fosse em ordem: \"espere o lanche, depois coma\". A palavra await quer dizer \"pausa SÓ esta tarefa até a promessa resolver\". O resto da página continua funcionando. fetch é o garçom que vai até outro servidor buscar dados para você. Ele sempre devolve uma promessa."], "l": [], "g": [], "q": [], "c": "async function buscarCep(cep) {\n  mostrar(\"Carregando...\");\n  try {\n    const res = await fetch(`https://brasilapi.com.br/api/cep/v1/${cep}`);\n    if (!res.ok) throw new Error(\"CEP não encontrado\");\n    const dados = await res.json();\n    mostrar(`${dados.street}, ${dados.city}`);\n  } catch (erro) {\n    mostrar(erro.message);\n  }\n}", "u": "Toda chamada a API. É o jeito moderno e mais legível.", "x": "Achar que fetch dá erro no 404. Ele só falha em problema de rede; o 404 você verifica com res.ok."}, "5-3": {"s": ["Paginação: a API entrega pedaços (?page=2&limit=20) e diz quantos existem no total.", "Cache: antes de buscar, confira se já tem a resposta guardada e se ela ainda não venceu.", "Debounce: na busca, espere o usuário parar de digitar uns 300ms antes de chamar a API.", "Centralize as chamadas numa função (apiClient) que trata erros do mesmo jeito em todo lugar."], "e": ["Consumir uma API de verdade é como fazer compras num mercado grande. Você não leva tudo de uma vez (paginação: 20 itens por página). Você anota o que já comprou para não voltar à toa (cache). E quando o mercado está fechado, você tem um plano B em vez de ficar parado na porta (tratamento de erro). Isso separa um app de verdade de uma demonstração."], "l": [], "g": [], "q": [], "c": "const cache = new Map();\n\nasync function apiClient(url) {\n  const salvo = cache.get(url);\n  if (salvo && Date.now() - salvo.em < 60_000) return salvo.dados;\n\n  const res = await fetch(url);\n  if (!res.ok) throw new Error(`Erro ${res.status}`);\n  const dados = await res.json();\n  cache.set(url, { dados, em: Date.now() });\n  return dados;\n}", "u": "Qualquer tela que lista dados de uma API ou tem busca.", "x": "Chamar a API a cada letra digitada. Gasta limite, deixa lento e mistura respostas."}, "6-0": {"s": ["O(1): tempo constante, tipo pegar o item pela posição (array[5]) ou pela chave num Map.", "O(n): um laço passando por todos os itens.", "O(n²): um laço dentro de outro laço sobre a mesma lista.", "O(log n): cortar o problema pela metade a cada passo (busca binária numa lista ordenada)."], "e": ["Big-O é responder: \"se a quantidade de coisas dobrar, quanto mais trabalho eu tenho?\". Procurar um nome numa lista de chamada desordenada, um por um, é O(n): dobrou a turma, dobrou o trabalho. Num dicionário você abre no meio e descarta metade a cada vez: O(log n), quase não aumenta. Comparar cada aluno com todos os outros é O(n²): dobrou a turma, quadruplicou o trabalho."], "l": [], "g": [], "q": [], "c": "// O(n²): compara todo mundo com todo mundo\nfunction temDuplicadoLento(arr) {\n  for (let i = 0; i < arr.length; i++)\n    for (let j = i + 1; j < arr.length; j++)\n      if (arr[i] === arr[j]) return true;\n  return false;\n}\n// O(n): um Set lembra o que já viu\nfunction temDuplicado(arr) {\n  const vistos = new Set();\n  for (const x of arr) {\n    if (vistos.has(x)) return true;\n    vistos.add(x);\n  }\n  return false;\n}", "u": "Para explicar na entrevista por que sua solução é boa, e para perceber quando um código vai ficar lento.", "x": "Achar que menos linhas é mais rápido. Um includes dentro de um for já é O(n²)."}, "6-1": {"s": ["Pilha: push coloca no topo, pop tira do topo. Usada para desfazer, navegação de voltar, validar parênteses.", "Fila: push coloca no fim, shift tira do começo. Usada para processar pedidos em ordem.", "Map: set(chave, valor) guarda, get(chave) busca em O(1), has(chave) confere.", "Truque de entrevista: quase todo \"encontre pares\" ou \"conte repetições\" vira um Map."], "e": ["Pilha é a pilha de pratos: o último que você coloca é o primeiro que tira. É assim que funciona o Ctrl+Z (desfaz a última coisa). Fila é a fila do banco: quem chegou primeiro é atendido primeiro. Hash map (Map ou objeto) é um armário com chaves: você vai direto na gaveta \"CPF 123\" sem abrir as outras. Por isso a busca é instantânea."], "l": [], "g": [], "q": [], "c": "function balanceado(texto) {\n  const pares = { \")\": \"(\", \"]\": \"[\", \"}\": \"{\" };\n  const pilha = [];\n  for (const c of texto) {\n    if (\"([{\".includes(c)) pilha.push(c);\n    else if (c in pares && pilha.pop() !== pares[c]) return false;\n  }\n  return pilha.length === 0;\n}\n\nconst freq = new Map();\nfor (const p of \"a b a\".split(\" \")) freq.set(p, (freq.get(p) ?? 0) + 1);", "u": "Sempre que precisar de ordem de chegada (fila), de voltar atrás (pilha) ou de busca rápida (Map).", "x": "Usar array.includes para checar presença dentro de um laço. Troque por Set ou Map."}, "6-2": {"s": ["Caso base: a situação mais simples, que responde direto sem chamar de novo (fatorial(1) = 1).", "Passo recursivo: resolve um pedaço e chama a si mesma com o resto (n * fatorial(n - 1)).", "Cada chamada fica empilhada esperando a de dentro responder (pilha de chamadas). Depois desempilham voltando.", "Ordenação: merge sort divide a lista ao meio de forma recursiva, ordena as metades e junta. Fica O(n log n)."], "e": ["Recursão é uma função que resolve um problema pedindo ajuda a si mesma com um problema um pouco menor. É como bonecas russas: para chegar na menor, você abre uma, que tem outra, que tem outra... até a última, que não abre mais. Essa última é o caso base, a regra que faz parar. Sem ela, as bonecas nunca acabam e o programa quebra."], "l": [], "g": [], "q": [], "c": "function fatorial(n) {\n  if (n <= 1) return 1;          // caso base\n  return n * fatorial(n - 1);    // problema menor\n}\n// fatorial(4) = 4 * 3 * 2 * 1 = 24\n\nfunction somaAninhada(arr) {\n  return arr.reduce((s, x) =>\n    s + (Array.isArray(x) ? somaAninhada(x) : x), 0);\n}\nsomaAninhada([1, [2, [3, 4]]]); // 10", "u": "Estruturas que têm coisas dentro de coisas: pastas, comentários com respostas, menus, árvores.", "x": "Esquecer o caso base. Dá erro \"Maximum call stack size exceeded\"."}, "6-3": {"s": ["Entenda: repita o problema com suas palavras e pergunte sobre casos estranhos (lista vazia? negativos?).", "Exemplos: resolva 2 casos à mão, em voz alta.", "Força bruta primeiro: diga a solução simples e a complexidade dela. Depois otimize (normalmente com Map, Set ou dois ponteiros).", "Teste: rode seu código \"de cabeça\" com um exemplo e com um caso de borda."], "e": ["Na entrevista técnica, o entrevistador não quer só a resposta certa. Ele quer ver você pensando, como num programa de culinária em que o jurado acompanha cada passo. Quem fica calado e trava perde para quem fala o raciocínio mesmo errando no caminho. Existe um roteiro que funciona para quase todo problema."], "l": [], "g": [], "q": [], "c": "// Two-sum: índices de dois números que somam alvo\n// Força bruta: dois laços, O(n²)\n// Otimizado: guardo o que já vi num Map, O(n)\nfunction twoSum(nums, alvo) {\n  const vistos = new Map(); // valor -> índice\n  for (let i = 0; i < nums.length; i++) {\n    const falta = alvo - nums[i];\n    if (vistos.has(falta)) return [vistos.get(falta), i];\n    vistos.set(nums[i], i);\n  }\n  return [];\n}\ntwoSum([2, 7, 11, 15], 9); // [0, 1]", "u": "Treine um problema por dia em voz alta até o roteiro sair natural.", "x": "Começar a codar no segundo 10. Gaste os primeiros minutos entendendo e conversando."}, "7-0": {"s": ["Você escreve arquivos .ts com tipos: let idade: number.", "Muitas vezes nem precisa escrever o tipo: const nome = \"Ana\" já é entendido como string (inferência).", "O compilador (tsc) confere tudo. Com \"strict\": true ele é exigente, e é assim que você quer.", "any desliga a checagem (evite). unknown diz \"não sei o tipo, mas vou conferir antes de usar\"."], "e": ["JavaScript deixa você colocar qualquer coisa em qualquer caixa e só descobre o problema quando o programa já está rodando, às vezes na mão do cliente. TypeScript é colocar etiquetas nas caixas: \"aqui só entra número\". Se você tentar colocar texto, o editor sublinha em vermelho na hora, antes de rodar. No final, o TypeScript tira as etiquetas e vira JavaScript normal."], "l": [], "g": [], "q": [], "c": "function precoFinal(preco: number, desconto: number): number {\n  return preco - preco * desconto;\n}\nprecoFinal(100, 0.1);     // ok\nprecoFinal(\"100\", 0.1);   // erro antes de rodar!\n\ntype FormaPagamento = \"pix\" | \"cartao\" | \"boleto\";\nlet pagamento: FormaPagamento = \"pix\";\npagamento = \"dinheiro\";   // erro: não está na lista", "u": "Em todo projeto novo. Vagas júnior em JS hoje quase sempre esperam TypeScript.", "x": "Encher de any para o erro sumir. Você volta a ter JavaScript sem proteção."}, "7-1": {"s": ["interface Usuario { nome: string; email?: string } descreve o formato. O ? torna o campo opcional.", "type também descreve formatos e ainda faz unions: type Status = \"ativo\" | \"inativo\".", "União discriminada: cada opção tem um campo em comum (tipo) que diz qual ela é.", "Ao usar if ou switch nesse campo, o TS libera só os campos daquela opção."], "e": ["Interface é o desenho de um formulário: diz quais campos existem e o tipo de cada um, sem preencher nada. Union é uma pergunta de múltipla escolha: o valor pode ser A OU B. Narrowing é o TypeScript ficando esperto: depois que você confere qual opção é (\"se tipo for pix\"), ele sabe exatamente o que tem dentro naquele trecho."], "l": [], "g": [], "q": [], "c": "type Pagamento =\n  | { tipo: \"pix\"; chave: string }\n  | { tipo: \"cartao\"; numero: string; parcelas: number }\n  | { tipo: \"boleto\"; vencimento: Date };\n\nfunction descrever(p: Pagamento) {\n  switch (p.tipo) {\n    case \"pix\":    return `Pix para ${p.chave}`;\n    case \"cartao\": return `${p.parcelas}x no cartão`;\n    case \"boleto\": return `Vence em ${p.vencimento.toLocaleDateString()}`;\n  }\n}", "u": "Para modelar os dados do seu domínio (pedido, cliente) e estados que mudam (carregando, erro, sucesso).", "x": "Criar um objeto com muitos campos opcionais em vez de uma união. Aparecem combinações impossíveis."}, "7-2": {"s": ["<T> é o espaço em branco da etiqueta. function primeiro<T>(lista: T[]): T.", "Quando você chama primeiro([1, 2]), o TS preenche T = number sozinho.", "Partial<Usuario> serve para atualização: todos os campos opcionais.", "Pick<Usuario, \"nome\" | \"email\"> e Omit<Usuario, \"senha\"> criam versões menores."], "e": ["Generic é uma caixa com etiqueta em branco. Você monta uma vez a \"caixa de lista\", e quem usar escreve na etiqueta o que vai dentro: lista de números, lista de clientes. Depois de escrito, só aquilo entra. Utility types são máquinas que transformam tipos prontos: Partial deixa todos os campos opcionais, Pick escolhe alguns, Omit tira alguns."], "l": [], "g": [], "q": [], "c": "function primeiro<T>(lista: T[]): T | undefined {\n  return lista[0];\n}\nconst n = primeiro([10, 20]);       // number\nconst c = primeiro([{ nome: \"Ana\" }]); // { nome: string }\n\ninterface Usuario { id: number; nome: string; senha: string }\ntype UsuarioPublico = Omit<Usuario, \"senha\">;\ntype Atualiz
