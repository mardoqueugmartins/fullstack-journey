arUsuario = Partial<Pick<Usuario, \"nome\" | \"senha\">>;\n\ntype ApiResposta<T> = { dados: T; erro: null } | { dados: null; erro: string };", "u": "Funções e tipos reutilizáveis: respostas de API, listas, formulários.", "x": "Criar um tipo novo copiando campos à mão. Quando o original muda, a cópia fica desatualizada."}, "7-3": {"s": ["Você descreve o formato com o Zod: z.object({ nome: z.string() }).", "schema.parse(dados) confere. Se estiver errado, lança erro com a explicação. safeParse devolve { success, data, error } sem lançar.", "type Cliente = z.infer<typeof schema> gera o tipo TS a partir do schema.", "ESLint aponta código suspeito, Prettier formata e tsc --noEmit confere tipos. Coloque tudo nos scripts."], "e": ["Os tipos do TypeScript só existem enquanto você escreve o código. Quando o app roda e chega um JSON de uma API ou do localStorage, ninguém confere se ele é do jeito que você prometeu. O Zod é o fiscal na porta: ele confere de verdade, em tempo de execução, e ainda gera o tipo para o TypeScript. Um schema, duas proteções."], "l": [], "g": [], "q": [], "c": "import { z } from \"zod\";\n\nconst ClienteSchema = z.object({\n  nome: z.string().min(2),\n  email: z.string().email(),\n  idade: z.number().int().positive().optional(),\n});\ntype Cliente = z.infer<typeof ClienteSchema>;\n\nconst bruto = JSON.parse(localStorage.getItem(\"cliente\") ?? \"{}\");\nconst r = ClienteSchema.safeParse(bruto);\nif (!r.success) console.log(r.error.issues);\nelse usar(r.data); // r.data é Cliente", "u": "Em toda fronteira: dados de API, formulários, localStorage, variáveis de ambiente.", "x": "Fazer \"as Cliente\" num JSON desconhecido. Isso só cala o TypeScript; não confere nada."}, "8-0": {"s": ["class define o molde. constructor é o que roda no momento em que o objeto nasce.", "this é \"este objeto aqui\", o biscoito que está sendo usado no momento.", "Atributos guardam dados (saldo). Métodos são ações (depositar).", "new ContaBancaria(\"Ana\") cria um objeto novo a partir do molde."], "e": ["Classe é a forma de biscoito. Objeto é cada biscoito que sai da forma. Todos têm o mesmo formato (os mesmos campos e ações), mas cada um tem seu recheio (seus valores). Uma classe ContaBancaria diz \"toda conta tem saldo e sabe depositar\". Cada conta criada com new é um objeto independente, com seu próprio saldo."], "l": [], "g": [], "q": [], "c": "class ContaBancaria {\n  saldo = 0;\n  constructor(public titular: string) {}\n\n  depositar(valor: number) {\n    if (valor <= 0) throw new Error(\"Valor inválido\");\n    this.saldo += valor;\n  }\n}\n\nconst conta = new ContaBancaria(\"Ana\");\nconta.depositar(100);\nconsole.log(conta.saldo); // 100", "u": "Quando uma coisa tem dados e regras que andam juntos (conta, pedido, reserva).", "x": "Criar classe para tudo, até para coisas que seriam só uma função simples."}, "8-1": {"s": ["private ou # esconde o campo: só os métodos da própria classe mexem nele.", "extends cria herança: a classe filha recebe tudo da mãe e pode sobrescrever métodos.", "Composição: a classe recebe outro objeto e delega o trabalho para ele.", "Polimorfismo: objetos diferentes respondem ao mesmo método (area()) cada um do seu jeito."], "e": ["Encapsular é o controle remoto: você aperta \"aumentar volume\" sem abrir a TV e mexer nos fios. Os fios ficam escondidos (private). Herança é dizer \"um gerente É um funcionário, com algumas coisas a mais\". Composição é dizer \"um carro TEM um motor\": você monta com peças e pode trocar o motor sem mudar o carro. Na prática, composição quebra menos."], "l": [], "g": [], "q": [], "c": "class Conta {\n  #saldo = 0;                    // ninguém mexe de fora\n  get saldo() { return this.#saldo; }\n  depositar(v: number) { this.#saldo += v; }\n}\n\ninterface Notificador { enviar(msg: string): void }\nclass Pedido {\n  constructor(private notificador: Notificador) {} // TEM um\n  confirmar() { this.notificador.enviar(\"Pedido confirmado\"); }\n}\nnew Pedido({ enviar: (m) => console.log(\"WhatsApp:\", m) }).confirmar();", "u": "Encapsule sempre. Herança só para \"é um\" real e raso. Composição para o resto.", "x": "Herança de 4 níveis. Mudar a classe do topo quebra tudo lá embaixo."}, "8-2": {"s": ["S (Responsabilidade única): uma classe tem um motivo para mudar. Validar, salvar e mandar e-mail são três classes.", "O (Aberto/fechado): adicione comportamento novo criando código novo, sem editar o que funciona (ex: estratégias de desconto).", "L e I: subclasses devem funcionar no lugar da mãe; interfaces pequenas e focadas.", "D (Inversão de dependência): o serviço recebe um repositório por interface, em vez de criar o banco dentro dele."], "e": ["SOLID são cinco conselhos para o código ser fácil de mudar sem quebrar. O mais importante para começar é o S: cada peça faz uma coisa só, como a caixa de ferramentas, em vez de um canivete que faz tudo mal. O D diz: dependa de combinados, não de peças específicas. Como uma tomada: qualquer aparelho com o plugue certo funciona."], "l": [], "g": [], "q": [], "c": "interface PedidoRepo { salvar(p: Pedido): Promise<void> }\n\nclass CriarPedido {\n  constructor(private repo: PedidoRepo) {}   // D\n  async executar(p: Pedido) {\n    if (p.itens.length === 0) throw new Error(\"Pedido vazio\");\n    await this.repo.salvar(p);\n  }\n}\n// produção: new CriarPedido(new PrismaPedidoRepo())\n// teste:    new CriarPedido(new PedidoRepoEmMemoria())", "u": "Como guia na hora de refatorar e explicar decisões. Não como regra para aplicar em tudo.", "x": "Criar 10 interfaces e classes para um script de 30 linhas. SOLID resolve problema de crescimento."}, "8-3": {"s": ["Nomes que dizem a intenção: diasAtrasado em vez de d.", "Funções pequenas que fazem uma coisa. Se precisa de \"e\" para descrever, divida.", "Retorno antecipado: trate os casos de erro primeiro e saia, evitando ifs dentro de ifs.", "Números mágicos viram constantes com nome. Comentário explica o porquê, não o quê."], "e": ["Código limpo é escrever para a próxima pessoa que vai ler, que muitas vezes é você daqui a 3 meses. É como deixar a cozinha arrumada: cada coisa com nome, no lugar, sem gaveta misteriosa. Refatorar é arrumar a cozinha sem mudar o cardápio: o comportamento continua igual, só fica mais fácil de entender."], "l": [], "g": [], "q": [], "c": "// antes\nfunction f(u) {\n  if (u) { if (u.i > 17) { if (u.a) { return true } } }\n  return false;\n}\n// depois\nconst IDADE_MINIMA = 18;\nfunction podeContratar(usuario) {\n  if (!usuario) return false;\n  if (usuario.idade < IDADE_MINIMA) return false;\n  return usuario.ativo;\n}", "u": "Em todo commit. Refatore logo depois de fazer funcionar, enquanto ainda lembra do contexto.", "x": "Refatorar sem testes ou sem conferir depois. Arrumou a cozinha e sumiu o sal."}, "9-0": {"s": ["Componente é uma função com nome começando em maiúscula que retorna JSX.", "JSX parece HTML mas é JavaScript: use className em vez de class e {} para colocar variáveis.", "Você usa componentes como tags: <Card />. Componentes dentro de componentes formam a árvore da tela.", "O Vite cria o projeto, roda um servidor de desenvolvimento e recarrega a tela quando você salva."], "e": ["Antes do React, você mexia na árvore do DOM na mão, galho por galho. Com React, você monta a página com peças de LEGO chamadas componentes: um Header, um Card, um Botão. Cada peça é uma função que devolve o desenho dela (JSX, que parece HTML). Você diz COMO a tela deve ficar, e o React cuida de mexer no DOM do jeito mais rápido."], "l": [], "g": [], "q": [], "c": "// npm create vite@latest meu-app -- --template react-ts\nfunction Header() {\n  return <header><h1>Cardápio<\/h1><\/header>;\n}\nfunction App() {\n  const aberto = true;\n  return (\n    <>\n      <Header />\n      {aberto ? <p>Estamos abertos<\/p> : <p>Fechado<\/p>}\n    <\/>\n  );\n}", "u": "Interfaces com muitas partes que mudam: dashboards, apps, cardápios, painéis.", "x": "Fazer um componente gigante com a página inteira. Quebre em peças com nome claro."}, "9-1": {"s": ["O pai passa: <Card titulo=\"Pizza\" preco={40} />. Strings vão entre aspas, o resto entre chaves.", "O filho recebe um objeto: function Card({ titulo, preco }).", "Props são só de leitura. Para mudar algo, o pai muda e manda de novo.", "Funções também podem ser props (onClick), e é assim que o filho avisa o pai que algo aconteceu."], "e": ["Props são os recados que o componente pai manda para o filho. Pense num cozinheiro (componente Card) que recebe o pedido do garçom (props): \"faça um card com o título Pizza e o preço 40\". O cozinheiro usa o pedido, mas não pode alterar o pedido. children é um recado especial: \"tudo que eu colocar dentro de você, mostre aqui no meio\"."], "l": [], "g": [], "q": [], "c": "type CardProps = { titulo: string; preco: number; onAdicionar: () => void };\n\nfunction Card({ titulo, preco, onAdicionar }: CardProps) {\n  return (\n    <article>\n      <h3>{titulo}<\/h3>\n      <p>R$ {preco.toFixed(2)}<\/p>\n      <button onClick={onAdicionar}>Adicionar<\/button>\n    <\/article>\n  );\n}\nfunction Caixa({ children }: { children: React.ReactNode }) {\n  return <div className=\"caixa\">{children}<\/div>;\n}", "u": "Sempre que um componente precisa ser reutilizado com dados diferentes.", "x": "Tentar mudar uma prop dentro do filho (props.preco = 10). Não funciona e confunde o React."}, "9-2": {"s": ["const [valor, setValor] = useState(inicial) cria a memória e a função para mudá-la.", "Chamar setValor(novo) agenda um novo desenho do componente com o valor novo.", "Nunca altere o estado direto (lista.push). Crie uma cópia nova: setLista([...lista, item]).", "Quando o valor novo depende do anterior, use a forma de função: setCount(c => c + 1)."], "e": ["Estado é a memória do componente, como o placar de um jogo. Quando o placar muda, o telão atualiza sozinho. No React, você não muda a tela: você muda o estado com a função set, e o React redesenha o componente com o valor novo. Se você mudar uma variável comum, o React nem fica sabendo, e a tela não muda."], "l": [], "g": [], "q": [], "c": "function Contador() {\n  const [count, setCount] = useState(0);\n  const [itens, setItens] = useState<string[]>([]);\n\n  return (\n    <>\n      <button onClick={() => setCount(c => c + 1)}>+1<\/button>\n      <p>{count}<\/p>\n      <button onClick={() => setItens(prev => [...prev, \"novo\"])}>\n        Adicionar ({itens.length})\n      <\/button>\n    <\/>\n  );\n}", "u": "Para tudo que muda na tela por causa do usuário: inputs, abrir/fechar, listas, contadores.", "x": "Guardar no estado algo que dá para calcular (total do carrinho). Calcule na hora a partir dos itens."}, "9-3": {"s": ["{lista.map(item => <li key={item.id}>{item.nome}<\/li>)} desenha a lista.", "A key precisa ser única e estável. O id do banco é perfeito; o índice do array não é.", "Input controlado: value={nome} e onChange={e => setNome(e.target.value)}.", "Filtros e buscas são calculados na hora: const visiveis = lista.filter(...)."], "e": ["Para mostrar uma lista, você pega um array e transforma cada item em um pedaço de tela com map. A key é o crachá de cada item: quando a lista muda de ordem ou perde alguém, o React olha os crachás para saber quem é quem e só mexe no necessário. Formulário controlado é um input cujo valor mora no estado: o que aparece no campo é sempre o que está na memória."], "l": [], "g": [], "q": [], "c": "function Lista({ produtos }: { produtos: { id: number; nome: string }[] }) {\n  const [busca, setBusca] = useState(\"\");\n  const visiveis = produtos.filter(p =>\n    p.nome.toLowerCase().includes(busca.toLowerCase()));\n\n  return (\n    <>\n      <input value={busca} onChange={e => setBusca(e.target.value)}\n             aria-label=\"Buscar\" />\n      <ul>{visiveis.map(p => <li key={p.id}>{p.nome}<\/li>)}<\/ul>\n    <\/>\n  );\n}", "u": "Toda lista e todo campo de formulário no React.", "x": "Usar key={index} em lista que reordena ou apaga. Os dados trocam de lugar na tela."}, "10-0": {"s": ["useEffect(() => { ... }, [deps]) roda depois que o componente aparece e toda vez que algo da lista muda.", "Lista vazia [] roda só uma vez, quando o componente aparece.", "O return dentro do efeito é o cleanup: roda antes do próximo efeito e quando o componente sai da tela.", "Se não é sincronizar com algo de fora, você provavelmente não precisa de efeito. Calcule direto no corpo."], "e": ["useEffect é o jeito de o componente fazer algo com o mundo lá fora depois de aparecer na tela: buscar dados, ligar um timer, ouvir o tamanho da janela. É como ligar o ventilador quando entra no quarto. O cleanup é desligar quando sai. A lista de dependências diz quando religar: \"toda vez que o filtro mudar, busque de novo\"."], "l": [], "g": [], "q": [], "c": "function Clientes({ cidade }: { cidade: string }) {\n  const [dados, setDados] = useState([]);\n\n  useEffect(() => {\n    const ctrl = new AbortController();\n    fetch(`/api/clientes?cidade=${cidade}`, { signal: ctrl.signal })\n      .then(r => r.json())\n      .then(setDados)\n      .catch(() => {});\n    return () => ctrl.abort(); // cleanup: cancela se a cidade mudar\n  }, [cidade]);\n\n  return <ul>{dados.map((c: any) => <li key={c.id}>{c.nome}<\/li>)}<\/ul>;\n}", "u": "Sincronizar com coisas externas: API, timers, eventos da janela, bibliotecas que não são React.", "x": "Mudar um estado dentro do efeito que está na própria lista de dependências. Vira loop infinito."}, "10-1": {"s": ["Crie uma função useAlgumaCoisa. Dentro dela, use useState, useEffect etc.", "Retorne o que o componente precisa: valores e funções.", "Cada componente que usa o hook tem a sua própria cópia do estado.", "Regras: chame hooks só no topo do componente ou de outro hook, nunca dentro de if ou laço."], "e": ["Quando você repete a mesma lógica com estado e efeito em vários componentes, pode guardar essa lógica num hook seu, como um tempero pronto. Um hook customizado é só uma função que começa com \"use\" e usa outros hooks dentro. Ele não desenha nada: entrega valores e funções para quem chamar."], "l": [], "g": [], "q": [], "c": "function useLocalStorage<T>(chave: string, inicial: T) {\n  const [valor, setValor] = useState<T>(() => {\n    try { return JSON.parse(localStorage.getItem(chave) ?? \"\") as T; }\n    catch { return inicial; }\n  });\n  useEffect(() => {\n    localStorage.setItem(chave, JSON.stringify(valor));\n  }, [chave, valor]);\n  return [valor, setValor] as const;\n}\n\nconst [tema, setTema] = useLocalStorage(\"tema\", \"claro\");", "u": "Quando a mesma lógica aparece em dois ou mais componentes.", "x": "Chamar hook dentro de if. O React se perde na ordem e dá erro."}, "10-2": {"s": ["Rotas mapeiam URL para componente: \"/\" mostra Home, \"/produto/:id\" mostra Detalhe.", "useParams lê o pedaço variável da URL (o id). Link navega sem recarregar.", "Context: createContext cria o sinal, o Provider liga o roteador lá no topo, useContext pega o sinal em qualquer lugar abaixo.", "Quando o valor do Context muda, todos que usam ele são redesenhados. Por isso guarde só o que é realmente global."], "e": ["React Router troca a \"página\" sem recarregar o site, como mudar de canal na TV: a TV é a mesma, só muda o que aparece. Context é o Wi-Fi da casa: em vez de passar um cabo (props) de cômodo em cômodo até chegar no quarto, todo mundo pega o sinal direto. Serve para coisas que muitos componentes usam: usuário logado, tema."], "l": [], "g": [], "q": [], "c": "const AuthContext = createContext<{ usuario: string | null }>({ usuario: null });\n\nfunction App() {\n  return (\n    <AuthContext.Provider value={{ usuario: \"Ana\" }}>\n      <Routes>\n        <Route path=\"/\" element={<Home />} />\n        <Route path=\"/produto/:id\" element={<Produto />} />\n        <Route path=\"*\" element={<NaoEncontrado />} />\n      <\/Routes>\n    <\/AuthContext.Provider>\n  );\n}\nfunction Produto() {\n  const { id } = useParams();\n  const { usuario } = useContext(AuthContext);\n  return <p>{usuario} vendo produto {id}<\/p>;\n}", "u": "Rotas em todo app com mais de uma tela. Context para tema, idioma e usuário logado.", "x": "Colocar tudo no Context. Qualquer mudança redesenha o app inteiro."}, "10-3": {"s": ["Crie o schema Zod com as regras e mensagens em português.", "useForm({ resolver: zodResolver(schema) }) liga as regras ao formulário.", "register(\"email\") conecta cada input. formState.errors traz os erros.", "handleSubmit(onSubmit) só chama sua função quando tudo está válido."], "e": ["Fazer formulário grande só com useState vira um monte de estados e ifs. O React Hook Form é um assistente que cuida dos campos, e o Zod é a lista de regras (\"e-mail precisa ter @, senha 8 letras\"). Você descreve as regras uma vez, liga os dois, e recebe os erros prontos para mostrar ao lado de cada campo."], "l": [], "g": [], "q": [], "c": "const schema = z.object({\n  email: z.string().email(\"E-mail inválido\"),\n  senha: z.string().min(8, \"Mínimo de 8 caracteres\"),\n});\ntype Login = z.infer<typeof schema>;\n\nfunction FormLogin() {\n  const { register, handleSubmit, formState: { errors, isSubmitting } } =\n    useForm<Login>({ resolver: zodResolver(schema) });\n  return (\n    <form onSubmit={handleSubmit(async (d) => await entrar(d))}>\n      <input {...register(\"email\")} aria-invalid={!!errors.email} />\n      {errors.email && <p role=\"alert\">{errors.email.message}<\/p>}\n      <button disabled={isSubmitting}>Entrar<\/button>\n    <\/form>\n  );\n}", "u": "Qualquer formulário com mais de 2 campos ou com regras de validação.", "x": "Validar só no envio e mostrar todos os erros de uma vez num alerta genérico."}, "11-0": {"s": ["Cada classe é uma regra: flex, gap-4, rounded-xl, shadow.", "Prefixos aplicam em condições: md: só em tela média para cima, hover: ao passar o mouse, dark: no tema escuro.", "O Tailwind lê seus arquivos e gera só o CSS das classes que você usou.", "Para não repetir, extraia um componente React (Botao), não uma classe gigante."], "e": ["No CSS tradicional você cria uma classe para cada coisa e vai para outro arquivo escrever as regras. Com Tailwind você tem uma caixa de carimbos prontos: cada classe faz uma coisa pequena (p-4 dá espaçamento, text-lg aumenta a fonte, bg-teal-600 pinta o fundo). Você carimba direto no elemento e vê o resultado na hora. Todo o time usa os mesmos carimbos, então o visual fica padronizado."], "l": [], "g": [], "q": [], "c": "function Card({ titulo, preco }: { titulo: string; preco: number }) {\n  return (\n    <article className=\"flex flex-col gap-2 rounded-xl border p-4\n                        hover:shadow-md md:flex-row md:items-center\n                        dark:bg-slate-800\">\n      <h3 className=\"text-lg font-semibold\">{titulo}<\/h3>\n      <p className=\"text-teal-700 dark:text-teal-300\">R$ {preco}<\/p>\n    <\/article>\n  );\n}", "u": "Projetos React e Next.js. É o padrão mais comum nas vagas de front hoje.", "x": "Copiar listas enormes de classes de exemplos sem entender o que cada uma faz."}, "11-1": {"s": ["useQuery({ queryKey, queryFn }): a queryKey é o nome da prateleira no cache, a queryFn é como buscar.", "Se outra tela pedir a mesma queryKey, ela recebe do cache na hora.", "useMutation cria, edita ou apaga dados no servidor.", "Depois de uma mutação, invalidateQueries avisa: \"esse leite venceu, busque de novo\"."], "e": ["Dados que vêm do servidor são como leite na geladeira: você comprou, mas ele vence. O TanStack Query é um assistente que vai ao mercado buscar, guarda na geladeira (cache), anota quando comprou, avisa quando venceu e compra de novo sozinho. Você só pede \"quero os clientes\" e recebe os dados, se está carregando e se deu erro."], "l": [], "g": [], "q": [], "c": "function Transacoes({ mes }: { mes: string }) {\n  const qc = useQueryClient();\n  const { data, isPending, error } = useQuery({\n    queryKey: [\"transacoes\", mes],\n    queryFn: () => fetch(`/api/transacoes?mes=${mes}`).then(r => r.json()),\n  });\n  const criar = useMutation({\n    mutationFn: (nova: Nova) => api.post(\"/transacoes\", nova),\n    onSuccess: () => qc.invalidateQueries({ queryKey: [\"transacoes\"] }),\n  });\n  if (isPending) return <p>Carregando...<\/p>;\n  if (error) return <p>Erro ao carregar<\/p>;\n  return <Lista itens={data} />;\n}", "u": "Sempre que o app busca dados de uma API. Substitui useEffect com fetch na mão.", "x": "Copiar os dados do useQuery para um useState. Agora você tem duas verdades que se desencontram."}, "11-2": {"s": ["Local (useState): abrir modal, texto de um input.", "Levantar estado: dois componentes irmãos precisam do mesmo valor, então ele sobe para o pai comum.", "Global (Zustand ou Context): carrinho, usuário logado, tema.", "URL (search params): filtros, página atual, aba. Dá para mandar o link e abrir igual."], "e": ["Pense na casa: você guarda a escova de dentes no banheiro, não no sótão. Estado também deve ficar o mais perto possível de quem usa. Se só um componente usa, fica nele. Se dois irmãos usam, sobe para o pai. Se o app inteiro usa, vai para um lugar global (Context ou Zustand). Dados do servidor ficam com o TanStack Query. Filtros que a pessoa quer compartilhar ficam na URL."], "l": [], "g": [], "q": [], "c": "import { create } from \"zustand\";\nimport { persist } from \"zustand/middleware\";\n\ntype Carrinho = { itens: Item[]; adicionar: (i: Item) => void };\n\nexport const useCarrinho = create<Carrinho>()(persist(\n  (set) => ({\n    itens: [],\n    adicionar: (i) => set((s) => ({ itens: [...s.itens, i] })),\n  }),\n  { name: \"carrinho\" }\n));\n// em qualquer componente:\nconst qtd = useCarrinho((s) => s.itens.length);", "u": "Sempre que for criar um estado, pergunte: quem precisa dele? Coloque no menor lugar possível.", "x": "Instalar Redux ou Zustand no primeiro dia para guardar tudo. Complexidade sem necessidade."}, "11-3": {"s": ["Meça: React DevTools > Profiler > grave uma interação e veja quem demorou.", "React.memo(Componente) pula o redesenho se as props não mudaram.", "useMemo(() => contaCara(dados), [dados]) guarda o resultado até os dados mudarem.", "lazy(() => import(\"./Relatorios\")) baixa o código da tela só quando precisar."], "e": ["Otimizar sem medir é como trocar o motor do carro quando o problema era o pneu furado. Primeiro você mede com o Profiler e descobre qual componente está lento e por quê. Só depois aplica o remédio certo: memo para não redesenhar à toa, useMemo para não refazer conta cara, lazy para carregar uma tela só quando ela for aberta, virtualização para listas gigantes."], "l": [], "g": [], "q": [], "c": "const Relatorios = lazy(() => import(\"./Relatorios\"));\n\nconst LinhaProduto = memo(function LinhaProduto({ p }: { p: Produto }) {\n  return <li>{p.nome}<\/li>;\n});\n\nfunction Painel({ vendas }: { vendas: Venda[] }) {\n  const resumo = useMemo(() => calcularResumo(vendas), [vendas]);\n  return (\n    <Suspense fallback={<p>Carregando...<\/p>}>\n      <Relatorios resumo={resumo} />\n    <\/Suspense>\n  );\n}", "u": "Depois que o app funciona e você mediu algo lento. Nunca \"por garantia\".", "x": "Colocar useMemo e memo em tudo. Fica mais difícil de ler e às vezes mais lento."}, "12-0": {"s": ["Arrange: prepare os dados. Act: chame a função. Assert: confira o resultado com expect.", "describe agrupa testes de um assunto. it ou test é um caso específico.", "Rode com npx vitest. Em modo watch, ele roda de novo a cada vez que você salva.", "TDD: escreva o teste primeiro (vermelho), faça passar (verde), depois melhore o código (refatorar)."], "e": ["Teste automatizado é um robô que usa seu código do jeito que você combinou e confere se o resultado está certo, em segundos, quantas vezes você quiser. É o checklist do piloto antes de decolar. A pirâmide diz: muitos testes pequenos e rápidos (unitários), alguns que juntam peças (integração) e poucos que simulam o usuário inteiro (ponta a ponta)."], "l": [], "g": [], "q": [], "c": "// formatarMoeda.test.ts\nimport { describe, it, expect } from \"vitest\";\nimport { formatarMoeda } from \"./formatarMoeda\";\n\ndescribe(\"formatarMoeda\", () => {\n  it(\"formata em reais\", () => {\n    expect(formatarMoeda(1234.5)).toBe(\"R$ 1.234,50\");\n  });\n  it(\"recusa valor negativo\", () => {\n    expect(() => formatarMoeda(-1)).toThrow(\"Valor inválido\");\n  });\n});", "u": "Regras de negócio, cálculos, validações. Tudo que doeria se quebrasse em silêncio.", "x": "Testar detalhes internos em vez do resultado. Qualquer refatoração quebra o teste à toa."}, "12-1": {"s": ["render(<Componente />) desenha num navegador de mentira.", "screen.getByRole(\"button\", { name: \"Adicionar\" }) encontra como o usuário encontraria.", "userEvent.click e userEvent.type simulam a pessoa.", "findBy espera aparecer (coisas assíncronas). queryBy confere que algo NÃO está lá."], "e": ["A Testing Library testa seus componentes do jeito que uma pessoa usaria: procura o botão pelo texto que aparece, clica, digita e confere o que apareceu na tela. Ela não abre o motor para olhar o estado por dentro. Se o teste encontra o botão pelo nome, um leitor de tela também encontra, então você testa acessibilidade de brinde."], "l": [], "g": [], "q": [], "c": "import { render, screen } from \"@testing-library/react\";\nimport userEvent from \"@testing-library/user-event\";\n\nit(\"adiciona item ao carrinho\", async () => {\n  render(<Cardapio />);\n  await userEvent.click(screen.getByRole(\"button\", { name: /adicionar pizza/i }));\n  expect(screen.getByText(\"1 item no carrinho\")).toBeInTheDocument();\n});\n\nit(\"mostra erro de e-mail\", async () => {\n  render(<FormLogin />);\n  await userEvent.type(screen.getByLabelText(\"E-mail\"), \"abc\");\n  await userEvent.click(screen.getByRole(\"button\", { name: \"Entrar\" }));\n  expect(await screen.findByRole(\"alert\")).toHaveTextContent(\"E-mail inválido\");\n});", "u": "Fluxos importantes da tela: formulários, carrinho, filtros.", "x": "Buscar elementos por classe CSS ou id. Muda o estilo e o teste quebra sem o app ter quebrado."}, "12-2": {"s": ["vi.fn() cria uma função falsa que registra como foi chamada.", "vi.useFakeTimers() controla o relógio: avance 5 minutos em 1 milissegundo.", "MSW: você escreve handlers (\"quando pedirem GET /api/clientes, responda isto\").", "Em cada teste você pode trocar o handler para simular erro 500 e conferir a mensagem de erro."], "e": ["Num teste, você não quer depender da internet, de uma API lenta ou da hora certa. Mock é um dublê de cinema: ele entra no lugar da coisa perigosa ou imprevisível e faz exatamente o que você mandou. O MSW é um dublê de API: ele intercepta as chamadas fetch e responde com o que você combinou, inclusive erros, para você testar o que o app faz quando dá ruim."], "l": [], "g": [], "q": [], "c": "import { http, HttpResponse } from \"msw\";\nimport { setupServer } from \"msw/node\";\n\nconst server = setupServer(\n  http.get(\"/api/clientes\", () => HttpResponse.json([{ id: 1, nome: \"Ana\" }]))\n);\nbeforeAll(() => server.listen());\nafterAll(() => server.close());\n\nit(\"mostra erro quando a API cai\", async () => {\n  server.use(http.get(\"/api/clientes\", () => new HttpResponse(null, { status: 500 })));\n  render(<Clientes />);\n  expect(await screen.findByText(\"Erro ao carregar\")).toBeInTheDocument();\n});", "u": "Para testar carregando, erro e sucesso sem depender de servidor real.", "x": "Mockar tanto que o teste só confirma o próprio mock e não testa nada de verdade."}, "12-3": {"s": ["Escreva o roteiro: ir para a página, preencher, clicar, conferir.", "O Playwright espera os elementos aparecerem sozinho e tira print quando falha.", "Rode em vários tamanhos de tela, inclusive celular.", "No GitHub Actions, um arquivo .yml diz: a cada push, instale, rode lint, testes e Playwright."], "e": ["Teste de ponta a ponta (E2E) é o ensaio geral do teatro: tudo de verdade, palco, luz e figurino. O Playwright abre um navegador real, entra no seu site, clica, digita e confere, como um usuário robô. CI é colocar esse robô para rodar todos os testes sozinho a cada push no GitHub, e avisar com um X vermelho se algo quebrou."], "l": [], "g": [], "q": [], "c": "import { test, expect } from \"@playwright/test\";\n\ntest(\"cliente consegue agendar\", async ({ page }) => {\n  await page.goto(\"/\");\n  await page.getByRole(\"link\", { name: \"Corte de cabelo\" }).click();\n  await page.getByRole(\"button\", { name: \"14:00\" }).click();\n  await page.getByLabel(\"Nome\").fill(\"Ana\");\n  await page.getByRole(\"button\", { name: \"Confirmar\" }).click();\n  await expect(page.getByText(\"Agendamento confirmado\")).toBeVisible();\n});", "u": "Para os 1 a 3 fluxos mais importantes do produto (login, compra, agendamento).", "x": "Escrever E2E para tudo. Eles são lentos; detalhes ficam nos testes unitários."}, "13-0": {"s": ["node arquivo.js roda o código direto no terminal, sem navegador.", "package.json é a ficha do projeto: nome, dependências e scripts (\"dev\", \"test\").", "export function soma() em um arquivo, import { soma } from \"./soma.js\" no outro.", "process.env lê variáveis de ambiente (como senhas), que ficam num arquivo .env fora do Git."], "e": ["JavaScript nasceu para morar dentro do navegador. O Node.js tirou ele de lá e colocou no computador ou no servidor, como pegar o motor de um carro e colocar num barco. Agora o mesmo JavaScript lê arquivos, cria servidores e acessa bancos de dados. Módulos são gavetas: cada arquivo guarda uma parte do código e exporta o que os outros podem usar. O npm é a loja de peças prontas."], "l": [], "g": [], "q": [], "c": "// package.json -> \"type\": \"module\", \"scripts\": { \"dev\": \"node --watch src/index.js\" }\n\n// src/calculos.js\nexport function totalComTaxa(valor, taxa) {\n  return valor * (1 + taxa);\n}\n\n// src/index.js\nimport { totalComTaxa } from \"./calculos.js\";\nconst taxa = Number(process.env.TAXA ?? 0.1);\nconst [, , valor] = process.argv;          // node src/index.js 100\nconsole.log(totalComTaxa(Number(valor), taxa));", "u": "Back-end, scripts de automação, ferramentas de linha de comando e build do front.", "x": "Commitar o arquivo .env com senhas. Coloque no .gitignore desde o primeiro dia."}, "13-1": {"s": ["fs/promises com await readFile e writeFile: para arquivos pequenos.", "path.join monta caminhos certos no Windows, Mac e Linux.", "createReadStream lê em pedaços. readline transforma esses pedaços em linhas.", "Erros comuns de arquivo têm código: ENOENT (não existe), EACCES (sem permissão)."], "e": ["Ler um arquivo pequeno de uma vez é como virar um copo de água. Mas um arquivo de 2GB é uma piscina: se tentar beber de uma vez, você engasga (a memória estoura). Stream é beber de canudinho: os dados chegam em pedacinhos, você processa cada um e descarta, sem nunca carregar tudo. O módulo fs é a mão do Node que abre, lê e escreve arquivos."], "l": [], "g": [], "q": [], "c": "import { readFile, writeFile } from \"node:fs/promises\";\nimport { createReadStream } from \"node:fs\";\nimport readline from \"node:readline\";\nimport path from \"node:path\";\n\nconst caminho = path.join(\"dados\", \"clientes.json\");\nconst clientes = JSON.parse(await readFile(caminho, \"utf8\"));\nawait writeFile(\"saida.json\", JSON.stringify(clientes, null, 2));\n\nlet linhas = 0;\nconst rl = readline.createInterface({ input: createReadStream(\"grande.csv\") });\nfor await (const _linha of rl) linhas++;\nconsole.log(linhas);", "u": "Importar planilhas, gerar relatórios, processar logs e uploads.", "x": "Usar readFileSync dentro de um servidor. Ele trava todas as requisições enquanto lê."}, "13-2": {"s": ["Código síncrono (laços, contas) roda direto na pilha. Enquanto roda, nada mais acontece.", "Operações de I/O (arquivo, rede, banco) são entregues ao sistema; o Node segue em frente.", "Quando a operação termina, o callback entra numa fila. O event loop pega da fila quando a pilha esvazia.", "Para cálculos pesados, use worker_threads (outro garçom) ou outro serviço."], "e": ["O Node tem um garçom só (uma thread principal). Parece pouco, mas ele é esperto: anota o pedido da mesa 1, manda para a cozinha (banco, arquivo, rede) e vai atender a mesa 2 sem ficar parado esperando. Quando a cozinha avisa que ficou pronto, ele entrega. Isso é o event loop. O problema é quando o próprio garçom resolve cozinhar algo demorado: aí todas as mesas ficam esperando."], "l": [], "g": [], "q": [], "c": "console.log(\"1 - início\");\nsetTimeout(() => console.log(\"4 - timer\"), 0);\nPromise.resolve().then(() => console.log(\"3 - promise (microtarefa)\"));\nprocess.nextTick(() => console.log(\"2 - nextTick\"));\nconsole.log(\"1b - fim do código síncrono\");\n\n// Isto TRAVA o servidor por segundos:\n// for (let i = 0; i < 5e9; i++) {}", "u": "Para entender por que Node é ótimo para APIs e por que não fazer conta pesada na requisição.", "x": "Fazer um laço gigante ou bcrypt síncrono dentro da rota. Todos os usuários esperam."}, "13-3": {"s": ["http.createServer recebe uma função (req, res) que roda a cada pedido.", "req.method e req.url dizem o que foi pedido. Você decide a rota com if.", "O corpo do POST chega em pedaços (stream); você junta e faz JSON.parse.", "res.writeHead(status, headers) e res.end(corpo) mandam a resposta."], "e": ["Um servidor é um programa que fica de plantão numa porta (como a 3000), esperando pedidos. Quando chega um, ele olha o método e o endereço, decide o que fazer e devolve uma resposta. Fazer isso na mão com o módulo http, sem framework, é como cozinhar arroz na panela comum: dá mais trabalho, mas você entende de verdade o que a panela elétrica (Express, Fastify) faz por você."], "l": [], "g": [], "q": [], "c": "import http from \"node:http\";\nconst tarefas = [];\n\nhttp.createServer(async (req, res) => {\n  const json = (s, d) => { res.writeHead(s, { \"Content-Type\": \"application/json\" }); res.end(JSON.stringify(d)); };\n\n  if (req.method === \"GET\" && req.url === \"/tarefas\") return json(200, tarefas);\n  if (req.method === \"POST\" && req.url === \"/tarefas\") {\n    let corpo = \"\";\n    for await (const pedaco of req) corpo += pedaco;\n    const nova = { id: tarefas.length + 1, ...JSON.parse(corpo) };\n    tarefas.push(nova);\n    return json(201, nova);\n  }\n  json(404, { message: \"Rota não encontrada\" });\n}).listen(3000);", "u": "Uma vez, para aprender. No dia a dia, use um framework.", "x": "Esquecer de chamar res.end. A requisição fica pendurada até dar timeout."}, "14-0": {"s": ["Crie o app e registre rotas com o verbo: app.get, app.post, app.patch, app.delete.", "req.params pega pedaços da URL (/tarefas/:id). req.query pega o que vem depois do ? (?status=aberta).", "req.body traz o JSON enviado (com o middleware de JSON ligado).", "Organize em pastas: routes (URLs), controllers (recebem e respondem), services (regras)."], "e": ["O framework (Express ou Fastify) é a panela elétrica do servidor. Em vez de escrever ifs para cada URL, você registra rotas: \"quando chegar GET em /tarefas, chame esta função\". Ele já lê o corpo em JSON, separa os parâmetros e ajuda a responder. Você foca na regra do negócio, não no encanamento."], "l": [], "g": [], "q": [], "c": "import express from \"express\";\nconst app = express();\napp.use(express.json());\n\nlet tarefas = [{ id: 1, titulo: \"Estudar\", status: \"aberta\" }];\n\napp.get(\"/v1/tarefas\", (req, res) => {\n  const { status } = req.query;\n  res.json(status ? tarefas.filter(t => t.status === status) : tarefas);\n});\napp.post(\"/v1/tarefas\", (req, res) => {\n  const nova = { id: Date.now(), status: \"aberta\", ...req.body };\n  tarefas.push(nova);\n  res.status(201).json(nova);\n});\napp.delete(\"/v1/tarefas/:id\", (req, res) => {\n  tarefas = tarefas.filter(t => t.id !== Number(req.params.id));\n  res.status(204).end();\n});\napp.listen(3333);", "u": "Toda API REST em Node.", "x": "Colocar toda a lógica dentro da rota. Ela cresce até virar uma função de 200 linhas."}, "14-1": {"s": ["app.use(fn) registra um middleware que roda em todos os pedidos, na ordem em que foi registrado.", "Um middleware recebe (req, res, next). Chamar next() passa adiante; responder encerra.", "Lance erros com uma classe própria (AppError) que carrega status e mensagem.", "O middleware de erro tem 4 parâmetros (err, req, res, next) e fica por último."], "e": ["Middleware é um posto de controle no caminho do pedido, como no aeroporto: primeiro o raio-x, depois o passaporte, depois o portão. Cada posto olha o pedido, pode anotar algo (log), barrar (não está logado) ou deixar passar chamando next(). O tratador de erros é o último posto: qualquer problema no caminho cai nele, que responde de um jeito padronizado."], "l": [], "g": [], "q": [], "c": "class AppError extends Error {\n  constructor(message, public status = 400, public code = \"BAD_REQUEST\") { super(message); }\n}\n\napp.use((req, res, next) => {\n  const inicio = Date.now();\n  res.on(\"finish\", () => console.log(req.method, req.url, res.statusCode, Date.now() - inicio + \"ms\"));\n  next();\n});\n\napp.get(\"/v1/tarefas/:id\", (req, res) => {\n  const t = tarefas.find(t => t.id === Number(req.params.id));\n  if (!t) throw new AppError(\"Tarefa não encontrada\", 404, \"NOT_FOUND\");\n  res.json(t);\n});\n\napp.use((err, req, res, next) => {\n  const status = err instanceof AppError ? err.status : 500;\n  res.status(status).json({ message: status === 500 ? \"Erro interno\" : err.message, code: err.code });\n});", "u": "Log, autenticação, validação, CORS e tratamento de erro central.", "x": "Mostrar o erro interno (stack, SQL) para o cliente no 500. Isso vaza detalhes para atacantes."}, "14-2": {"s": ["Crie um schema por entrada: criar, atualizar, params, query.", "Um middleware validate(schema) roda safeParse no req.body.", "Se falhar, responde 400 com a lista de problemas (campo e mensagem).", "z.coerce.number() converte texto da URL (\"10\") em número."], "e": ["Tudo que chega do cliente pode estar errado, incompleto ou ser um ataque. O Zod é a balança do aeroporto: confere se a mala está no padrão antes de embarcar. Se não estiver, devolve 400 dizendo exatamente o que está errado. Se estiver, entrega os dados limpos e já tipados para o resto do código."], "l": [], "g": [], "q": [], "c": "const CriarTarefa = z.object({\n  titulo: z.string().min(3, \"Título muito curto\"),\n  prazo: z.coerce.date().optional(),\n});\nconst ListarQuery = z.object({\n  limit: z.coerce.number().int().min(1).max(100).default(20),\n});\n\nconst validate = (schema, onde = \"body\") => (req, res, next) => {\n  const r = schema.safeParse(req[onde]);\n  if (!r.success) return res.status(400).json({\n    message: \"Dados inválidos\",\n    erros: r.error.issues.map(i => ({ campo: i.path.join(\".\"), msg: i.message })),\n  });\n  req[onde] = r.data;\n  next();\n};\napp.post(\"/v1/tarefas\", validate(CriarTarefa), criarTarefaController);", "u": "Em toda rota que recebe dados: body, params e query.", "x": "Validar só no front e confiar no que chega. Qualquer pessoa manda requisição direto pela API."}, "14-3": {"s": ["Recursos no plural: /clientes, /clientes/7/processos. Nada de /getClientes.", "Listas devolvem pedaços: { dados, total, limit, offset } ou um cursor para a próxima página.", "Filtro e ordenação pela query: ?status=ativo&ordenar=-criadoEm.", "PUT troca o recurso inteiro, PATCH muda só alguns campos. Repetir um PUT dá o mesmo resultado (idempotente)."], "e": ["Uma API boa é como placa de aeroporto: quem nunca esteve lá entende para onde ir. Isso vem de combinados que todo dev conhece. URLs no plural com substantivos, verbos HTTP certos, status certos, listas paginadas e filtráveis. Quem consome sua API (inclusive você no front) agradece."], "l": [], "g": [], "q": [], "c": "GET  /v1/clientes?cidade=Maceió&limit=20&offset=40\n200 {\n  \"dados\": [ ... 20 clientes ... ],\n  \"total\": 134,\n  \"limit\": 20,\n  \"offset\": 40\n}\n\nGET  /v1/clientes?limit=20&cursor=eyJpZCI6NDB9\n200 { \"dados\": [...], \"proximoCursor\": \"eyJpZCI6NjB9\" }\n\nPATCH /v1/clientes/7  { \"telefone\": \"82999990000\" }  -> 200", "u": "Ao desenhar qualquer API. Desenhe as rotas no papel antes de codar.", "x": "Devolver lista sem limite. Funciona com 10 registros e derruba o servidor com 100 mil."}, "15-0": {"s": ["Liste os \"substantivos\" do negócio: cada um tende a virar uma tabela.", "Defina as relações: 1:N (um cliente tem vários processos), N:N (processos e advogados, com uma tabela no meio).", "Normalize: não repita informação. O nome do cliente fica só na tabela de clientes.", "Use restrições: NOT NULL (obrigatório), UNIQUE (sem repetir), CHECK (regra, como valor maior que zero)."], "e": ["Banco de dados relacional é um conjunto de planilhas que conversam. Cada planilha (tabela) guarda um tipo de coisa: clientes, processos, prazos. Cada linha tem um número único (chave primária). Para ligar um processo ao seu cliente, a planilha de processos guarda o número do cliente (chave estrangeira). Modelar é decidir quais planilhas existem e como elas se ligam, antes de escrever código."], "l": [], "g": [], "q": [], "c": "clientes            processos                 prazos\n---------           -----------               --------\nid  (PK)            id  (PK)                  id  (PK)\nnome                numero (UNIQUE)           processo_id (FK -> processos.id)\ncpf (UNIQUE)        cliente_id (FK)           descricao\n                    area ('civel'|'trab')     data_limite\n                                              concluido (default false)\n\nprocesso_advogado (N:N)\nprocesso_id (FK) + advogado_id (FK)  -> PK composta", "u": "Antes de criar qualquer tabela. Desenhe no dbdiagram.io.", "x": "Guardar listas dentro de uma coluna (\"1,4,7\"). Não dá para buscar, ligar nem validar."}, "15-1": {"s": ["SELECT colunas FROM tabela: o que trazer e de onde.", "WHERE filtra as linhas. ORDER BY ordena. LIMIT corta a quantidade.", "INSERT INTO cria linhas. UPDATE ... SET ... WHERE muda. DELETE FROM ... WHERE apaga.", "ILIKE '%silva%' busca texto sem ligar para maiúsculas."], "e": ["SQL é a língua para conversar com o banco. Você não diz COMO buscar; você descreve O QUE quer, como um pedido bem específico no balcão: \"me dá o nome e a cidade dos clientes de Maceió, em ordem alfabética, só os 10 primeiros\". O banco decide o caminho mais rápido para entregar."], "l": [], "g": [], "q": [], "c": "CREATE TABLE clientes (\n  id SERIAL PRIMARY KEY,\n  nome TEXT NOT NULL,\n  cidade TEXT,\n  criado_em TIMESTAMPTZ DEFAULT now()\n);\n\nINSERT INTO clientes (nome, cidade) VALUES ('Ana Lima', 'Maceió');\n\nSELECT nome, cidade FROM clientes\nWHERE cidade = 'Maceió' AND nome ILIKE '%lima%'\nORDER BY nome\nLIMIT 10;\n\nUPDATE clientes SET cidade = 'Recife' WHERE id = 1;", "u": "Em quase toda vaga júnior. Treine até escrever SELECT sem pensar.", "x": "Rodar UPDATE ou DELETE sem WHERE. Altera ou apaga a tabela inteira."}, "15-2": {"s": ["INNER JOIN traz só as linhas que têm par nas duas tabelas.", "LEFT JOIN traz todas da esquerda, mesmo sem par (o lado sem par vem NULL). Ótimo para achar \"quem não tem\".", "GROUP BY agrupa. As funções de agregação calculam por grupo.", "HAVING filtra os grupos depois de calculados (WHERE filtra as linhas antes)."], "e": ["JOIN é juntar duas planilhas pela coluna que elas têm em comum, como juntar a lista de chamada com a lista de notas pelo número do aluno. GROUP BY é separar em montinhos (por cliente, por mês) e calcular algo em cada montinho: quantos (COUNT), soma (SUM), média (AVG). É assim que nascem os relatórios."], "l": [], "g": [], "q": [], "c": "-- faturamento por cliente, só quem passou de 1000\nSELECT c.nome, SUM(p.valor) AS total, COUNT(*) AS pedidos\nFROM pedidos p\nJOIN clientes c ON c.id = p.cliente_id\nWHERE p.criado_em >= '2026-01-01'\nGROUP BY c.nome\nHAVING SUM(p.valor) > 1000\nORDER BY total DESC;\n\n-- clientes que nunca compraram\nSELECT c.nome FROM clientes c\nLEFT JOIN pedidos p ON p.cliente_id = c.id\nWHERE p.id IS NULL;", "u": "Relatórios, dashboards e qualquer tela que mostra dados de mais de uma tabela.", "x": "Esquecer a condição do JOIN (ON). O banco cruza tudo com tudo e devolve milhões de linhas."}, "15-3": {"s": ["CREATE INDEX em colunas muito usadas no WHERE, JOIN e ORDER BY.", "EXPLAIN ANALYZE mostra o plano: Seq Scan (leu tudo) ou Index Scan (usou o índice).", "BEGIN abre a transação, COMMIT confirma tudo, ROLLBACK desfaz tudo.", "ACID: Atômica (tudo ou nada), Consistente (regras respeitadas), Isolada (uma não atrapalha a outra), Durável (confirmou, está salvo)."], "e": ["Índice é o índice remissivo no fim do livro: em vez de ler página por página procurando \"Maceió\", você olha o índice e vai direto à página. Transação é a transferência bancária: o dinheiro sai de uma conta e entra na outra. Se faltar luz no meio, não pode sumir dinheiro. Ou acontecem as duas coisas, ou nenhuma."], "l": [], "g": [], "q": [], "c": "CREATE INDEX idx_pedidos_cliente ON pedidos (cliente_id);\nEXPLAIN ANALYZE SELECT * FROM pedidos WHERE cliente_id = 42;\n\nBEGIN;\nUPDATE contas SET saldo = saldo - 100 WHERE id = 1;\nUPDATE contas SET saldo = saldo + 100 WHERE id = 2;\nCOMMIT;   -- se algo falhar antes: ROLLBACK;\n\nALTER TABLE contas ADD CONSTRAINT saldo_positivo CHECK (saldo >= 0);", "u": "Índice quando uma consulta frequente fica lenta. Transação sempre que duas ou mais escritas precisam andar juntas.", "x": "Criar índice em todas as colunas. Cada índice deixa INSERT e UPDATE mais lentos."}, "16-0": {"s": ["schema.prisma descreve os models (tabelas), campos e relações.", "npx prisma migrate dev cria um arquivo de migration com o SQL e aplica no banco.", "O Prisma gera o cliente tipado. Você importa PrismaClient e usa.", "prisma studio abre uma tela para ver e editar os dados; o seed preenche dados de exemplo."], "e": ["Escrever SQL na mão em todo lugar dá trabalho e erro de digitação. O Prisma é um tradutor: você descreve suas tabelas num arquivo (schema.prisma), ele cria o banco e gera um cliente TypeScript. Aí você escreve prisma.cliente.findMany() com autocompletar, e ele traduz para SQL. Se você errar o nome de um campo, o editor avisa antes de rodar."], "l": [], "g": [], "q": [], "c": "// prisma/schema.prisma\nmodel Cliente {\n  id        Int        @id @default(autoincrement())\n  nome      String\n  email     String     @unique\n  processos Processo[]\n}\nmodel Processo {\n  id        Int     @id @default(autoincrement())\n  numero    String  @unique\n  cliente   Cliente @relation(fields: [clienteId], references: [id])\n  clienteId Int\n}\n\n// src/db.ts\nimport { PrismaClient } from \"@prisma/client\";\nexport const prisma = new PrismaClient();", "u": "APIs Node com TypeScript que usam banco relacional.", "x": "Mudar o banco direto no painel e esquecer o schema. O código e o banco ficam diferentes."}, "16-1": {"s": ["create, findMany, findUnique, update e delete fazem o CRUD.", "where filtra, orderBy ordena, skip e take paginam.", "include traz relações. select escolhe campos.", "Problema N+1: buscar 50 clientes e depois fazer 1 consulta para cada um. Resolve com include."], "e": ["Com o Prisma, criar, ler, atualizar e apagar viram métodos com nome claro. Para trazer coisas relacionadas, você pede o combo: include traz o cliente junto com os processos dele numa bandeja só. select escolhe só os campos que você quer, como pedir o lanche sem cebola."], "l": [], "g": [], "q": [], "c": "const novo = await prisma.cliente.create({\n  data: { nome: \"Ana\", email: \"ana@x.com\",\n          processos: { create: [{ numero: \"0001\" }] } },\n});\n\nconst pagina = await prisma.cliente.findMany({\n  where: { nome: { contains: \"ana\", mode: \"insensitive\" } },\n  include: { processos: true },          // evita N+1\n  orderBy: { nome: \"asc\" },\n  skip: 20, take: 20,\n});\n\nawait prisma.cliente.update({ where: { id: 1 }, data: { nome: \"Ana Lima\" } });", "u": "Toda operação de banco na API.", "x": "Chamar o Prisma dentro de um laço para cada item. Busque tudo numa consulta só."}, "16-2": {"s": ["Mude o schema.prisma e rode npx prisma migrate dev --name descricao.", "O arquivo da migration vai para o Git. Em produção roda npx prisma migrate deploy.", "Renomear campo pode apagar dados: confira o SQL gerado antes de aplicar.", "prisma.$transaction(async (tx) => { ... }) agrupa operações; erro lá dentro desfaz tudo."], "e": ["Migration é o diário de reformas do banco. Cada mudança (nova coluna, nova tabela) vira um arquivo numerado com o SQL. Todo mundo do time, e o servidor de produção, aplica as mesmas reformas na mesma ordem. É como o Git, só que para a estrutura do banco. $transaction é a transferência bancária do Prisma: ou tudo acontece, ou nada."], "l": [], "g": [], "q": [], "c": "// npx prisma migrate dev --name adiciona_telefone\n\nawait prisma.$transaction(async (tx) => {\n  const origem = await tx.conta.update({\n    where: { id: 1 }, data: { saldo: { decrement: 100 } },\n  });\n  if (origem.saldo < 0) throw new Error(\"Saldo insuficiente\"); // desfaz tudo\n  await tx.conta.update({\n    where: { id: 2 }, data: { saldo: { increment: 100 } },\n  });\n});", "u": "Toda mudança de estrutura do banco, sempre com migration commitada.", "x": "Editar uma migration que já rodou em outro ambiente. Crie uma nova em vez de mexer na antiga."}, "16-3": {"s": ["Controller: lê req, chama o service, devolve res com o status certo. Não tem regra de negócio.", "Service: as regras (\"não pode agendar no passado\"). Não sabe nada de HTTP.", "Repository: conversa com o banco (Prisma). Não sabe de regras.", "O service recebe o repository pelo construtor, então nos testes você passa um falso, em memória."], "e": ["Num restaurante organizado, o garçom só anota e entrega (controller), o cozinheiro só cozinha seguindo as regras da casa (service) e o estoquista só busca e guarda ingredientes (repository). Ninguém faz o trabalho do outro. Se você trocar o fornecedor (o banco), só o estoquista muda. E para testar o cozinheiro, você dá a ele um estoque de mentira."], "l": [], "g": [], "q": [], "c": "// repository\nclass AgendamentoRepo {\n  conflito(inicio: Date) { return prisma.agendamento.findFirst({ where: { inicio } }); }\n  criar(d: NovoAgendamento) { return prisma.agendamento.create({ data: d }); }\n}\n// service\nclass AgendarService {\n  constructor(private repo: AgendamentoRepo) {}\n  async executar(d: NovoAgendamento) {\n    if (d.inicio < new Date()) throw new AppError(\"Data no passado\");\n    if (await this.repo.conflito(d.inicio)) throw new AppError(\"Horário ocupado\", 409);\n    return this.repo.criar(d);\n  }\n}\n// controller\nconst service = new AgendarService(new AgendamentoRepo());\napp.post(\"/v1/agendamentos\", async (req, res) => res.status(201).json(await service.executar(req.body)));", "u": "Em APIs que vão crescer e precisam de testes. É o padrão que você vai ver em empresas.", "x": "Colocar regra de negócio no controller ou SQL no service. As camadas perdem o sentido."}, "17-0": {"s": ["No cadastro: hash = await bcrypt.hash(senha, 12). Guarde só o hash.", "No login: busque o usuário pelo e-mail e rode bcrypt.compare(senhaDigitada, hash).", "O número 12 é o custo: quanto maior, mais lento para quem tenta adivinhar.", "Mensagem de erro sempre genérica: \"e-mail ou senha inválidos\", sem dizer qual errou."], "e": ["Guardar a senha do usuário como texto é como deixar a chave da casa debaixo do tapete: se alguém invadir o banco, leva todas. Hash é passar a senha num moedor: sai uma papa que não volta a ser senha. No login, você mói a senha digitada e compara as duas papas. O salt é um tempero aleatório diferente para cada usuário, para que senhas iguais não fiquem com a mesma papa."], "l": [], "g": [], "q": [], "c": "import bcrypt from \"bcrypt\";\n\nasync function cadastrar(email: string, senha: string) {\n  const senhaHash = await bcrypt.hash(senha, 12);\n  return prisma.usuario.create({ data: { email, senhaHash } });\n}\n\nasync function login(email: string, senha: string) {\n  const u = await prisma.usuario.findUnique({ where: { email } });\n  const ok = u && await bcrypt.compare(senha, u.senhaHash);\n  if (!ok) throw new AppError(\"E-mail ou senha inválidos\", 401);\n  return u;\n}", "u": "Sempre que o sistema tiver senha. Sem exceção.", "x": "Usar MD5 ou SHA-256 puro. São rápidos demais e quebram com força bruta em minutos."}, "17-1": {"s": ["Login certo: o servidor gera um token com jwt.sign({ sub: id }, segredo, { expiresIn: \"15m\" }).", "O token vai num cookie httpOnly, secure e sameSite. O JavaScript da página não acessa.", "A cada pedido, um middleware lê o cookie, roda jwt.verify e coloca o usuário em req.", "Refresh token, mais longo e guardado no banco, gera um token curto novo sem pedir senha de novo."], "e": ["Depois do login, o servidor precisa lembrar quem você é a cada pedido. O JWT é a pulseira do show: o servidor carimba (assina) a pulseira com seus dados e a data de validade. A cada pedido você mostra a pulseira, e ele confere o carimbo sem precisar consultar nada. Se alguém roubar a pulseira, entra no seu lugar, por isso ela vence rápido e fica num cookie que o JavaScript da página não consegue ler."], "l": [], "g": [], "q": [], "c": "import jwt from \"jsonwebtoken\";\n\napp.post(\"/v1/login\", async (req, res) => {\n  const u = await login(req.body.email, req.body.senha);\n  const token = jwt.sign({ sub: u.id, role: u.role }, process.env.JWT_SECRET!, { expiresIn: \"15m\" });\n  res.cookie(\"token\", token, { httpOnly: true, secure: true, sameSite: \"lax\" });\n  res.status(204).end();\n});\n\nfunction autenticar(req, res, next) {\n  try {\n    req.user = jwt.verify(req.cookies.token, process.env.JWT_SECRET!);\n    next();\n  } catch { res.status(401).json({ message: \"Faça login\" }); }\n}", "u": "APIs que atendem front separado ou app mobile.", "x": "Guardar o token no localStorage. Qualquer script injetado na página consegue ler e roubar."}, "17-2": {"s": ["Papéis (role: admin, advogado, cliente) dizem o que cada tipo pode fazer.", "Um middleware requireRole(\"admin\") barra quem não tem o papel.", "Dono do recurso: sempre busque com where: { id, donoId: req.user.sub }.", "401 = não sei quem você é (faça login). 403 = sei quem você é, mas você não pode."], "e": ["Autenticar é o porteiro conferir quem você é. Autorizar é decidir aonde você pode ir. Todo funcionário entra no prédio, mas só o pessoal de TI entra na sala dos servidores, e você só abre a sua própria gaveta. A falha mais comum em APIs (IDOR) é a gaveta sem tranca: trocar /processos/10 por /processos/11 na URL e ver o processo de outro cliente."], "l": [], "g": [], "q": [], "c": "const requireRole = (...roles: string[]) => (req, res, next) =>\n  roles.includes(req.user.role) ? next() : res.status(403).json({ message: \"Sem permissão\" });\n\napp.delete(\"/v1/usuarios/:id\", autenticar, requireRole(\"admin\"), apagarUsuario);\n\napp.get(\"/v1/processos/:id\", autenticar, async (req, res) => {\n  const p = await prisma.processo.findFirst({\n    where: { id: Number(req.params.id), advogadoId: req.user.sub }, // só o dono\n  });\n  if (!p) return res.status(404).json({ message: \"Processo não encontrado\" });\n  res.json(p);\n});", "u": "Em toda rota que mexe com dados de alguém.", "x": "Esconder o botão no front e achar que está protegido. A API precisa barrar sozinha."}, "17-3": {"s": ["Injeção (SQL injection): nunca concatene texto do usuário no SQL. O Prisma e as queries parametrizadas já protegem.", "XSS: nunca coloque texto do usuário como HTML (innerHTML, dangerouslySetInnerHTML).", "Força bruta: rate limit no login (ex: 5 tentativas por minuto por IP).", "Configuração: Helmet adiciona cabeçalhos de segurança, CORS só para o seu domínio e segredos fora do Git."], "e": ["OWASP Top 10 é a lista das janelas que os ladrões mais encontram abertas em sistemas web. A boa notícia: a maioria se fecha com hábitos simples. Validar toda entrada, nunca montar SQL juntando texto, escapar o que vai para a tela, limitar tentativas de login, não vazar segredos e manter dependências atualizadas."], "l": [], "g": [], "q": [], "c": "// PERIGO: ' OR 1=1 -- vira parte do comando\ndb.query(`SELECT * FROM usuarios WHERE email = '${email}'`);\n// seguro: o valor vai separado do comando\ndb.query(\"SELECT * FROM usuarios WHERE email = $1\", [email]);\n\nimport helmet from \"helmet\";\nimport rateLimit from \"express-rate-limit\";\napp.use(helmet());\napp.use(cors({ origin: \"https://meuapp.com.br\", credentials: true }));\napp.use(\"/v1/login\", rateLimit({ windowMs: 60_000, limit: 5 }));", "u": "Em todo projeto que vai para a internet. Monte um checklist e passe antes de cada deploy.", "x": "Achar que \"ninguém vai atacar um projeto pequeno\". Robôs varrem a internet atrás de qualquer porta aberta."}, "18-0": {"s": ["Crie um repositório falso que implementa a mesma interface, guardando dados num array.", "Monte o cenário: um agendamento já existe às 14h.", "Chame o service e confira: deve lançar \"Horário ocupado\".", "it.each roda o mesmo teste com vários casos (passado, ocupado, fora do expediente)."], "e": ["Testar o service sem banco é como testar uma receita na cozinha de casa antes de abrir o restaurante. Você troca o estoque de verdade (banco) por um estoque de brinquedo (repositório em memória), coloca exatamente os ingredientes da situação que quer testar e confere se a regra funciona. Fica rápido, previsível e não suja nenhum banco."], "l": [], "g": [], "q": [], "c": "class RepoMemoria {\n  itens: Agendamento[] = [];\n  async conflito(inicio: Date) { return this.itens.find(a => +a.inicio === +inicio) ?? null; }\n  async criar(d) { const a = { id: 1, ...d }; this.itens.push(a); return a; }\n}\n\nit(\"não deixa agendar em horário ocupado\", async () => {\n  const repo = new RepoMemoria();\n  const amanha14h = new Date(Date.now() + 86_400_000);\n  repo.itens.push({ id: 9, inicio: amanha14h });\n  const service = new AgendarService(repo);\n  await expect(service.executar({ inicio: amanha14h })).rejects.toThrow(\"Horário ocupado\");\n});", "u": "Para cada regra de negócio do service. São os testes mais baratos e úteis.", "x": "Testar o service com o banco real. Fica lento e os testes interferem uns nos outros."}, "18-1": {"s": ["Suba um Postgres de teste com Docker e aponte a DATABASE_URL de teste para ele.", "Antes de cada teste, limpe as tabelas para começar do zero.", "supertest(app).post(\"/v1/...\").send(dados) faz a requisição sem subir servidor numa porta.", "Confira o status, o corpo e, se precisar, o que foi gravado no banco."], "e": ["O teste de integração testa o carro inteiro numa pista fechada: a requisição HTTP entra de verdade, passa por middleware, validação, service e chega num banco de verdade (só que de teste, num Docker). Ele pega erros que os testes unitários não veem: rota errada, validação faltando, SQL quebrado, status errado."], "l": [], "g": [], "q": [], "c": "import request from \"supertest\";\nimport { app } from \"../src/app\";\n\nbeforeEach(async () => { await prisma.agendamento.deleteMany(); });\n\nit(\"cria agendamento e devolve 201\", async () => {\n  const res = await request(app).post(\"/v1/agendamentos\")\n    .set(\"Cookie\", await loginComo(\"admin\"))\n    .send({ servicoId: 1, inicio: \"2026-12-01T14:00:00Z\" });\n  expect(res.status).toBe(201);\n  expect(await prisma.agendamento.count()).toBe(1);\n});\n\nit(\"recusa dados inválidos com 400\", async () => {\n  const res = await request(app).post(\"/v1/agendamentos\").send({});\n  expect(res.status).toBe(400);\n});", "u": "Para as rotas principais: criar, listar, erros de validação e permissão.", "x": "Usar o banco de desenvolvimento nos testes. Um deleteMany apaga seus dados de trabalho."}, "18-2": {"s": ["Descreva cada rota: método, caminho, corpo esperado, respostas por status.", "Gere a documentação a partir dos schemas Zod, assim ela nunca fica desatualizada.", "Sirva a página interativa em /docs com swagger-ui.", "Inclua exemplos reais e explique como autenticar."], "e": ["OpenAPI (Swagger) é o manual de instruções da sua API. Ele lista cada endpoint, o que precisa mandar, o que volta e os erros possíveis, e ainda gera uma página onde a pessoa testa clicando, sem instalar nada. É o que permite outro dev (ou o recrutador) usar sua API sem precisar te perguntar nada."], "l": [], "g": [], "q": [], "c": "import { OpenAPIRegistry, OpenApiGeneratorV31 } from \"@asteasolutions/zod-to-openapi\";\n\nconst registry = new OpenAPIRegistry();\nregistry.registerPath({\n  method: \"post\",\n  path: \"/v1/agendamentos\",\n  summary: \"Cria um agendamento\",\n  request: { body: { content: { \"application/json\": { schema: CriarAgendamento } } } },\n  responses: {\n    201: { description: \"Criado\", content: { \"application/json\": { schema: Agendamento } } },\n    409: { description: \"Horário ocupado\" },\n  },\n});\nconst doc = new OpenApiGeneratorV31(registry.definitions).generateDocument({\n  openapi: \"3.1.0\", info: { title: \"API de Agendamentos\", version: \"1.0.0\" },\n});\napp.use(\"/docs\", swaggerUi.serve, swaggerUi.setup(doc));", "u": "Em toda API do portfólio. Recrutador abre o /docs e entende o projeto em 1 minuto.", "x": "Documentar à mão num README e esquecer de atualizar. A doc mente."}, "18-3": {"s": ["Use um logger estruturado (Pino): cada linha é um JSON com nível, mensagem e contexto.", "Níveis: debug (detalhe), info (aconteceu), warn (estranho), error (quebrou).", "request-id: um código único por pedido, presente em todos os logs dele, para seguir o rastro.", "/health responde se a API e o banco estão vivos; um monitor externo chama a cada minuto."], "e": ["Quando o app está no ar, você não está olhando a tela de ninguém. Logs são o diário de bordo: cada pedido e cada erro anotado com hora e detalhes. Observabilidade é ter a caixa-preta do avião: quando algo cai, você descobre o que aconteceu, com quem e em qual linha. O Sentry é um alarme que avisa no seu e-mail quando um erro acontece."], "l": [], "g": [], "q": [], "c": "import pino from \"pino\";\nimport { randomUUID } from \"node:crypto\";\nconst logger = pino();\n\napp.use((req, res, next) => {\n  req.id = randomUUID();\n  req.log = logger.child({ reqId: req.id });\n  next();\n});\n\napp.get(\"/health\", async (req, res) => {\n  await prisma.$queryRaw`SELECT 1`;\n  res.json({ ok: true });\n});\n\nreq.log.info({ agendamentoId: a.id }, \"agendamento criado\");\nreq.log.error({ err }, \"falha ao enviar notificação\");", "u": "Em tudo que vai para produção, desde o primeiro deploy.", "x": "Logar senha, token ou dados pessoais. Log também vaza."}, "19-0": {"s": ["app/page.tsx é a página /. app/clientes/page.tsx é /clientes. app/clientes/[id]/page.tsx é /clientes/7.", "layout.tsx envolve as páginas de dentro (menu, rodapé) e não recarrega ao navegar.", "Por padrão, todo componente é de servidor: pode ser async e acessar o banco direto.", "\"use client\" no topo do arquivo transforma em componente de navegador (useState, onClick)."], "e": ["O Next.js junta front e back no mesmo projeto. No App Router, cada pasta dentro de app vira um endereço do site. A grande novidade são os Server Components: o prato é montado na cozinha (servidor), já busca os dados e chega pronto, rápido e bom para o Google. Os Client Components são o tempero na mesa: botões, formulários e tudo que reage ao clique roda no navegador."], "l": [], "g": [], "q": [], "c": "// app/clientes/[id]/page.tsx  (Server Component)\nimport { prisma } from \"@/lib/db\";\nimport { BotaoFavoritar } from \"./BotaoFavoritar\";\n\nexport default async function Page({ params }: { params: Promise<{ id: string }> }) {\n  const { id } = await params;\n  const cliente = await prisma.cliente.findUnique({ where: { id: Number(id) } });\n  if (!cliente) return <p>Cliente não encontrado<\/p>;\n  return <><h1>{cliente.nome}<\/h1><BotaoFavoritar id={cliente.id} /><\/>;\n}\n\n// app/clientes/[id]/BotaoFavoritar.tsx\n\"use client\";\nexport function BotaoFavoritar({ id }: { id: number }) {\n  const [fav, setFav] = useState(false);\n  return <button onClick={() => setFav(!fav)}>{fav ? \"★\" : \"☆\"}<\/button>;\n}", "u": "Produtos full stack em que você quer front, back e SEO num projeto só.", "x": "Colocar \"use client\" no topo de tudo. Você perde as vantagens do servidor."}, "19-1": {"s": ["Server Component busca dados com await (fetch ou Prisma).", "export const revalidate = 60 refaz a página no máximo a cada 60 segundos.", "Depois de mudar dados, revalidatePath(\"/agenda\") manda refazer aquela página.", "Suspense com loading.tsx mostra um esqueleto enquanto a parte lenta carrega (streaming)."], "e": ["No Next.js, buscar dados é só fazer await dentro do componente de servidor. A pergunta passa a ser: com que frequência esses dados mudam? Um cardápio pode ser feito uma vez e servido para todos (estático, como jornal impresso). Uma agenda precisa estar sempre atual (dinâmico). Revalidar é avisar: \"esse jornal ficou velho, imprima de novo\"."], "l": [], "g": [], "q": [], "c": "// app/cardapio/page.tsx\nexport const revalidate = 3600; // refaz no máximo 1x por hora\n\nexport default async function Cardapio() {\n  const itens = await prisma.item.findMany({ orderBy: { nome: \"asc\" } });\n  return <ul>{itens.map(i => <li key={i.id}>{i.nome}<\/li>)}<\/ul>;\n}\n\n// app/agenda/page.tsx\nexport default function Agenda() {\n  return (\n    <Suspense fallback={<p>Carregando horários...<\/p>}>\n      <ListaHorarios />  {/* componente async lento */}\n    <\/Suspense>\n  );\n}", "u": "Em toda página do Next.js: decida se é estática, revalidada de tempos em tempos ou dinâmica.", "x": "Não entender por que a página mostra dado velho. Quase sempre é cache sem revalidação."}, "19-2": {"s": ["Crie uma função async com \"use server\" que recebe o FormData.", "Valide com Zod, confira o usuário logado, grave no banco e chame revalidatePath.", "Ligue no form: <form action={criarAgendamento}>.", "Route Handler: app/api/webhook/route.ts exporta funções GET e POST."], "e": ["Server Action é um interfone direto do formulário para a cozinha. Em vez de criar uma rota de API, fazer fetch e tratar a resposta, você escreve uma função com \"use server\" e liga direto no form. Quando o usuário envia, a função roda no servidor, grava no banco e manda a página se atualizar. Route Handler é quando você quer uma rota de API de verdade, por exemplo para um webhook."], "l": [], "g": [], "q": [], "c": "// app/agenda/actions.ts\n\"use server\";\nexport async function criarAgendamento(prev: unknown, form: FormData) {\n  const sessao = await auth();\n  if (!sessao) return { erro: \"Faça login\" };\n  const r = Schema.safeParse(Object.fromEntries(form));\n  if (!r.success) return { erro: \"Dados inválidos\" };\n  await prisma.agendamento.create({ data: { ...r.data, userId: sessao.user.id } });\n  revalidatePath(\"/agenda\");\n  return { ok: true };\n}\n\n// no componente cliente:\nconst [estado, acao, pendente] = useActionState(criarAgendamento, null);\n<form action={acao}>... <button disabled={pendente}>Agendar<\/button><\/form>", "u": "Formulários e mutações dentro do próprio app Next.js. Route Handlers para integrações externas.", "x": "Esquecer que a Server Action é uma rota pública. Sempre valide e confira o usuário dentro dela."}, "19-3": {"s": ["Configure o provedor (GitHub, Google) com as chaves no .env.", "A biblioteca cria as rotas de login e logout e guarda a sessão num cookie seguro.", "No servidor, await auth() devolve a sessão (ou null).", "middleware.ts protege um grupo de rotas inteiro de uma vez (ex: tudo em /painel)."], "e": ["Fazer login na mão (semana 18) te ensinou como funciona por dentro. Em produto real, você usa uma biblioteca testada (Auth.js, Better Auth ou Clerk) que já resolve login com Google ou GitHub, sessões e segurança. O middleware é a portaria do condomínio: confere a sessão antes de deixar entrar em qualquer rota da área restrita."], "l": [], "g": [], "q": [], "c": "// auth.ts\nimport NextAuth from \"next-auth\";\nimport GitHub from \"next-auth/providers/github\";\nexport const { handlers, auth, signIn, signOut } = NextAuth({ providers: [GitHub] });\n\n// middleware.ts\nexport { auth as middleware } from \"@/auth\";\nexport const config = { matcher: [\"/painel/:path*\"] };\n\n// app/painel/page.tsx\nexport default async function Painel() {\n  const sessao = await auth();\n  const meus = await prisma.agendamento.findMany({ where: { userId: sessao!.user!.id } });\n  return <h1>Olá, {sessao!.user!.name}<\/h1>;\n}", "u": "Em projetos Next.js com área logada.", "x": "Proteger só a página e esquecer as Server Actions. Elas precisam conferir a sessão também."}, "20-0": {"s": ["Imagem é a caixa montada a partir da receita (Dockerfile). Contêiner é a caixa rodando.", "Cada linha do Dockerfile é uma camada: base (node), copiar arquivos, instalar, comando de iniciar.", "Build multi-stage: uma etapa compila, a outra leva só o resultado. A imagem final fica pequena.", "docker compose sobe vários contêineres juntos (API + banco) com um comando."], "e": ["Sabe quando o projeto funciona no seu computador e quebra no do colega? Docker resolve isso. Ele coloca seu app numa caixa fechada (contêiner) com tudo que ele precisa: a versão certa do Node, as bibliotecas e os arquivos. A receita da caixa é o Dockerfile. A caixa roda igual em qualquer máquina, como contêiner de navio que qualquer porto sabe carregar."], "l": [], "g": [], "q": [], "c": "# Dockerfile\nFROM node:22-alpine AS build\nWORKDIR /app\nCOPY package*.json ./\nRUN npm ci\nCOPY . .\nRUN npm run build\n\nFROM node:22-alpine\nWORKDIR /app\nCOPY --from=build /app/dist ./dist\nCOPY --from=build /app/node_modules ./node_modules\nCMD [\"node\", \"dist/server.js\"]\n\n# docker-compose.yml\nservices:\n  api: { build: ., ports: [\"3333:3333\"], env_file: .env, depends_on: [db] }\n  db:  { image: postgres:16, environment: { POSTGRES_PASSWORD: dev }, ports: [\"5432:5432\"] }", "u": "Para subir bancos no desenvolvimento e para empacotar a API para deploy.", "x": "Copiar node_modules e .env para dentro da imagem. Use .dockerignore."}, "20-1": {"s": ["Um arquivo .github/workflows/ci.yml descreve quando rodar (on: push) e os passos.", "Passos típicos: baixar o código, instalar o Node, npm ci, lint, testes e build.", "Segredos (chaves de deploy) ficam em Settings > Secrets, nunca no arquivo.", "Proteja a main: só aceita merge de PR com CI verde."], "e": ["CI/CD é uma linha de montagem com controle de qualidade automático. Toda vez que você manda código para o GitHub, um robô pega o código, instala tudo, roda lint e testes (CI = integração contínua). Se tudo passar e for a branch principal, ele mesmo publica no ar (CD = entrega contínua). Se algo falhar, a peça é barrada e você recebe um X vermelho, antes de chegar no cliente."], "l": [], "g": [], "q": [], "c": "name: CI\non: [push, pull_request]\njobs:\n  testar:\n    runs-on: ubuntu-latest\n    services:\n      postgres:\n        image: postgres:16\n        env: { POSTGRES_PASSWORD: test }\n        ports: [\"5432:5432\"]\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with: { node-version: 22, cache: npm }\n      - run: npm ci\n      - run: npm run lint\n      - run: npm test\n        env: { DATABASE_URL: \"postgresql://postgres:test@localhost:5432/postgres\" }", "u": "Em todo repositório do portfólio. O selo verde no README passa confiança.", "x": "Desativar o teste que falhou \"só para o deploy passar\"."}, "20-2": {"s": ["Conecte o repositório do GitHub ao serviço de hospedagem. Cada push na main faz deploy.", "Configure as variáveis de ambiente no painel do serviço (DATABASE_URL, JWT_SECRET).", "Rode as migrations do banco como parte do deploy (prisma migrate deploy).", "Se o deploy novo quebrar, volte para a versão anterior pelo painel (rollback) e investigue com calma."], "e": ["Fazer deploy é tirar o app do seu computador e colocar num computador que fica ligado 24 horas na internet. Cada parte vai para um lugar especializado: o front na Vercel, a API no Render, Railway ou Fly, o banco num serviço gerenciado (Neon, Supabase). As variáveis de ambiente são as chaves de cada casa: desenvolvimento usa uma chave, produção usa outra, e nenhuma fica no código."], "l": [], "g": [], "q": [], "c": "# .env.example (vai para o Git, sem valores reais)\nDATABASE_URL=postgresql://usuario:senha@host:5432/banco\nJWT_SECRET=troque-isto\nFRONTEND_URL=http://localhost:5173\n\n# package.json\n\"scripts\": {\n  \"build\": \"tsc\",\n  \"start\": \"node dist/server.js\",\n  \"deploy:migrate\": \"prisma migrate deploy\"\n}\n# No Render: Build = npm ci && npm run build && npm run deploy:migrate\n#            Start = npm start", "u": "Todo projeto do portfólio precisa de link no ar. Recrutador clica, não clona.", "x": "Usar o mesmo banco para desenvolvimento e produção. Um teste apaga dados reais."}, "20-3": {"s": ["Crie a conta e, antes de tudo, um alerta de orçamento (ex: avisar se passar de US$ 5).", "IAM: crie um usuário com só as permissões necessárias. Não use a conta root no dia a dia.", "S3: crie um bucket. O app pede ao servidor uma URL pré-assinada e o navegador envia o arquivo direto para o S3.", "Lambda: uma função que acorda com um evento (upload, horário, requisição), roda e dorme. Você paga por execução."], "e": ["Cloud é alugar computadores, discos e serviços de uma empresa gigante (AWS, Google, Azure) em vez de comprar. Você paga pelo que usa, como conta de luz. Por isso precisa saber fechar a torneira. Para começar, quatro ideias bastam: região (onde fica o data center), IAM (quem pode fazer o quê), S3 (um HD infinito para arquivos) e Lambda (uma função que roda só quando chamada)."], "l": [], "g": [], "q": [], "c": "import { S3Client, PutObjectCommand } from \"@aws-sdk/client-s3\";\nimport { getSignedUrl } from \"@aws-sdk/s3-request-presigner\";\n\nconst s3 = new S3Client({ region: \"sa-east-1\" });\n\napp.post(\"/v1/uploads\", autenticar, async (req, res) => {\n  const chave = `docs/${req.user.sub}/${randomUUID()}.pdf`;\n  const url = await getSignedUrl(s3,\n    new PutObjectCommand({ Bucket: process.env.BUCKET, Key: chave, ContentType: \"application/pdf\" }),\n    { expiresIn: 300 });\n  res.json({ url, chave }); // o front faz PUT direto nessa URL\n});", "u": "Para guardar arquivos de usuários, tarefas agendadas e para conversar sobre infraestrutura na entrevista.", "x": "Deixar o bucket público ou colocar a chave da AWS no front. Dá prejuízo em horas."}, "21-0": {"s": ["Token: pedaço de palavra. Em português, uma palavra costuma dar mais de 1 token. Você paga por tokens de entrada e de saída.", "Janela de contexto: o máximo que o modelo lê de uma vez (instruções + conversa + documentos).", "Temperatura: perto de 0 dá respostas mais previsíveis; mais alta, mais criativas.", "O modelo não tem acesso aos seus dados nem à internet, a não ser que você entregue (contexto) ou dê ferramentas."], "e": ["Um LLM (como o Claude ou o GPT) é um autocompletar gigante que leu uma quantidade enorme de texto. Ele não \"sabe\" coisas como um banco de dados: ele prevê, pedaço por pedaço, qual o próximo texto mais provável. Por isso é ótimo em escrever, resumir e classificar, mas pode inventar com total confiança (alucinar). Ele só enxerga o que cabe na janela de contexto, e cada pedacinho (token) custa dinheiro."], "l": [], "g": [], "q": [], "c": "Entrada (prompt)  -> [ modelo ] -> Saída\n\"Classifique a mensagem em civel, criminal ou trabalhista:\n 'Fui demitido sem receber as férias'\"\n                               -> \"trabalhista\"\n\nCusto aproximado = (tokens de entrada x preço de entrada)\n                 + (tokens de saída   x preço de saída)\n1.000 chamadas x 300 tokens = 300 mil tokens por dia", "u": "Para tarefas de linguagem: classificar, resumir, extrair dados, conversar, gerar rascunhos.", "x": "Usar o LLM para fazer contas ou buscar fatos sem fonte. Use código para contas e dê os dados ao modelo."}, "21-1": {"s": ["Instale o SDK do provedor e coloque a chave numa variável de ambiente.", "system: as instruções fixas. messages: a conversa, alternando user e assistant.", "O modelo não lembra de nada entre chamadas: você reenvia o histórico a cada vez.", "Trate erros de limite (429) e timeout com nova tentativa e mensagem amigável."], "e": ["Chamar um LLM pelo código é como ligar para um especialista muito rápido. Você manda uma mensagem de sistema (quem ele deve ser e as regras), as mensagens da conversa, e recebe a resposta. Isso acontece sempre no seu servidor, porque a chave da API é como o cartão de crédito da empresa: se ficar no front, qualquer um copia e gasta por você. O streaming faz a resposta aparecer palavra por palavra, como no chat."], "l": [], "g": [], "q": [], "c": "import Anthropic from \"@anthropic-ai/sdk\";\nconst client = new Anthropic(); // lê ANTHROPIC_API_KEY do ambiente\n\napp.post(\"/v1/assistente\", autenticar, async (req, res) => {\n  const resposta = await client.messages.create({\n    model: process.env.LLM_MODEL!,\n    max_tokens: 500,\n    system: \"Você é o assistente de um escritório de advocacia. Responda em português, de forma curta. Não dê parecer jurídico.\",\n    messages: req.body.historico, // [{ role: \"user\", content: \"...\" }, ...]\n  });\n  res.json({ texto: resposta.content[0].type === \"text\" ? resposta.content[0].text : \"\" });\n});", "u": "Sempre pelo back-end, com limite de uso por usuário.", "x": "Colocar a chave da API no código do front ou no GitHub. Robôs varrem e usam em minutos."}, "21-2": {"s": ["Um bom prompt tem: papel, contexto, tarefa, regras, exemplos e formato de saída.", "Exemplos (few-shot) mostram o que é certo melhor do que explicações longas.", "Peça JSON com campos fixos e valide com Zod. Se vier inválido, tente de novo uma vez ou use um plano B.", "Monte um conjunto de casos de teste e meça quantos o prompt acerta antes de mudar qualquer coisa."], "e": ["O prompt é o briefing que você entrega a um freelancer muito rápido, mas sem contexto nenhum sobre seu negócio. Quanto mais claro o pedido, menos retrabalho. Para usar a resposta no código, você não quer um texto solto: quer um formulário preenchido, sempre no mesmo formato (JSON). Aí você confere esse formulário com Zod antes de confiar nele."], "l": [], "g": [], "q": [], "c": "const Triagem = z.object({\n  area: z.enum([\"civel\", \"criminal\", \"trabalhista\", \"outro\"]),\n  urgencia: z.enum([\"baixa\", \"media\", \"alta\"]),\n  resumo: z.string().max(200),\n});\n\nconst prompt = `Classifique a mensagem de um cliente de escritório de advocacia.\nResponda APENAS com JSON: {\"area\": ..., \"urgencia\": ..., \"resumo\": ...}\nExemplo: \"Recebi intimação para audiência amanhã\" ->\n{\"area\":\"civel\",\"urgencia\":\"alta\",\"resumo\":\"Audiência marcada para amanhã\"}\n\nMensagem: \"\"\"${mensagem}\"\"\"`;\n\nconst r = Triagem.safeParse(JSON.parse(textoDaIA));\nconst triagem = r.success ? r.data : { area: \"outro\", urgencia: \"media\", resumo: mensagem.slice(0, 200) };", "u": "Toda vez que a resposta da IA vai virar dado no seu sistema.", "x": "Confiar no JSON da IA sem validar. Uma hora ele vem com um campo a mais ou quebrado."}, "21-3": {"s": ["Defina cada ferramenta com nome, descrição clara e schema dos parâmetros.", "Mande a pergunta e as ferramentas ao modelo. Se ele pedir uma ferramenta, você executa no seu código.", "Devolva o resultado ao modelo como uma nova mensagem e chame de novo.", "Repita até ele responder em texto, com limite de passos e confirmação humana antes de ações importantes."], "e": ["Sozinho, o LLM só fala. Tool calling dá mãos para ele: você mostra uma lista de ferramentas (\"consultar horários livres\", \"criar agendamento\") com a descrição de cada uma. O modelo decide quando usar uma, responde \"chame consultar_horarios com a data 10/12\", seu código executa de verdade e devolve o resultado. Ele lê o resultado e continua. Esse ciclo de pensar, usar ferramenta e continuar é o que chamam de agente."], "l": [], "g": [], "q":
