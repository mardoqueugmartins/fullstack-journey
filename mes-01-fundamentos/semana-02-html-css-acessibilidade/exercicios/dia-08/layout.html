<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="layout.css" />
    <title>Layout</title>
  </head>
  <body>
    <div class="pagina">
      <header>
        <h1>Teste de Layout</h1>
      </header>
      <aside>
        <h2>Últimos posts</h2>
        <p>Conteúdo atualizado</p>
        <div class="posts">
          <article>
            <img src="https://placehold.co/300x100" alt="imagem 1" />
            <p>Foto mais recente</p>
          </article>
          <article>
            <img src="https://placehold.co/300x100" alt="imagem 2" />
            <p>Foto mais recente 2</p>
          </article>
          <article>
            <img src="https://placehold.co/300x100" alt="imagem 3" />
            <p>Foto mais recente 3</p>
          </article>
        </div>
      </aside>
      
      <main>
        <section class="principal">
          <article>
            <img src="https://placehold.co/800x400" alt="imagem principal" />
            <p>Foto mais recente 2</p>
          </article>
        </section>
      </main>
      <footer>Todos os direitos reservados.</footer>
    </div>
  </body>
</html>
